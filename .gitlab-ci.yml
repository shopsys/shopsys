stages:
    - build
    - test
    - review
    - deploy
    - service

.only-default: &only-default
    tags:
        - docker
    rules:
        -   if: '$CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"'

variables:
    TAG: ${CI_REGISTRY_IMAGE}/${CI_COMMIT_REF_SLUG}:${CI_COMMIT_SHA}
    STOREFRONT_TAG: ${CI_REGISTRY_IMAGE}/${CI_COMMIT_REF_SLUG}:${CI_COMMIT_SHA}-storefront
    STOREFRONT_STYLEGUIDE_TAG: ${CI_REGISTRY_IMAGE}/${CI_COMMIT_REF_SLUG}:${CI_COMMIT_SHA}-storefront-styleguide
    HOST: ${CI_COMMIT_REF_SLUG}.${CI_PROJECT_NAME}.${REVIEW_URL}
    HOSTS: ${HOST}, en.${HOST}
    STOREFRONT_STYLEGUIDE_HOSTS: sfs.${HOST}, en.sfs.${HOST}
    COMPOSE_PROJECT_NAME: ${CI_PROJECT_NAME}__${CI_COMMIT_REF_SLUG}

before_script:
    - echo ${CI_REGISTRY_PASSWORD} | docker login -u ${CI_REGISTRY_USER} ${CI_REGISTRY} --password-stdin

build:
    stage: build
    <<: *only-default
    script:
        - cp -R ./docker/nginx/ ./app/docker/nginx/
        - cp ./schema.graphql ./app/schema.graphql
        - cd ./app/
        - docker build -f ./docker/php-fpm/Dockerfile --target production --compress -t ${TAG} .
        - docker push ${TAG}
    interruptible: true

build-storefront:
    stage: build
    <<: *only-default
    script:
        - cp ./schema.graphql ./storefront/schema.graphql
        - docker build -f ./storefront/docker/Dockerfile --target production --compress -t ${STOREFRONT_TAG} ./storefront
        - docker push ${STOREFRONT_TAG}
    interruptible: true

build-storefront-styleguide:
    stage: build
    <<: *only-default
    script:
        - docker build -f ./storefront/docker/styleguide/Dockerfile --target ci --compress -t ${STOREFRONT_STYLEGUIDE_TAG} ./storefront
        - docker push ${STOREFRONT_STYLEGUIDE_TAG}
    interruptible: true

test:standards:
    stage: test
    <<: *only-default
    variables:
        GIT_STRATEGY: none
    script:
        - docker run -i ${TAG} /bin/bash -c "mv PRODUCTION DEVELOPMENT; php phing composer-dev standards"
    interruptible: true

test:graphql-schema-check:
    stage: test
    <<: *only-default
    variables:
        GIT_STRATEGY: none
    script:
        - docker run ${TAG} ./check-schema.sh
    interruptible: true

test:standards-storefront:
    stage: test
    <<: *only-default
    variables:
        GIT_STRATEGY: none
    script:
        - docker run -i ${STOREFRONT_TAG} /bin/sh -c "npm run lint"
    interruptible: true

test:jest-storefront:
    stage: test
    <<: *only-default
    variables:
        GIT_STRATEGY: none
    script:
        - docker run -i ${STOREFRONT_TAG} /bin/sh -c "npm run tests-jest"
    interruptible: true

test:storefront-codegen-check:
    stage: test
    <<: *only-default
    variables:
        GIT_STRATEGY: none
    script:
        - docker run ${STOREFRONT_TAG} ./check-code-gen.sh
    interruptible: true

test:functional:
    image: tmaier/docker-compose:latest
    stage: test
    <<: *only-default
    script:
        - cp -f ./gitlab/docker-compose-ci.yml ./docker-compose.yml
        - docker-compose up -d
        - docker-compose exec -T php-fpm /bin/bash -c "mv PRODUCTION DEVELOPMENT; php phing composer-dev db-create test-db-create build-demo-dev-quick frontend-api-generate-new-keys error-pages-generate tests"
    interruptible: true

test:acceptance:
    image: tmaier/docker-compose:latest
    stage: test
    <<: *only-default
    artifacts:
        paths:
            - codeception/
        when: on_failure
        expire_in: 1 day
    script:
        - cp -f ./gitlab/docker-compose-ci.yml ./docker-compose.yml
        - docker-compose up -d
        - docker-compose exec -T php-fpm /bin/bash -c "mv PRODUCTION DEVELOPMENT; php phing composer-dev db-create test-db-create build-demo-dev-quick error-pages-generate test-db-demo test-elasticsearch-index-recreate test-elasticsearch-export tests-acceptance-build tests-acceptance"
    after_script:
        - mkdir -p codeception/
        - docker cp shopsys-framework-php-fpm:/var/www/html/var/log/codeception/ ./
    interruptible: true

test:storefront-acceptance:
    image: tmaier/docker-compose:latest
    stage: test
    <<: *only-default
    artifacts:
        paths:
            - storefront/cypress/videos/
            - storefront/cypress/screenshots/
            - php-fpm-log.txt
            - webserver-log.txt
            - storefront-log.txt
        expire_in: 1 day
    script:
        - cp -f ./gitlab/docker-compose-ci-storefront-acceptance.yml ./docker-compose.yml
        - docker-compose up -d
        - docker-compose exec -T php-fpm sed -i "s/http:\/\/127.0.0.1:8000/http:\/\/webserver:8080/g" config/domains_urls.yaml
        - docker-compose exec -T php-fpm php phing -D production.confirm.action=y composer-prod db-create build-demo-dev-quick frontend-api-generate-new-keys error-pages-generate
        - docker-compose run cypress
    after_script:
        - docker-compose logs php-fpm > php-fpm-log.txt
        - docker-compose logs webserver > webserver-log.txt
        - docker-compose logs storefront > storefront-log.txt
    interruptible: true

review:
    stage: review
    environment:
        name: "review/${CI_COMMIT_REF_SLUG}"
        url: https://${CI_COMMIT_REF_SLUG}.${CI_PROJECT_NAME}.${REVIEW_URL}
        on_stop: review:stop
        auto_stop_in: 1 week
    needs:
        - build
        - build-storefront
    <<: *only-default
    artifacts:
        paths:
            - schema.graphql
    script:
        - cp -f ./gitlab/docker-compose-ci-review.yml ./docker-compose.yml
        - docker-compose down --rmi all -v --remove-orphans
        - docker-compose up -d
        - "docker-compose exec -T php-fpm sed -i \"s/database_name:.*/database_name: ${COMPOSE_PROJECT_NAME}/\" config/parameters.yaml"
        - docker-compose exec -T php-fpm sed -i "s/http:\/\/127.0.0.1:8000/https:\/\/${HOST}/g" config/domains_urls.yaml
        - docker-compose exec -T php-fpm sed -i "s/http:\/\/127.0.0.2:8000/https:\/\/en.${HOST}/g" config/domains_urls.yaml
        - docker-compose exec -T php-fpm php phing -D production.confirm.action=y clean db-create build-review-ci
        - echo -e "Available hosts \n - https://${HOST}\n - https://en.${HOST}\n"
    after_script:
        - docker-compose exec -T php-fpm php phing frontend-api-generate-graphql-schema
        - docker cp ${COMPOSE_PROJECT_NAME}_php-fpm_1:/var/www/html/schema.graphql ./schema.graphql
    tags:
        - review
    interruptible: true

review:stop:
    stage: review
    variables:
        GIT_STRATEGY: none
    needs:
        - build
    <<: *only-default
    tags:
        - review
    script:
        - cp -f ./gitlab/docker-compose-ci-review.yml ./docker-compose.yml
        - docker-compose exec -T php-fpm php phing -D production.confirm.action=y elasticsearch-index-delete
        - docker-compose down --rmi all -v --remove-orphans
        - /home/ci/clean.sh ${COMPOSE_PROJECT_NAME}
    rules:
        -   if: '$CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"'
            when: manual
            allow_failure: true
    environment:
        name: review/${CI_COMMIT_REF_SLUG}
        action: stop

repository:clean:
    stage: service
    image: dwdraju/alpine-curl-jq
    tags:
        - docker
    rules:
        -   if: '$CI_PIPELINE_SOURCE == "schedule"'
    before_script:
        - chmod +x ./gitlab/scripts/repository-clean.sh
    script:
        - ./gitlab/scripts/repository-clean.sh

security:check:
    stage: service
    tags:
        - docker
    needs:
        - build
    rules:
        -   if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE != "schedule"'
    script:
        - docker run -i ${TAG} composer security-check

.deploy: &deploy
    image:
        name: registry.shopsys.cz/devops/kubernetes-buildpack:1.1
    stage: deploy
    tags:
        - docker
    rules:
        -   if: '$CI_PIPELINE_SOURCE == "schedule"'
            when: never
    script:
        - cd ./app/
        - docker create -ti --name image ${TAG} bash
        - docker cp image:/var/www/html/var/ ./
        - chmod +x ./deploy/deploy-project.sh && ./deploy/deploy-project.sh deploy

deploy:production:
    <<: *deploy
    resource_group: deploy_production
    needs:
        - build
    rules:
        -   if: '$CI_PIPELINE_SOURCE == "schedule"'
            when: never
        -   if: '$CI_COMMIT_BRANCH == "master"'
            allow_failure: false
        -   if: '$CI_COMMIT_BRANCH =~ /^master-.*$/'
            when: manual
            allow_failure: false
    environment:
        name: production
        url: https://${DOMAIN_HOSTNAME_1}
        kubernetes:
            namespace: ${PROJECT_NAME}

deploy:devel:
    <<: *deploy
    resource_group: deploy_devel
    needs:
        - build
    rules:
        -   if: '$CI_PIPELINE_SOURCE == "schedule"'
            when: never
        -   if: '$CI_COMMIT_BRANCH == "devel" || $CI_COMMIT_BRANCH =~ /^devel-.*$/'
    environment:
        name: devel
        url: https://${DOMAIN_HOSTNAME_1}
        kubernetes:
            namespace: ${PROJECT_NAME}
