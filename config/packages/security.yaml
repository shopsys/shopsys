        - { path: ^/%admin_url%/store/delete, roles: ROLE_STORE_FULL }
        - { path: ^/%admin_url%/store/setdefault/, roles: ROLE_STORE_FULL }
        - { path: ^/%admin_url%/store/, roles: ROLE_STORE_VIEW }
        # parameter values
        - { path: ^/%admin_url%/parameter-value/, roles: ROLE_PARAMETER_VALUE_VIEW }
