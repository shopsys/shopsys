security:
    encoders:
        Symfony\Component\Security\Core\User\UserInterface:
            algorithm: bcrypt
            cost: 12

    role_hierarchy:
        ROLE_SUPER_ADMIN: [ROLE_ADMIN, ROLE_ALL]
        ROLE_ALL:
            - ROLE_ORDER_FULL
            - ROLE_CUSTOMER_FULL
            - ROLE_NEWSLETTER_FULL
            - ROLE_PROMO_CODE_FULL
            - ROLE_PRODUCT_FULL
            - ROLE_TOP_PRODUCT_FULL
            - ROLE_BESTSELLING_PRODUCT_FULL
            - ROLE_FLAG_FULL
            - ROLE_PARAMETER_FULL
            - ROLE_UNIT_FULL
            - ROLE_CATEGORY_FULL
            - ROLE_TOP_CATEGORY_FULL
            - ROLE_PRICING_GROUP_FULL
            - ROLE_VAT_FULL
            - ROLE_ARTICLE_FULL
            - ROLE_ADVERT_FULL
            - ROLE_SLIDER_ITEM_FULL
            - ROLE_NAVIGATION_FULL
            - ROLE_BLOG_CATEGORY_FULL
            - ROLE_BLOG_ARTICLE_FULL
            - ROLE_NOTIFICATION_BAR_FULL
            - ROLE_ORDER_SUBMITTED_FULL
            - ROLE_LEGAL_CONDITIONS_FULL
            - ROLE_PRIVACY_POLICY_FULL
            - ROLE_PERSONAL_DATA_FULL
            - ROLE_COOKIES_FULL
            - ROLE_ADMINISTRATOR_FULL
            - ROLE_DOMAIN_FULL
            - ROLE_SHOP_INFO_FULL
            - ROLE_MAIL_SETTING_FULL
            - ROLE_MAIL_TEMPLATE_FULL
            - ROLE_FREE_TRANSPORT_AND_PAYMENT_FULL
            - ROLE_TRANSPORT_AND_PAYMENT_FULL
            - ROLE_ORDER_STATUS_FULL
            - ROLE_BRAND_FULL
            - ROLE_COUNTRY_FULL
            - ROLE_STORE_FULL
            - ROLE_PARAMETER_VALUE_FULL
            - ROLE_TRANSPORT_TYPE_FULL
            - ROLE_IMAGE_SIZE_VIEW
            - ROLE_SEO_FULL
            - ROLE_CATEGORY_SEO_FULL
        ROLE_ORDER_FULL: [ROLE_ORDER_VIEW]
        ROLE_CUSTOMER_FULL: [ROLE_CUSTOMER_VIEW]
        ROLE_NEWSLETTER_FULL: [ROLE_NEWSLETTER_VIEW]
        ROLE_PROMO_CODE_FULL: [ROLE_PROMO_CODE_VIEW]
        ROLE_PRODUCT_FULL: [ROLE_PRODUCT_VIEW]
        ROLE_TOP_PRODUCT_FULL: [ROLE_TOP_PRODUCT_VIEW]
        ROLE_BESTSELLING_PRODUCT_FULL: [ROLE_BESTSELLING_PRODUCT_VIEW]
        ROLE_FLAG_FULL: [ROLE_FLAG_VIEW]
        ROLE_PARAMETER_FULL: [ROLE_PARAMETER_VIEW]
        ROLE_UNIT_FULL: [ROLE_UNIT_VIEW]
        ROLE_CATEGORY_FULL: [ROLE_CATEGORY_VIEW]
        ROLE_TOP_CATEGORY_FULL: [ROLE_TOP_CATEGORY_VIEW]
        ROLE_PRICING_GROUP_FULL: [ROLE_PRICING_GROUP_VIEW]
        ROLE_VAT_FULL: [ROLE_VAT_VIEW]
        ROLE_ARTICLE_FULL: [ROLE_ARTICLE_VIEW]
        ROLE_ADVERT_FULL: [ROLE_ADVERT_VIEW]
        ROLE_SLIDER_ITEM_FULL: [ROLE_SLIDER_ITEM_VIEW]
        ROLE_NAVIGATION_FULL: [ROLE_NAVIGATION_VIEW]
        ROLE_BLOG_CATEGORY_FULL: [ROLE_BLOG_CATEGORY_VIEW]
        ROLE_BLOG_ARTICLE_FULL: [ROLE_BLOG_ARTICLE_VIEW]
        ROLE_NOTIFICATION_BAR_FULL: [ROLE_NOTIFICATION_BAR_VIEW]
        ROLE_ORDER_SUBMITTED_FULL: [ROLE_ORDER_SUBMITTED_VIEW]
        ROLE_LEGAL_CONDITIONS_FULL: [ROLE_LEGAL_CONDITIONS_VIEW]
        ROLE_PRIVACY_POLICY_FULL: [ROLE_PRIVACY_POLICY_VIEW]
        ROLE_PERSONAL_DATA_FULL: [ROLE_PERSONAL_DATA_VIEW]
        ROLE_COOKIES_FULL: [ROLE_COOKIES_VIEW]
        ROLE_ADMINISTRATOR_FULL: [ROLE_ADMINISTRATOR_VIEW]
        ROLE_DOMAIN_FULL: [ROLE_DOMAIN_VIEW]
        ROLE_SHOP_INFO_FULL: [ROLE_SHOP_INFO_VIEW]
        ROLE_MAIL_SETTING_FULL: [ROLE_MAIL_SETTING_VIEW]
        ROLE_MAIL_TEMPLATE_FULL: [ROLE_MAIL_TEMPLATE_VIEW]
        ROLE_FREE_TRANSPORT_AND_PAYMENT_FULL: [ROLE_FREE_TRANSPORT_AND_PAYMENT_VIEW]
        ROLE_TRANSPORT_AND_PAYMENT_FULL: [ROLE_TRANSPORT_AND_PAYMENT_VIEW]
        ROLE_ORDER_STATUS_FULL: [ROLE_ORDER_STATUS_VIEW]
        ROLE_BRAND_FULL: [ROLE_BRAND_VIEW]
        ROLE_COUNTRY_FULL: [ROLE_COUNTRY_VIEW]
        ROLE_STORE_FULL: [ROLE_STORE_VIEW]
        ROLE_PARAMETER_VALUE_FULL: [ROLE_PARAMETER_VALUE_VIEW]
        ROLE_TRANSPORT_TYPE_FULL: [ROLE_TRANSPORT_TYPE_VIEW]
        ROLE_SEO_FULL: [ROLE_SEO_VIEW]
        ROLE_CATEGORY_SEO_FULL: [ROLE_CATEGORY_SEO_VIEW]

    providers:
        administrators:
            id: Shopsys\FrameworkBundle\Model\Administrator\Security\AdministratorUserProvider

        user_identities:
            id: Shopsys\FrameworkBundle\Model\Customer\User\FrontendCustomerUserProvider

        frontend_api_user_identities:
            id: Shopsys\FrontendApiBundle\Model\User\FrontendApiUserProvider

    firewalls:
        # see Shopsys\FrameworkBundle\Model\Administrator\Security\AdministratorFrontSecurityFacade
        administration:
            pattern: ^/(%admin_url%/|efconnect|elfinder)
            user_checker: Shopsys\FrameworkBundle\Model\Security\AdministratorChecker
            anonymous: ~
            provider: administrators
            access_denied_url: "/%admin_url%/access-denied/"
            form_login:
                check_path: admin_login_check
                login_path: admin_login
                default_target_path: admin_default_dashboard
                use_referer: true
                username_parameter: "admin_login_form[username]"
                password_parameter: "admin_login_form[password]"
                csrf_parameter: "admin_login_form[_token]"
            logout:
                path: admin_logout
                success_handler: Shopsys\FrameworkBundle\Model\Security\AdminLogoutHandler
                csrf_parameter: _csrf_token
                csrf_token_generator: security.csrf.token_manager
                csrf_token_id: admin_logout
                invalidate_session: false
            two_factor:
                auth_form_path: 2fa_login    # The route name you have used in the routes.yaml
                check_path: 2fa_login_check  # The route name you have used in the routes.yaml
        frontend_api:
            pattern: ^/graphql
            provider: frontend_api_user_identities
            stateless: true
            anonymous: true
            guard:
                authenticators:
                    - Shopsys\FrontendApiBundle\Model\Token\TokenAuthenticator
        frontend:
            pattern: ^/
            anonymous: ~
            provider: user_identities
            form_login:
                check_path: front_login_check
                login_path: front_login
                username_parameter: "front_login_form[email]"
                password_parameter: "front_login_form[password]"
                csrf_parameter: "front_login_form[_token]"
                success_handler: Shopsys\FrameworkBundle\Model\Security\CustomerLoginHandler
                failure_handler: Shopsys\FrameworkBundle\Model\Security\CustomerLoginHandler
                remember_me: true
            remember_me:
                secret: "%secret%"
                lifetime: 2592000 # 30 days
                path: /
                domain: ~
                remember_me_parameter: "front_login_form[rememberMe]"
            logout:
                path: front_logout
                success_handler: Shopsys\FrameworkBundle\Model\Security\FrontLogoutHandler
                csrf_parameter: _csrf_token
                csrf_token_generator: security.csrf.token_manager
                csrf_token_id: frontend_logout
                invalidate_session: false

    access_control:
        # This makes the logout route accessible during two-factor authentication. Allows the user to
        # cancel two-factor authentication, if they need to.
        - { path: ^/%admin_url%/logout, role: IS_AUTHENTICATED_ANONYMOUSLY }
        # This ensures that the form can only be accessed when two-factor authentication is in progress.
        - { path: ^/%admin_url%/2fa, role: IS_AUTHENTICATED_2FA_IN_PROGRESS }
        # same pattern must be in routing_front.yaml
        - { path: ^/login-as-remembered-user/$, roles: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/%admin_url%/superadmin/, roles: ROLE_SUPER_ADMIN }
        - { path: ^/%admin_url%/cron/*, roles: ROLE_SUPER_ADMIN }
        - { path: ^/%admin_url%/currency/, roles: ROLE_SUPER_ADMIN }
        - { path: ^/%admin_url%/translation/list/$, roles: ROLE_SUPER_ADMIN }
        - { path: ^/%admin_url%/$, roles: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/%admin_url%/authorization/$, roles: IS_AUTHENTICATED_ANONYMOUSLY }
        # orders
        - { path: ^/%admin_url%/order/delete, roles: ROLE_ORDER_FULL }
        - { path: ^/%admin_url%/order/add-product/, roles: ROLE_ORDER_FULL }
        - { path: ^/%admin_url%/order/, roles: ROLE_ORDER_VIEW }
        # customers
        - { path: ^/%admin_url%/customer/new, roles: ROLE_CUSTOMER_FULL }
        - { path: ^/%admin_url%/customer/delete, roles: ROLE_CUSTOMER_FULL }
        - { path: ^/%admin_url%/customer/, roles: ROLE_CUSTOMER_VIEW }
        # newsletter
        - { path: ^/%admin_url%/newsletter/delete, roles: ROLE_NEWSLETTER_FULL }
        - { path: ^/%admin_url%/newsletter/export-csv, roles: ROLE_NEWSLETTER_FULL }
        - { path: ^/%admin_url%/newsletter/, roles: ROLE_NEWSLETTER_VIEW }
        # promo codes
        - { path: ^/%admin_url%/promo-code/new, roles: ROLE_PROMO_CODE_FULL }
        - { path: ^/%admin_url%/promo-code/new-mass-generate, roles: ROLE_PROMO_CODE_FULL }
        - { path: ^/%admin_url%/promo-code/delete, roles: ROLE_PROMO_CODE_FULL }
        - { path: ^/%admin_url%/promo-code/, roles: ROLE_PROMO_CODE_VIEW }
        # products, top/bestselling products, flags, parameters, and units
        - { path: ^/%admin_url%/product/new, roles: ROLE_PRODUCT_FULL }
        - { path: ^/%admin_url%/product/create-variant, roles: ROLE_PRODUCT_FULL }
        - { path: ^/%admin_url%/product/delete, roles: ROLE_PRODUCT_FULL }
        - { path: ^/%admin_url%/product/top-product, roles: ROLE_TOP_PRODUCT_VIEW }
        - { path: ^/%admin_url%/product/bestselling-product, roles: ROLE_BESTSELLING_PRODUCT_VIEW }
        - { path: ^/%admin_url%/product/flag/delete, roles: ROLE_FLAG_FULL }
        - { path: ^/%admin_url%/product/flag/, roles: ROLE_FLAG_VIEW }
        - { path: ^/%admin_url%/product/parameter/delete, roles: ROLE_PARAMETER_FULL }
        - { path: ^/%admin_url%/product/parameter/, roles: ROLE_PARAMETER_VIEW }
        - { path: ^/%admin_url%/product/unit/delete, roles: ROLE_UNIT_FULL }
        - { path: ^/%admin_url%/product/unit/, roles: ROLE_UNIT_VIEW }
        - { path: ^/%admin_url%/product/, roles: ROLE_PRODUCT_VIEW }
        # categories and top categories
        - { path: ^/%admin_url%/category/new, roles: ROLE_CATEGORY_FULL }
        - { path: ^/%admin_url%/category/delete, roles: ROLE_CATEGORY_FULL }
        - { path: ^/%admin_url%/category/save-order/, roles: ROLE_CATEGORY_FULL }
        - { path: ^/%admin_url%/category/apply-sorting/, roles: ROLE_CATEGORY_FULL }
        - { path: ^/%admin_url%/category/top-category, roles: ROLE_TOP_CATEGORY_VIEW }
        - { path: ^/%admin_url%/category/, roles: ROLE_CATEGORY_VIEW }
        # pricing groups
        - { path: ^/%admin_url%/pricing/group/delete, roles: ROLE_PRICING_GROUP_FULL }
        - { path: ^/%admin_url%/pricing/group/, roles: ROLE_PRICING_GROUP_VIEW }
        # vats
        - { path: ^/%admin_url%/vat/delete, roles: ROLE_VAT_FULL }
        - { path: ^/%admin_url%/vat/, roles: ROLE_VAT_VIEW }
        # articles
        - { path: ^/%admin_url%/article/delete, roles: ROLE_ARTICLE_FULL }
        - { path: ^/%admin_url%/article/new, roles: ROLE_ARTICLE_FULL }
        - { path: ^/%admin_url%/article/save-ordering/, roles: ROLE_ARTICLE_FULL }
        - { path: ^/%admin_url%/article/, roles: ROLE_ARTICLE_VIEW }
        # adverts
        - { path: ^/%admin_url%/advert/new, roles: ROLE_ADVERT_FULL }
        - { path: ^/%admin_url%/advert/delete, roles: ROLE_ADVERT_FULL }
        - { path: ^/%admin_url%/advert/, roles: ROLE_ADVERT_VIEW }
        # slider items
        - { path: ^/%admin_url%/slider/item/new, roles: ROLE_SLIDER_ITEM_FULL }
        - { path: ^/%admin_url%/slider/item/delete, roles: ROLE_SLIDER_ITEM_FULL }
        - { path: ^/%admin_url%/slider/, roles: ROLE_SLIDER_ITEM_VIEW }
        # navigation
        - { path: ^/%admin_url%/navigation/new, roles: ROLE_NAVIGATION_FULL }
        - { path: ^/%admin_url%/navigation/delete, roles: ROLE_NAVIGATION_FULL }
        - { path: ^/%admin_url%/navigation/, roles: ROLE_NAVIGATION_VIEW }
        # blog categories
        - { path: ^/%admin_url%/blog/category/new, roles: ROLE_BLOG_CATEGORY_FULL }
        - { path: ^/%admin_url%/blog/category/delete, roles: ROLE_BLOG_CATEGORY_FULL }
        - { path: ^/%admin_url%/blog/category/apply-sorting/, roles: ROLE_BLOG_CATEGORY_FULL }
        - { path: ^/%admin_url%/blog/category/, roles: ROLE_BLOG_CATEGORY_VIEW }
        # blog articles
        - { path: ^/%admin_url%/blog/article/new, roles: ROLE_BLOG_ARTICLE_FULL }
        - { path: ^/%admin_url%/blog/article/delete, roles: ROLE_BLOG_ARTICLE_FULL }
        - { path: ^/%admin_url%/blog/article/, roles: ROLE_BLOG_ARTICLE_VIEW }
        # notification bar
        - { path: ^/%admin_url%/notification-bar/new, roles: ROLE_NOTIFICATION_BAR_FULL }
        - { path: ^/%admin_url%/notification-bar/delete, roles: ROLE_NOTIFICATION_BAR_FULL }
        - { path: ^/%admin_url%/notification-bar/, roles: ROLE_NOTIFICATION_BAR_VIEW }
        # order submitted page setting
        - { path: ^/%admin_url%/customer-communication/order-submitted, roles: ROLE_ORDER_SUBMITTED_VIEW }
        # legal conditions setting
        - { path: ^/%admin_url%/legal-conditions/setting, roles: ROLE_LEGAL_CONDITIONS_VIEW }
