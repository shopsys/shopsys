        - { path: ^/%admin_url%/administrator/new, roles: ROLE_ADMINISTRATOR_FULL }
        - { path: ^/%admin_url%/administrator/delete, roles: ROLE_ADMINISTRATOR_FULL }
        - { path: ^/%admin_url%/administrator/edit/, roles: ROLE_ADMIN }
