        # shop info
        - { path: ^/%admin_url%/shop-info/setting, roles: ROLE_SHOP_INFO_VIEW }
        # mail setting
        - { path: ^/%admin_url%/mail/setting, roles: ROLE_MAIL_SETTING_VIEW }
        # mail templates
        - { path: ^/%admin_url%/mail/create, roles: ROLE_MAIL_TEMPLATE_FULL }
