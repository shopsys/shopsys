# disable logging in tests
monolog:
    handlers:
        # display cron.DEBUG messages in console for -v, -vv and -vvv verbosities
        console_output:
            type: "null"
        cron_output:
            type: "null"
        main:
            type: "null"
            excluded_404s: false
        log_stream:
            type: "null"
