Payment:
    type: object
    inherits:
        - 'PaymentDecorator'
    config:
        fields:
            type:
                type: "String!"
                description: "Type of payment"
            goPayPaymentMethod:
                type: "GoPayPaymentMethod"
                description: "Additional data for GoPay payment"
            price:
                type: "Price"
                description: "Payment price"
                resolve: '@=service("App\\FrontendApi\\Model\\Resolver\\Price\\PriceResolver").resolveByPayment(value, args["cartUuid"])'
                args:
                    cartUuid:
                        type: "Uuid"
                        defaultValue: null
            images:
                type: "[Image]!"
                description: "Payment images"
                resolve: '@=resolver("paymentImageResolver", [value, args["type"], args["sizes"]])'
                args:
                    type:
                        type: "String"
                        defaultValue: null
                    sizes:
                        type: "[String!]"
                        defaultValue: null
