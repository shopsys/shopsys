Store:
    type: object
    config:
        fields:
            slug:
                type: "String!"
                description: "Store URL slug"
            uuid:
                type: "Uuid!"
                description: "UUID"
            isDefault:
                type: "Boolean!"
                description: "Is set as default store"
            name:
                type: "String!"
                description: "Store name"
            description:
                type: "String"
                description: "Store description"
            street:
                type: "String!"
                description: "Store address street"
            city:
                type: "String!"
                description: "Store address city"
            postcode:
                type: "String!"
                description: "Store address postcode"
            country:
                type: "String!"
                description: "Store address country code"
            openingHours:
                type: "String"
                description: "Store opening hours"
            contactInfo:
                type: "String"
                description: ""
            specialMessage:
                type: "String"
                description: ""
            locationLatitude:
                type: "String"
                description: "Store location latitude"
            locationLongitude:
                type: "String"
                description: "Store location longitude"
