Query:
    type: object
    config:
        fields:
            stores:
                type: "StoreConnection"
                argsBuilder: "Relay::Connection"
                resolve: "@=resolver('stores', [args, args['placement']])"
                args:
                    placement:
                        type: "String"
                description: "Returns list of stores that can be paginated using `first`, `last`, `before` and `after` keywords and filtered by `placement`"
    inherits:
        - 'QueryDecorator'
    config:
        fields:
            navigation:
                type: '[NavigationItem!]!'
                resolve: "@=resolver('navigationResolver')"
                description: "Returns complete navigation menu"
            CurrentCompanyCustomerUser:
                type: 'CurrentCompanyCustomerUser'
            CurrentRegularCustomerUser:
                type: 'CurrentRegularCustomerUser'
            promotedCategories:
                type: '[Category!]!'
                resolve: "@=resolver('promotedCategoriesResolver')"
                description: "Returns promoted categories"
