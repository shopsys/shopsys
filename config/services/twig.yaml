parameters:
    fp_js_form_validator.twig_extension.class: 'App\Twig\JsFormValidatorTwigExtension'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    App\Twig\:
        resource: '../../src/Twig/'
        exclude: '../../src/Twig/{JsFormValidatorTwigExtension.php}'

    App\Twig\LocalizationExtension:
        arguments:
            - '%shopsys.web_dir%'

    App\Twig\PriceExtension: ~

    Shopsys\FrameworkBundle\Twig\LocalizationExtension:
        alias: App\Twig\LocalizationExtension
    Shopsys\FrameworkBundle\Twig\PriceExtension:
        alias: App\Twig\PriceExtension

    App\Twig\ImageExtension:
        arguments:
            $frontDesignImageUrlPrefix: '%shopsys.front_design_image_url_prefix%'
            $isLazyLoadEnabled: '%shopsys.image.enable_lazy_load%'

    Shopsys\ReadModelBundle\Twig\ImageExtension:
        alias: App\Twig\ImageExtension

    Shopsys\FrameworkBundle\Twig\ImageExtension:
        alias: App\Twig\ImageExtension

    Shopsys\FrameworkBundle\Twig\MailerSettingExtension:
        alias: App\Twig\MailerSettingExtension
