-   name: payment
    class: Shopsys\FrameworkBundle\Model\Payment\Payment
    sizes:
        -   name: ~
            width: ~
            height: 32
            crop: false
            occurrence: 'Front-end: Ordering process'
            additionalSizes:
                - {width: ~, height: 64, media: "only screen and (-webkit-min-device-pixel-ratio: 1.5)"}

-   name: category
    class: Shopsys\FrameworkBundle\Model\Category\Category
    sizes:
        -   name: ~
            width: 190
            height: 130
            crop: false
            occurrence: 'Front-end: Product list by category'
            additionalSizes:
                - {width: 240, height: ~, media: "only screen and (max-width: 599px) and (-webkit-min-device-pixel-ratio: 1.5)"}
                - {width: 380, height: ~, media: "only screen and (min-width: 600px) and (-webkit-min-device-pixel-ratio: 1.5)"}

-   name: product
    class: Shopsys\FrameworkBundle\Model\Product\Product
    multiple: true
    sizes:
        -   name: ~
            width: 605
            height: ~
            crop: false
            occurrence: 'Front-end: Main image in product detail'
            additionalSizes:
                - {width: 710, height: ~, media: "(min-width: 480px) and (max-width: 768px)"}
                - {width: 1210, height: ~, media: "only screen and (min-width: 769px) and (-webkit-min-device-pixel-ratio: 1.5)"}
        -   name: galleryThumbnail
            width: 200
            height: ~
            crop: false
            occurrence: 'Front-end: Thumbnail of images under the main image in product detail'
            additionalSizes:
                - {width: 400, height: ~, media: "only screen and (-webkit-min-device-pixel-ratio: 1.5)"}
        -   name: modal
            width: 96
            height: ~
            crop: false
            occurrence: 'Front-end: Product in modal'
            additionalSizes:
                - {width: 192, height: ~, media: "only screen and (-webkit-min-device-pixel-ratio: 1.5)"}
        -   name: list
            width: 300
            height: ~
            crop: false
            occurrence: 'Front-end: Listing of products in section, listing of products on special offer'
            additionalSizes:
                - {width: 600, height: ~, media: "only screen and (-webkit-min-device-pixel-ratio: 1.5)"}
        -   name: thumbnail
            width: 90
            height: 90
            crop: false
            occurrence: 'Front-end: preview in cart during ordering process'
            additionalSizes:
                - {width: 180, height: ~, media: "only screen and (-webkit-min-device-pixel-ratio: 1.5)"}
        -   name: thumbnailSearch
            width: 32
            height: ~
            crop: false
            occurrence: 'Front-end: Preview in autocomplete for search'
            additionalSizes:
                - {width: 64, height: ~, media: "only screen and (-webkit-min-device-pixel-ratio: 1.5)"}

-   name: productSeries
    class: App\Model\Product\Series\ProductSeries
    multiple: true
    sizes:
        -   name: preview
            width: 445
            height: ~
            crop: false
            occurrence: 'Front-end: Main image in product series detail and list'
            additionalSizes:
                - {width: 710, height: ~, media: "(min-width: 480px) and (max-width: 768px)"}
                - {width: 890, height: ~, media: "only screen and (-webkit-min-device-pixel-ratio: 1.5)"}
        -   name: previewDetail
            width: 450
            height: ~
            crop: false
            occurrence: 'Front-end: Main image in product series detail and list'
            additionalSizes:
                - {width: 900, height: ~, media: "only screen and (-webkit-min-device-pixel-ratio: 1.5)"}
        -   name: previewDetailSmall
            width: 184
            height: ~
            crop: false
            occurrence: 'Front-end: Main image in product series detail and list'
            additionalSizes:
                - {width: 368, height: ~, media: "only screen and (-webkit-min-device-pixel-ratio: 1.5)"}
        -   name: galleryThumbnail
            width: 120
            height: 80
            crop: false
            occurrence: 'Front-end: Thumbnail of images under the main image in product series detail'
        -   name: largePreview
            width: 690
            height: ~
            crop: false
            occurrence: 'Front-end: in detail'
            additionalSizes:
                - {width: 1380, height: ~, media: "only screen and (-webkit-min-device-pixel-ratio: 1.5)"}

-   name: sliderItem
    class: Shopsys\FrameworkBundle\Model\Slider\SliderItem
    types:
        -   name: web
            sizes:
                -   name: ~
                    width: 1045
                    height: 290
                    crop: false
                    occurrence: 'Front-end: Main page slider'
                -   name: retinaSlider
                    width: 2090
                    height: ~
                    crop: false
                    occurrence: 'Front-end: Main page slider - retina display'
        -   name: mobile
            sizes:
                -   name: ~
                    width: 345
                    height: ~
                    crop: false
                    occurrence: 'Front-end: Mobile main page slider'
                -   name: sliderSmall
                    width: 330
                    height: ~
                    crop: false
                    occurrence: 'Front-end: Mobile main page slider'
                -   name: retinaSlider
                    width: 690
                    height: ~
                    crop: false
                    occurrence: 'Front-end: Mobile main page slider - retina display small'
                -   name: retinaSliderSmall
                    width: 660
                    height: ~
                    crop: false
                    occurrence: 'Front-end: Mobile main page slider - retina display'

-   name: transport
    class: Shopsys\FrameworkBundle\Model\Transport\Transport
    sizes:
        -   name: ~
            width: ~
            height: 32
            crop: false
            occurrence: 'Front-end: Ordering process'
            additionalSizes:
                - {width: ~, height: 64, media: "only screen and (-webkit-min-device-pixel-ratio: 1.5)"}

-   name: noticer
    class: Shopsys\FrameworkBundle\Model\Advert\Advert
    types:
        -   name: web
            sizes:
                -   name: header
                    width: 1160
                    height: ~
                    crop: false
                    occurrence: 'Front-end: Advertising under heading'
                -   name: footer
                    width: 1160
                    height: ~
                    crop: false
                    occurrence: 'Front-end: Advertising above footer'
                -   name: productList
                    width: 900
                    height: ~
                    crop: false
                    occurrence: 'Front-end: Advertising in category (above the category name)'
                -   name: cartPreview
                    width: 500
                    height: ~
                    crop: false
                    occurrence: 'Front-end: Advertising in cart (above the cart preview)'
                -   name: productListMiddle
                    width: 1390
                    height: ~
                    crop: false
                    occurrence: 'Front-end: Advertising in middle category (above the product list)'
                -   name: productListMiddleRetina
                    width: 2780
                    height: ~
                    crop: false
                    occurrence: 'Front-end: Advertising in middle category (above the product list) on Retina displays'
        -   name: mobile
            sizes:
                -   name: header
                    width: 425
                    height: ~
                    crop: false
                    occurrence: 'Front-end: Advertising under heading'
                -   name: footer
                    width: 425
                    height: ~
                    crop: false
                    occurrence: 'Front-end: Advertising above footer'
                -   name: productList
                    width: 425
                    height: ~
                    crop: false
                    occurrence: 'Front-end: Advertising in category (above the category name)'
                -   name: cartPreview
                    width: 425
                    height: ~
                    crop: false
                    occurrence: 'Front-end: Advertising in cart (above the cart preview)'
                -   name: productListMiddle
                    width: 328
                    height: ~
                    crop: false
                    occurrence: 'Front-end: Advertising in middle category (above the product list)'
                -   name: productListMiddleRetina
                    width: 656
                    height: ~
                    crop: false
                    occurrence: 'Front-end: Advertising in middle category (above the product list) - retina display'

-   name: brand
    class: Shopsys\FrameworkBundle\Model\Product\Brand\Brand
    sizes:
        -   name: ~
            width: 300
            height: 200
            crop: false
            occurrence: 'Front-end: Brand page'

-   name:  blogCategory
    class: App\Model\Blog\Category\BlogCategory
    sizes:
        -   name: ~
            width: 400
            height: 250
            crop: true
            occurrence: 'Front-end: Blog category detail'

-   name:  blogArticle
    class: App\Model\Blog\Article\BlogArticle
    sizes:
        -   name: ~
            width: 960
            height: ~
            crop: false
            occurrence: 'Front-end: Blog article detail'
            additionalSizes:
                - {width: 1920, height: ~, media: "only screen and (-webkit-min-device-pixel-ratio: 1.5)"}
        -   name: list
            width: 440
            height: 220
            crop: true
            occurrence: 'Front-end: Blog article list'
            additionalSizes:
                - {width: 269, height: 209, media: "(max-width: 768px)"}
                - {width: 880, height: 440, media: "only screen and (-webkit-min-device-pixel-ratio: 1.5)"}
        -   name: listGrid
            width: 450
            height: 220
            crop: true
            occurrence: 'Front-end: Blog article list'
            additionalSizes:
                - {width: 900, height: 440, media: "only screen and (-webkit-min-device-pixel-ratio: 1.5)"}
        -   name: searchThumbnail
            width: 116
            height: 78
            crop: true
            occurrence: 'Front-end: Blog article thumbnail'
        -   name: listBig
            width: 549
            height: 390
            crop: true
            occurrence: 'Front-end: Blog article list with big images'

-   name: notificationBar
    class: App\Model\NotificationBar\NotificationBar
    sizes:
        -   name: ~
            width: ~
            height: 42
            crop: false
            occurrence: 'Front-end: Notification bar'
            additionalSizes:
                - {width: ~, height: 84, media: "only screen and (-webkit-min-device-pixel-ratio: 1.5)"}

-   name: stockStore
    class: App\Model\Stock\Stock
    types:
        -   name: main
            sizes:
                -   name: ~
                    width: ~
                    height: 500
                    crop: false
                    occurrence: 'Front-end: stockStore main'
        -   name: gallery
            multiple: true
            sizes:
                -   name: ~
                    width: ~
                    height: 500
                    crop: false
                    occurrence: 'Front-end: stockStore gallery'
