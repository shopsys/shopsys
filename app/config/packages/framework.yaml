framework:
    annotations:
        cache: file
        file_cache_dir: '%kernel.cache_dir%/annotations'
    secret: "%secret%"
    router:
        strict_requirements: true
    form:
        legacy_error_messages: false
    csrf_protection: ~
    validation: { enable_annotations: true }
    trusted_hosts: ~
    session:
        handler_id: Symfony\Component\HttpFoundation\Session\Storage\Handler\RedisSessionHandler
        cookie_httponly: true
        # Disable the default PHP session garbage collection.
        # Session garbage collection is responsibility of hosting.
        gc_probability: 0
        cookie_lifetime: 31536000 # 365 days * 24 hours * 3600 seconds
    fragments: ~
    http_method_override: true
    profiler:
        enabled: false
        collect: false
    error_controller: 'App\Controller\Admin\ErrorController::showAction'
    assets:
        base_urls:
            # When you do not want to use CDN, it is used value '//' as workaround by https://github.com/symfony/symfony/issues/28391
            - '%env(CDN_DOMAIN)%'
