snc_redis:
    clients:
        bestselling_products:
            type: 'phpredis'
            alias: 'bestselling_products'
            dsn: 'redis://%redis_host%'
            options:
                prefix: '%env(REDIS_PREFIX)%%build-version%:cache:bestselling_products:'
        doctrine_query:
            type: 'phpredis'
            alias: 'doctrine_query'
            dsn: 'redis://%redis_host%'
            options:
                prefix: '%env(REDIS_PREFIX)%%build-version%:cache:doctrine:query:'
        main_friendly_url_slugs:
            type: 'phpredis'
            alias: 'main_friendly_url_slugs'
            dsn: 'redis://%redis_host%'
            options:
                prefix: '%env(REDIS_PREFIX)%%build-version%:cache:main_friendly_url_slugs:'
        global:
            type: 'phpredis'
            alias: 'global'
            dsn: 'redis://%redis_host%'
            options:
                prefix: '%env(REDIS_PREFIX)%'
        session:
            type: 'phpredis'
            alias: 'session'
            dsn: 'redis://%redis_host%'
        twig:
            type: 'phpredis'
            alias: 'twig'
            dsn: 'redis://%redis_host%'
            options:
                prefix: '%env(REDIS_PREFIX)%%build-version%:cache:twig:'
        image:
            type: 'phpredis'
            alias: 'image'
            dsn: 'redis://%redis_host%'
            options:
                prefix: '%env(REDIS_PREFIX)%%build-version%:cache:image:'
        product_filter:
            type: 'phpredis'
            alias: 'product_filter'
            dsn: 'redis://%redis_host%'
            options:
                prefix: '%env(REDIS_PREFIX)%%build-version%:cache:product_filter:'
        blog_article_export_queue:
            type: 'phpredis'
            alias: 'blog_article_export_queue'
            dsn: 'redis://%redis_host%'
            options:
                serialization: 'json'
                prefix: '%env(REDIS_PREFIX)%:queue:blog_article_export:'

    session:
        client: 'session'
        ttl: 604800
        prefix: '%env(REDIS_PREFIX)%session:'
