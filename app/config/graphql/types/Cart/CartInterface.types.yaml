CartInterface:
    type: interface
    config:
        fields:
            uuid:
                type: "Uuid"
            items:
                type: "[CartItem!]!"
            transport:
                type: "Transport"
            payment:
                type: "Payment"
            modifications:
                type: "CartModificationsResult!"
            totalPrice:
                type: "Price!"
            totalDiscountPrice:
                type: "Price!"
            remainingAmountWithVatForFreeTransport:
                type: "Money"
