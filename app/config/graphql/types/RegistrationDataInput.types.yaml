RegistrationDataInput:
    type: input-object
    inherits:
        - 'RegistrationDataInputDecorator'
        - 'NameInputObjectDecorator'
        - 'TelephoneInputObjectDecorator'
        - 'BillingAddressInputObjectDecorator'
    config:
        fields:
            password:
                type: "Password!"
                description: "Customer user password"
                validation:
                    -   NotBlank:
                            message: "Please enter new password"
                    -   Length:
                            min: 6
                            minMessage: "Password must be at least {{ limit }} characters long"
            companyCustomer:
                type: "Boolean!"
                description: "Determines whether the registered customer is a company or not."
            companyName:
                type: "String"
                description: "The customer’s company name (required when companyCustomer is true)"
                validation:
                    -   NotBlank:
                            message: "Vyplňte prosím název společnosti"
                            groups: "companyCustomer"
                    -   Length:
                            max: 30
                            maxMessage: "Company name cannot be longer than {{ limit }} characters"
                            groups: "companyCustomer"
            companyNumber:
                type: "String"
                description: "The customer’s company identification number (required when companyCustomer is true)"
                validation:
                    -   NotBlank:
                            message: "Vyplňte prosím IČ"
                            groups: "companyCustomer"
                    -   Length:
                            min: 8
                            max: 8
                            exactMessage: "Identification number has to be exactly {{ limit }} characters long"
                            groups: "companyCustomer"
                    -   Regex:
                            pattern: '/^[0-9]+$/' # see \App\Component\Validator\RegexValidationRule::COMPANY_NUMBER_REGEX
                            message: "Prosím, zadávejte pouze čísla"
                            groups: "companyCustomer"
            companyTaxNumber:
                type: "String"
                description: "The customer’s company tax number (required when companyCustomer is true)"
                validation:
                    -   Length:
                            max: 50
                            maxMessage: "Tax number cannot be longer than {{ limit }} characters"
                            groups: "companyCustomer"
                    -   Regex:
                            pattern: '/^[0-9A-Z]*([0-9]+[A-Z]+|[A-Z]+[0-9]+)[0-9A-Z]*$/' # see \App\Component\Validator\RegexValidationRule::COMPANY_TAX_NUMBER_REGEX
                            message: "Please check Tax number format"
                            groups: "companyCustomer"
            email:
                type: "String!"
                description: "The customer's email address"
                validation:
                    -   NotBlank:
                            message: "Please enter email"
                    -   Email:
                            message: "Please enter valid email"
                    -   Length:
                            max: 64
                            maxMessage: "Email cannot be longer than {{ limit }} characters"
                    -   Shopsys\FrameworkBundle\Form\Constraints\UniqueEmail:
                            message: "This email is already registered"

            newsletterSubscription:
                type: "Boolean!"
                description: "Whether customer user should receive newsletters or not"
            cartUuid:
                type: "Uuid"
                description: "Uuid of the cart that should be merged to the cart of the newly registered user"
                defaultValue: null
