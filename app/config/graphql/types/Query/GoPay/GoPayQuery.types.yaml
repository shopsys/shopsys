GoPayQuery:
    type: object
    config:
        fields:
            GoPaySwifts:
                type: "[GoPayBankSwift!]!"
                description: "List of available banks for GoPay bank transfer payment"
                resolve: "@=resolver('resolveGoPaySwifts', [args['currencyCode']])"
                args:
                    currencyCode:
                        type: "String!"
