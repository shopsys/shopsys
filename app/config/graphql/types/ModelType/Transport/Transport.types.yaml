Transport:
    type: object
    inherits:
        - 'TransportDecorator'
    config:
        fields:
            daysUntilDelivery:
                type: "Int!"
                description: "Number of days until goods are delivered"
            transportType:
                type: "TransportType!"
                description: "Type of transport"
            stores:
                type: "StoreConnection"
                description: "Stores available for personal pickup"
                resolve: "@=resolver('storesByTransport', [value, args])"
            price:
                type: "Price!"
                description: "Transport price"
                resolve: '@=service("App\\FrontendApi\\Resolver\\Price\\PriceResolver").resolveByTransport(value, args["cartUuid"])'
                args:
                    cartUuid:
                        type: "Uuid"
                        defaultValue: null
            images:
                type: "[Image!]!"
                description: "Transport images"
                resolve: '@=resolver("transportImageResolver", [value, args["type"], args["sizes"]])'
                args:
                    type:
                        type: "String"
                        defaultValue: null
                    sizes:
                        type: "[String!]"
                        defaultValue: null
