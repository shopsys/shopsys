Settings:
    type: object
    config:
        description: "Represents settings of the current domain"
        fields:
            pricing:
                type: "PricingSetting!"
                resolve: "@=resolver('pricingSettings')"
                description: "Settings related to pricing"
            seo:
                type: "SeoSetting!"
                resolve: "@=resolver('seoSettings')"
                description: "Settings related to SEO"
