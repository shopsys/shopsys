PromoCodeMutation:
    type: object
    config:
        fields:
            ApplyPromoCodeToCart:
                type: Cart!
                description: "Apply new promo code for the future checkout"
                args:
                    input:
                        type: ApplyPromoCodeToCartInput!
                        validation: cascade
                resolve: "@=mutation('applyPromoCodeToCart', [args, validator])"
            RemovePromoCodeFromCart:
                type: Cart!
                description: "Remove already used promo code from cart"
                args:
                    input:
                        type: RemovePromoCodeFromCartInput!
                        validation: cascade
                resolve: "@=mutation('removePromoCodeFromCart', [args, validator])"
