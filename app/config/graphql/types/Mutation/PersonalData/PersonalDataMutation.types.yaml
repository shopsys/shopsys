PersonalDataMutation:
    type: object
    config:
        fields:
            ChangePersonalData:
                type: 'CustomerUser!'
                description: "Changes customer user personal data"
                args:
                    input:
                        type: ChangePersonalDataInput!
                        validation: cascade
                resolve: "@=mutation('customer_user_change_personal_data', [args, validator])"
            RequestPersonalDataAccess:
                type: PersonalDataPage!
                description: "Request access to personal data"
                args:
                    input:
                        type: PersonalDataAccessRequestInput!
                        validation: cascade
                resolve: "@=mutation('requestPersonalDataAccess', [args, validator])"
