query ReadyCategorySeoMix($slug: String!, $sortingMode: ProductOrderingModeEnum, $filter: ProductFilter) {
    slug(slug: $slug) {
        ... on Category {
            slug
            originalCategorySlug
            products(orderingMode: $sortingMode, filter: $filter) {
                totalCount
                productFilterOptions {
                    parameters {
                        uuid
                        __typename
                        ...on ParameterCheckboxFilterOption {
                            values {
                                text
                                isSelected
                            }
                        }
                        ...on ParameterSliderFilterOption {
                            selectedValue
                        }
                    }
                    flags {
                        flag {
                            uuid
                        }
                        isSelected
                    }
                }
            }
        }
    }
}
