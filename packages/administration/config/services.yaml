services:
    _defaults:
        autoconfigure: true
        autowire: true
        public: false

    Shopsys\AdministrationBundle\:
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Controller/'
        resource: '../src/'

    Shopsys\AdministrationBundle\Command\:
        resource: '../src/Command/'
        tags: [ 'console.command' ]

    Shopsys\AdministrationBundle\Component\Crud\CrudControllerRegistry:
        arguments:
            $entityNameResolver: '@Shopsys\FrameworkBundle\Component\EntityExtension\EntityNameResolver'
            $crudControllers: '%shopsys.admin.crud_controllers%'
            $crudControllerExtensions: '%shopsys.admin.crud_controllers_extensions%'

    Shopsys\AdministrationBundle\Component\Menu\CrudMenuSubscriber:
        tags:
            - { name: kernel.event_subscriber }

    Shopsys\AdministrationBundle\Component\Router\CrudControllerRouteLoader:
        tags:
            - { name: routing.loader }

    Shopsys\AdministrationBundle\Component\Security\AccessControl\AccessControlDataProviderInterface:
        alias: Shopsys\AdministrationBundle\Component\Security\AccessControl\RouteAccessControlDataProvider

    Shopsys\AdministrationBundle\Component\Security\AccessControl\RouteAccessControlDataProvider:
        arguments:
            $cache: '@cache.app'
            $environment: '%kernel.environment%'
            $adminUrl: '%admin_url%'

    Shopsys\AdministrationBundle\Component\Security\AccessControl\RouteAccessControlSubscriber:
        tags:
            - { name: kernel.event_subscriber }

    Shopsys\AdministrationBundle\Component\Translation\CrudEntityNameExtractor:
        tags:
            - { name: jms_translation.file_visitor }

    Shopsys\AdministrationBundle\Controller\:
        resource: '../src/Controller/'
        tags: [ 'controller.service_arguments' ]

    Shopsys\AdministrationBundle\Twig\Runtime\DomainIconRuntime:
        arguments:
            - '%kernel.project_dir%'
        tags: ['twig.runtime']

    Shopsys\FrameworkBundle\Component\Security\AccessControl\RouteAccessCheckerInterface:
        alias: Shopsys\AdministrationBundle\Component\Security\AccessControl\RouteAccessChecker
