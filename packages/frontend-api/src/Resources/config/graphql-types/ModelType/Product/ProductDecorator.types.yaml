ProductDecorator:
    type: interface
    decorator: true
    config:
        description: "Represents a product"
        fields:
            uuid:
                type: "Uuid!"
                description: "UUID"
            name:
                type: "String"
                description: "Localized product name (domain dependent)"
            namePrefix:
                type: "String"
                description: "Name prefix"
            nameSuffix:
                type: "String"
                description: "Name suffix"
            fullName:
                type: "String!"
                description: "The full name of the product, which consists of a prefix, name, and a suffix"
            shortDescription:
                type: "String"
                description: "Localized product short description (domain dependent)"
            usps:
                type: "[String!]!"
                description: "List of product's unique selling propositions"
            link:
                type: "String!"
                description: "Product link"
            unit:
                type: "Unit!"
            availability:
                type: "Availability"
            stockQuantity:
                type: "Int"
                description: "Count of quantity on stock"
            isAllowedNegativeStock:
                type: "Boolean!"
                description: "Whether the product allows purchasing more items than are currently in stock"
            categories:
                type: "[Category!]!"
                description: "List of categories"
            flags:
                type: "[Flag!]!"
                description: "List of flags"
            price:
                type: "ProductPrice!"
                description: "Product price"
                resolve: '@=query("priceByProductQuery", value)'
            giftPrice:
                type: "ProductPrice!"
                description: "Gift price for the product when is as gift"
                resolve: '@=query("giftPriceByProductQuery", value)'
            images:
                type: "[Image]!"
                description: "Product images"
                resolve: '@=query("imagesByProductPromiseQuery", value, args["type"])'
                args:
                    type:
                        type: "String"
                        defaultValue: null
            brand:
                type: "Brand"
                description: "Brand of product"
            isSellingDenied:
                type: "Boolean!"
            isCurrentlyOutOfStock:
                type: "Boolean!"
                description: "Whether the product is currently out of stock (but may be back in stock later), but selling is not permanently denied"
            orderingPriority:
                type: "Int!"
            description:
                type: "String"
            accessories:
                type: "[Product]"
            relatedProducts:
                type: "[Product!]!"
                description: "List of related products"
            parameters:
                type: "[Parameter]!"
            seoH1:
                type: "String"
                description: "Seo first level heading of product"
            seoTitle:
                type: "String"
                description: "Seo title of product"
            seoMetaDescription:
                type: "String"
                description: "Seo meta description of product"
            hreflangLinks:
                type: "[HreflangLink!]!"
                description: "Alternate links for hreflang meta tags"
            files:
                type: "[File!]!"
                resolve: '@=query("filesByProductPromiseQuery", value)'
            isVisible:
                type: "Boolean!"
            isInquiryType:
                type: "Boolean!"
            productType:
                type: "ProductTypeEnum!"
            availableStoresCount:
                type: "Int"
                description: "Number of the stores where the product is available (null for main variants)"
            storeAvailabilities:
                type: "[StoreAvailability!]!"
                description: "List of availabilities in individual stores (empty for main variants)"
            productVideos:
                type: "[VideoToken!]!"
            vatPercent:
                type: "String!"
            gifts:
                type: "[Product!]!"
                description: "List of gift products"
                resolve: '@=query("giftsByProductPromiseQuery", value)'
            promotionBuyQuantity:
                type: "Int"
                description: "Quantity required to qualify for the buy X + Y free promotion (null when not set)"
            promotionFreeQuantity:
                type: "Int"
                description: "Quantity given for free in the buy X + Y free promotion (null when not set)"
