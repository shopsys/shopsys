BrandDecorator:
    type: object
    decorator: true
    config:
        interfaces:
            - 'Hreflang'
            - 'Breadcrumb'
            - 'Slug'
            - 'ProductListable'
            - 'Seo'
        description: "Represents a brand"
        fields:
            uuid:
                type: "Uuid!"
                description: "UUID"
            name:
                type: "String!"
                description: "Brand name"
            description:
                type: "String"
                description: "Brand description"
            link:
                type: "String!"
                description: "Brand main URL"
            seo:
                type: "SeoAttributes!"
                description: "SEO attributes of the brand page"
            images:
                type: "[Image!]!"
                description: "Brand images"
                resolve: '@=query("imagesByEntityPromiseQuery", value, args["type"])'
                args:
                    type:
                        type: "String"
                        defaultValue: null
            products:
                type: "ProductConnection!"
                description: "Paginated and ordered products of brand"
                argsBuilder:
                    builder: "ProductPaginatorArgumentsBuilder"
                    config:
                        orderingModeType: 'ProductOrderingModeEnum'
                resolve: '@=query("productsByBrandQuery", args, value)'
            hreflangLinks:
                type: "[HreflangLink!]!"
                description: "Alternate links for hreflang meta tags"
            breadcrumb:
                type: "[Link!]!"
                description: "Hierarchy of the current element in relation to the structure"
                resolve: '@=query("breadcrumbQuery", value.getId(), "front_brand_detail")'
            slug:
                type: "String!"
                description: "Brand URL slug"
