ParameterValueFilterOptionDecorator:
    type: input-object
    decorator: true
    config:
        description: "Parameter value filter option"
        fields:
            uuid:
                type: "Uuid!"
                description: "UUID"
            text:
                type: "String!"
                description: "Parameter value"
            count:
                type: "Int!"
                description: "Count of products that will be filtered if this filter option is applied."
            isSelected:
                type: "Boolean!"
                description: "Indicator whether the option is already selected (used for \"ready category seo mixes\")"
