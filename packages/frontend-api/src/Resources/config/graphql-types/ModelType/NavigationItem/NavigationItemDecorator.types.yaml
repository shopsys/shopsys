NavigationItemDecorator:
    type: object
    decorator: true
    config:
        description: "Represents a navigation structure item"
        fields:
            name:
                type: "String!"
                description: "Navigation item name"
            type:
                type: "String!"
                description: "Navigation item type"
            link:
                type: "String"
                description: "Target URL for link navigation items"
            categoriesByColumns:
                type: "[NavigationItemCategoriesByColumns!]!"
                description: "Categories separated into columns"
