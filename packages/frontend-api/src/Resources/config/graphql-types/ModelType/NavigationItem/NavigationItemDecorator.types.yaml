NavigationItemDecorator:
    type: object
    decorator: true
    config:
        description: "Represents a navigation structure item"
        fields:
            name:
                type: "String!"
                description: "Navigation item name"
            link:
                type: "String!"
                description: "Target URL"
            routeName:
                type: "FriendlyUrlRouteEnum"
                description: "Friendly route name if exists, NULL for unknown (e.g., external) links"
            categoriesByColumns:
                type: "[NavigationItemCategoriesByColumns!]!"
                description: "Categories separated into columns"
