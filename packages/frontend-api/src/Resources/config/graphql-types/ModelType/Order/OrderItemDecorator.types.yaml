OrderItemDecorator:
    type: object
    decorator: true
    config:
        description: "Represent one item in the order"
        fields:
            name:
                type: "String!"
                description: "Name of the order item"
            unitPrice:
                type: "Price!"
                description: "Order item price per unit"
            totalPrice:
                type: "Price!"
                description: "Total price for the quantity of order item"
            vatRate:
                type: "String!"
                description: "Applied VAT rate percentage applied to the order item"
            quantity:
                type: "Int!"
                description: "Quantity of order items in the order"
            unit:
                type: "String"
                description: "Unit of measurement used for the order item"
            type:
                type: "OrderItemTypeEnum!"
                description: "Type of the order item"
            deliveryDaysExtension:
                type: "Int"
                description: "By how many working days the additional service extends the estimated delivery time of the order"
            product:
                type: "Product"
                description: "Product of the order item"
            mainImage:
                type: "Image"
                description: "Main image of the product, additional service, transport or payment the order item represents"
                resolve: '@=query("mainImageByOrderItemPromiseQuery", value, args["type"])'
                args:
                    type:
                        type: "String"
                        defaultValue: null
            uuid:
                type: "Uuid!"
                description: "UUID of the order item"
            catnum:
                type: "String"
                description: "Catalog number of the order item product"
            order:
                type: "Order!"
                description: "Order to which the order item belongs"
            transport:
                type: "Transport"
                description: "Transport method applied to the order"
            payment:
                type: "Payment"
                description: "Payment method applied to the order"
            relatedItems:
                type: "[OrderItem!]!"
                description: "Order items related to this order item (e.g. additional services of a product item)"
