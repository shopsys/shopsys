OrderDecorator:
    type: object
    decorator: true
    config:
        fields:
            uuid:
                type: "Uuid!"
                description: "UUID"
            number:
                type: "String!"
                description: "Unique order number"
            creationDate:
                type: "DateTime!"
                description: "Date and time when the order was created"
            expectedDeliveryDate:
                type: "DateTime"
                description: "Expected delivery date captured when the order was created; null when no delivery date could be promised"

            items:
                type: "[OrderItem!]!"
                description: "All items in the order including payment and transport"

            status:
                type: "String!"
                description: "Current status of the order"
            statusType:
                type: "OrderStatusEnum!"
                description: "Type of the order status"
            productReviewsAllowed:
                type: "Boolean!"
                description: "Products of the order can be reviewed in its current status"
            reviewedProductUuids:
                type: "[Uuid!]!"
                description: "Uuids of the order's products that already have a review linked to this order"

            totalPrice:
                type: "Price!"
                description: "Total price of the order including transport and payment prices"

            firstName:
                type: "String"
                description: "The customer's first name"
            lastName:
                type: "String"
                description: "The customer's last name"
            email:
                type: "String!"
                description: "The customer's email address"
            telephone:
                type: "String!"
                description: "The customer's formatted telephone number"
            telephoneData:
                type: "PhoneData!"
                description: "The customer's telephone number split into country code, prefix, and number"
            companyName:
                type: "String"
                description: "The customer’s company name (only when ordered on the company behalf)"
            companyNumber:
                type: "String"
                description: "The customer’s company identification number (only when ordered on the company behalf)"
            companyTaxNumber:
                type: "String"
                description: "The customer’s company tax number (only when ordered on the company behalf)"

            street:
                type: "String!"
                description: "Billing address street name "
            city:
                type: "String!"
                description: "Billing address city name"
            postcode:
                type: "String!"
                description: "Billing address zip code"
            country:
                type: "Country!"
                description: "Billing address country"

            isDeliveryAddressDifferentFromBilling:
                type: "Boolean!"
                description: "Indicates whether the billing address is other than a delivery address"

            deliveryFirstName:
                type: "String"
                description: "First name of the contact person for delivery"
            deliveryLastName:
                type: "String"
                description: "Last name of the contact person for delivery"
            deliveryCompanyName:
                type: "String"
                description: "Company name for delivery"
            deliveryTelephone:
                type: "String"
                description: "Contact telephone number for delivery"
            deliveryTelephoneData:
                type: "PhoneData"
                description: "Contact phone number data for delivery"
            deliveryStreet:
                type: "String"
                description: "Street name for delivery"
            deliveryCity:
                type: "String"
                description: "City name for delivery"
            deliveryPostcode:
                type: "String"
                description: "Zip code for delivery"
            deliveryCountry:
                type: "Country"
                description: "Country for delivery"
            note:
                type: "String"
                description: "Other information related to the order"
            urlHash:
                type: "String!"
                description: "Unique url hash that can be used to "
            lastExternalPaymentUrl:
                type: "String"
                description: "URL for accessing the last payment transaction on a gateway without invoking the new payment transaction. Depending on the payment status, user might see the payment details or even retry the transaction if possible."
            paymentStatus:
                type: "String"
                description: "Current status of the last external payment transaction"
                resolve: '@=value.getLastExternalPaymentStatus()'
            isPaid:
                type: "Boolean!"
                description: "Indicates whether the order is paid successfully with GoPay payment type"
            hasPaymentInProcess:
                type: "Boolean!"
                description: "Indicates whether order payment is still being processed with GoPay payment type"
            paymentTransactionsCount:
                type: "Int!"
                description: "Number of payment transactions created for the order"
            heurekaAgreement:
                type: "Boolean!"
                description: "Determines whether the customer agrees with sending satisfaction questionnaires within the Verified by Customers Heureka program"
            pickupPlaceIdentifier:
                type: "String"
                description: "Selected pickup place identifier"
            trackingNumber:
                type: "String"
                description: "The order tracking number"
            trackingUrl:
                type: "String"
                description: "The order tracking link"
            promoCode:
                type: "String"
                description: "Promo code (coupon) used in the order"
            productItems:
                type: "[OrderItem!]!"
                description: "All product items in the order"
            customerUser:
                type: "BaseCustomerUser"
                description: "The registered customer user who made the order (or null if the order was made by an unregistered user)"
            hasExternalPayment:
                type: "Boolean!"
                description: "Indicates whether the order has an external payment"
            deliveredAt:
                type: "DateTime"
                description: "Date and time when the order was delivered to the customer"
            withdrawalRequest:
                type: "OrderWithdrawalRequest"
                description: "Returns withdrawal request information for the order, null if no withdrawal was requested"
            withdrawalInstructions:
                type: "String!"
                description: "Returns withdrawal instructions for the order"
            canRequestWithdrawal:
                type: "Boolean!"
                description: "Returns whether withdrawal can be requested for the order"
            withdrawalDeadline:
                type: "DateTime"
                description: "Returns withdrawal deadline for the order, null if not specified (when order has not been delivered yet)"
            confirmationPageContent:
                type: "OrderConfirmationPageContent!"
                description: "Returns content to be displayed on the order confirmation page after placing the order"
                resolve: '@=query("orderConfirmationPageContentQuery", value)'
