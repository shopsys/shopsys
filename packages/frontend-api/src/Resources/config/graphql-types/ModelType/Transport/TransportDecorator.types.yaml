TransportDecorator:
    type: interface
    decorator: true
    config:
        description: "Represents a transport"
        fields:
            uuid:
                type: "Uuid!"
                description: "UUID"
            name:
                type: "String!"
                description: "Transport name"
            description:
                type: "String"
                description: "Localized transport description (domain dependent)"
            instructions:
                type: "String"
                description: "Localized transport instruction (domain dependent)"
            position:
                type: "Int!"
                description: "Transport position"
            price:
                type: "Price!"
                description: "Transport price"
                resolve: '@=query("priceByTransportQuery", value, args["cartUuid"], context)'
                args:
                    cartUuid:
                        type: "Uuid"
                        defaultValue: null
            images:
                type: "[Image!]!"
                description: "Transport images"
                resolve: '@=query("imagesByEntityPromiseQuery", value, args["type"])'
                args:
                    type:
                        type: "String"
                        defaultValue: null
            payments:
                type: "[Payment!]!"
                description: "List of assigned payments"
            transportTypeCode:
                type: "TransportTypeEnum!"
                description: "Code of transport type"
            productsBlockingSelectionInCart:
                type: "[ProductsByTransportUnavailabilityReason!]!"
                description: "Cart products that cannot be delivered using this transport, grouped by the reason (empty when the transport can be selected)"
                resolve: '@=query("transportProductsBlockingSelectionInCartQuery", value, args["cartUuid"], context)'
                args:
                    cartUuid:
                        type: "Uuid"
                        defaultValue: null
            vatPercent:
                type: "String!"
            group:
                type: "TransportGroup"
                description: "Transport group"
            expectedDeliveryDate:
                type: "DateTime"
                description: "Expected delivery date of an order placed today. When a cart is provided, the expected restocking dates of its items are taken into account. For a personal pickup transport the date of the store selected in the cart is used, otherwise the best possible date across all stores. Null when no delivery date can be promised."
                resolve: '@=query("transportExpectedDeliveryDateQuery", value, args["cartUuid"], context)'
                args:
                    cartUuid:
                        type: "Uuid"
                        defaultValue: null
