StoreDecorator:
    type: object
    decorator: true
    config:
        interfaces:
            - 'Breadcrumb'
            - 'Slug'
        fields:
            slug:
                type: "String!"
                description: "Store URL slug"
            uuid:
                type: "Uuid!"
                description: "UUID"
            isDefault:
                type: "Boolean!"
                description: "Is set as default store"
            name:
                type: "String!"
                description: "Store name"
            description:
                type: "String"
                description: "Store description"
            street:
                type: "String!"
                description: "Store address street"
            city:
                type: "String!"
                description: "Store address city"
            postcode:
                type: "String!"
                description: "Store address postcode"
            country:
                type: "Country!"
                description: "Store address country"
            openingHours:
                type: "OpeningHours!"
                description: "Store opening hours"
            email:
                type: "String"
                description: "Store email"
            phone:
                type: "String"
                description: "Store phone"
            directions:
                type: "String"
                description: "Description of how to get to the store"
            specialMessage:
                type: "String"
                description: ""
            latitude:
                type: "String"
                description: "Store location latitude"
            longitude:
                type: "String"
                description: "Store location longitude"
            breadcrumb:
                type: "[Link!]!"
                description: "Hierarchy of the current element in relation to the structure"
                resolve: '@=query("breadcrumbQuery", value.getId(), "front_stores_detail")'
            distance:
                type: "Int"
                description: "Distance from the user in meters"
            images:
                type: "[Image!]!"
                description: "Store images"
                resolve: '@=query("imagesByStorePromiseQuery", value, args["type"])'
                args:
                    type:
                        type: "String"
                        defaultValue: null
            mainImage:
                type: "Image"
                description: "Transport image by params"
                resolve: '@=query("mainImageByEntityPromiseQuery", value, args["type"])'
                args:
                    type:
                        type: "String"
                        defaultValue: null
            expectedDeliveryDate:
                type: "DateTime"
                description: "Expected delivery date of an order picked up at this store when the given transport is used. When a cart is provided, the expected restocking dates of its items are taken into account. Null when no delivery date can be promised."
                resolve: '@=query("storeExpectedDeliveryDateQuery", value, args["transportUuid"], args["cartUuid"], context)'
                args:
                    transportUuid:
                        type: "Uuid!"
                    cartUuid:
                        type: "Uuid"
                        defaultValue: null
