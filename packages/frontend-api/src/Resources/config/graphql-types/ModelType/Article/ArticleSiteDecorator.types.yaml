ArticleSiteDecorator:
    type: object
    decorator: true
    inherits:
        - 'Article'
    config:
        interfaces:
            - 'Breadcrumb'
            - 'Slug'
            - 'NotBlogArticleInterface'
            - 'ArticleInterface'
        fields:
            mainImage:
                type: "Image"
                description: "The article image"
                resolve: '@=query("mainImageByArticlePromiseQuery", value, args["type"])'
                args:
                    type:
                        type: "String"
                        defaultValue: null
            modifiedAt:
                type: "DateTime"
                description: "Date and time of the last article modification"
            publishDate:
                type: "DateTime"
                description: "Actual publication date of the article"
            createdAt:
                type: "DateTime!"
                description: "Date and time of the article creation"
            external:
                type: "Boolean!"
                description: "If the the article should be open in a new tab"
            slug:
                type: "String!"
                description: "Article URL slug"
            breadcrumb:
                type: "[Link!]!"
                description: "Hierarchy of the current element in relation to the structure"
