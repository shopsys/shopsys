ArticleDecorator:
    type: object
    decorator: true
    config:
        fields:
            uuid:
                type: "Uuid!"
                description: "UUID"
            placement:
                type: "String!"
                description: "Placement of article"
            name:
                type: "String!"
                description: "Name of article"
            content:
                type: "JSON"
                description: "Structured content of the article (content editor document)"
            seo:
                type: "SeoAttributes!"
                description: "SEO attributes of the article page"
