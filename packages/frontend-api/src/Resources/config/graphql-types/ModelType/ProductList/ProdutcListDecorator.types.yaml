ProductListDecorator:
    type: object
    decorator: true
    config:
        fields:
            uuid:
                type: "Uuid!"
                description: "Product list identifier"
            type:
                type: "ProductListTypeEnum!"
                description: "Product list type"
            productUuids:
                type: "[Uuid!]!"
                description: "All UUIDs of products in the list, in the order of the list, including products that are not visible on the current domain"
                resolve: '@=query("productUuidsByProductListQuery", value)'
            products:
                type: "ProductConnection!"
                description: "Paginated products of the list that are visible on the current domain, in the order of the list"
                argsBuilder: "Relay::Connection"
                resolve: '@=query("productsByProductListQuery", value, args)'
