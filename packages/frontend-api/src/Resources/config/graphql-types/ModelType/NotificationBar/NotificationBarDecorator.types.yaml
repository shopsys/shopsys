NotificationBarDecorator:
    type: object
    decorator: true
    config:
        description: "Represents a notification supposed to be displayed on all pages"
        fields:
            uuid:
                type: "Uuid!"
                description: "UUID of the notification bar"
            text:
                type: "String!"
                description: "Message of the notification"
            rgbColor:
                type: "String!"
                description: "Color of the notification"
            images:
                type: "[Image!]!"
                description: "Notification bar images"
                resolve: '@=query("imagesByEntityPromiseQuery", value, args["type"])'
                args:
                    type:
                        type: "String"
                        defaultValue: null
            mainImage:
                type: "Image"
                description: "Notification bar image by params"
                resolve: '@=query("mainImageByEntityPromiseQuery", value, args["type"])'
                args:
                    type:
                        type: "String"
                        defaultValue: null
            validityFrom:
                type: "DateTime"
                description: "Notification bar validity from"
            validityTo:
                type: "DateTime"
                description: "Notification bar validity to"
