CurrentCustomerUserDecorator:
    type: interface
    decorator: true
    inherits:
        - 'BaseCustomerUser'
    config:
        description: "Represents a common interface for a currently logged customer user (both company and regular)"
        fields:
            loginInfo:
                type: "LoginInfo!"
                description: "Current login information"
            isAdministratorLoggedAsCustomer:
                type: "Boolean!"
                description: "Whether the current session was opened by an administrator via login as customer"
