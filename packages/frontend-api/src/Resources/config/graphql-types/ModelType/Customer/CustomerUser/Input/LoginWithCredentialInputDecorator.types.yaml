LoginWithCredentialInputDecorator:
    type: input-object
    decorator: true
    config:
        fields:
            type:
                type: "LoginTypeEnum!"
                description: "The social network the credential was issued by (e.g. google, seznam)"
            credential:
                type: "String!"
                description: "The credential returned by the browser's FedCM flow (JWT id_token for Google, OAuth authorization code for Seznam)"
            nonce:
                type: "String"
                description: "Random nonce passed to navigator.credentials.get(); the backend verifies it against the id_token nonce claim for providers whose credential format carries one (e.g. Google). Ignored for providers without a nonce claim (e.g. Seznam)"
                defaultValue: null
            productListsUuids:
                type: "[Uuid!]!"
                description: "Uuids of product lists that should be merged to the product lists of the user"
                defaultValue: []
            shouldOverwriteCustomerUserCart:
                type: "Boolean!"
                description: "A boolean pointer to indicate if the current customer user cart should be overwritten by the cart with cartUuid"
                defaultValue: false
            cartUuid:
                type: "Uuid"
                description: "Uuid of the cart that should be merged to the cart of the user"
                defaultValue: null
