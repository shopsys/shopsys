BaseCustomerUserDecorator:
    type: interface
    decorator: true
    config:
        description: "Represents a basic interface for a customer user"
        fields:
            uuid:
                type: "Uuid!"
                description: "UUID"
            firstName:
                type: "String"
                description: "First name"
            lastName:
                type: "String"
                description: "Last name"
            email:
                type: "String!"
                description: "Email address"
            telephone:
                type: "String"
                description: "Phone number"
            telephoneData:
                type: "PhoneData"
                description: "Phone number data"
            newsletterSubscription:
                type: "Boolean!"
                description: "Whether customer user receives newsletters or not"
            defaultDeliveryAddress:
                type: "DeliveryAddress"
                description: "Default customer delivery addresses"
            deliveryAddresses:
                type: "[DeliveryAddress!]!"
                description: "List of delivery addresses"
            pricingGroup:
                type: "String!"
                description: "The name of the customer pricing group"
            hasPasswordSet:
                type: "Boolean!"
                description: "Whether the customer user has password set or not"
            roles:
                type: "[CustomerUserRoleEnum!]!"
            roleGroup:
                type: "CustomerUserRoleGroup!"
                description: "The customer user role group"
            salesRepresentative:
                type: "SalesRepresentative"
                description: "Sales representative assigned to customer"
            billingAddressUuid:
                type: "Uuid!"
                description: "UUID"
            street:
                type: "String"
                description: "street name"
            city:
                type: "String"
                description: "city name"
            postcode:
                type: "String"
                description: "zip code"
            country:
                type: "Country"
                description: "Billing address country"
