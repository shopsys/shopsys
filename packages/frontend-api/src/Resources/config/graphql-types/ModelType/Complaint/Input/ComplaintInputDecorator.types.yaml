ComplaintInputDecorator:
    type: input-object
    decorator: true
    config:
        fields:
            orderUuid:
                type: "Uuid"
                description: "UUID of the order"
                defaultValue: null
                validation:
                    -   NotBlank:
                            message: "Order is required"
                            groups: "withOrder"
            manualDocumentNumber:
                type: "String"
                defaultValue: null
                description: "Order or document number (doesn't have to be from any existing order)"
                validation:
                    -   NotBlank:
                            message: "Order or document number is required"
                            groups: "withoutOrder"
                    -   Length:
                            max: 255
                            maxMessage: "Order or document number cannot be longer than {{ limit }} characters"
            deliveryAddress:
                type: "DeliveryAddressInput!"
                description: "Delivery address"
                validation: cascade
            items:
                type: "[ComplaintItemInput!]!"
                description: "All items in the complaint"
                validation: cascade
            email:
                type: "String!"
                description: "The customer's email address"
                validation:
                    -   NotBlank:
                            message: "Please enter email"
                    -   Email:
                            message: "Please enter valid email"
                    -   Length:
                            max: 255
                            maxMessage: "Email cannot be longer than {{ limit }} characters"
