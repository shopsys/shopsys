RestoreCartGiftInputDecorator:
    type: input-object
    decorator: true
    inherits:
        - 'CartInput'
    config:
        fields:
            giftProductUuid:
                type: "Uuid!"
                description: "UUID of the removed gift product to restore"
            mainProductUuid:
                type: "Uuid!"
                description: "UUID of the product in the cart the removed gift belongs to"
