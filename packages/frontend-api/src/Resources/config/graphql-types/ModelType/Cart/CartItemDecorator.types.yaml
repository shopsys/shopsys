CartItemDecorator:
    type: object
    decorator: true
    config:
        description: "Represent one item in the cart"
        fields:
            product:
                type: "Product!"
                description: "Product in the cart"
            uuid:
                type: "Uuid!"
                description: "Cart item UUID"
            quantity:
                type: "Int!"
                description: "Quantity of items in the cart"
            paidQuantity:
                type: "Int!"
                description: "Quantity to be paid after applying X+Y promotion"
            freeQuantity:
                type: "Int!"
                description: "Quantity of free items from X+Y promotion"
            totalPriceBeforePromotion:
                type: "Price!"
                description: "Total line price without X+Y promotion (unit price × quantity)"
