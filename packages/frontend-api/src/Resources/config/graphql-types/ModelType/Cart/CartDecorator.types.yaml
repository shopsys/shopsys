CartDecorator:
    type: object
    decorator: true
    config:
        fields:
            uuid:
                type: "Uuid"
                description: "UUID of the cart, null for authenticated user"
            items:
                type: "[CartItem!]!"
                description: "All items in the cart"
            transport:
                type: "Transport"
                description: "Selected transport if transport provided"
            payment:
                type: "Payment"
                description: "Selected payment if payment provided"
            selectedPickupPlaceIdentifier:
                type: "String"
                description: "Selected pickup place identifier if provided"
            promoCodes:
                type: "[PromoCode!]!"
                description: "Applied promo codes if provided"
            giftVouchers:
                type: "[AppliedGiftVoucher!]!"
                description: "Applied gift vouchers if provided"
            remainingAmountToPay:
                type: "Money!"
                description: "Total price with VAT reduced by applied gift vouchers, never below zero"
            remainingItemsAmountToPay:
                type: "Money!"
                description: "Total items price with VAT reduced by applied gift vouchers, never below zero, excluding the transport and payment selected in a later order step"
            isNothingLeftToPay:
                type: "Boolean!"
                description: "Whether the applied gift vouchers cover the whole amount to pay"
            giftVouchersExceedPayableAmount:
                type: "Boolean!"
                description: "Applied gift vouchers exceed the amount payable by them (total price without gift voucher products), so the order cannot be completed"
            modifications:
                type: "CartModificationsResult!"
            totalPrice:
                type: "Price!"
                description: "Total price including transport and payment"
            totalItemsPrice:
                type: "Price!"
                description: "Total items price (excluding transport and payment)"
            totalItemsPriceBeforeDiscount:
                type: "Price!"
                description: "Total items price (excluding transport and payment) before any discounts are applied"
            totalProductPriceAdjustmentsDiscount:
                type: "Price!"
                description: "Total discount from product special prices (price list prices, or X+Y promotion). Difference between basic and selling prices"
            totalDiscountPrice:
                type: "Price!"
                description: "Total of all discounts (product price adjustments discounts + promo code discounts)"
            remainingAmountForFreeTransport:
                type: "Money"
                description: "Remaining amount for free transport and payment; null = transport cannot be free. Amount is with VAT if input price type is set to price with vat and vice versa."
            paymentGoPayBankSwift:
                type: "String"
                description: "Selected bank swift code of goPay payment bank transfer"
            roundingPrice:
                type: "Price"
                description: "Rounding amount if payment has rounding allowed"
