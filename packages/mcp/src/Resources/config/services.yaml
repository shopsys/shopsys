parameters:
    shopsys_mcp.schema.file_path: '%kernel.project_dir%/mcp-schema.json'

services:
    _defaults:
        autoconfigure: true
        autowire: true
        public: false

    Shopsys\McpBundle\:
        resource: '../../**/*{Authenticator,DataFactory,Executor,Facade,Factory,Generator,Hasher,Loader,Lookup,Normalizer,Parser,Provider,Repository,Resolver,Subscriber,Tool,Validator}.php'

    Shopsys\McpBundle\Command\:
        resource: '../../Command/'

    Shopsys\McpBundle\Component\Database\Middleware\McpSessionSettingsMiddleware:
        arguments:
            $statementTimeoutMilliseconds: '%shopsys_mcp.query.statement_timeout_ms%'
            $lockTimeoutMilliseconds: '%shopsys_mcp.query.lock_timeout_ms%'
        tags:
            - { name: doctrine.middleware, connection: mcp }

    Shopsys\McpBundle\Component\Database\Query\SqlExecutor:
        arguments:
            $mcpConnection: '@doctrine.dbal.mcp_connection'
            $maxReturnedRows: '%shopsys_mcp.query.max_returned_rows%'

    Shopsys\McpBundle\Component\Database\Query\SqlQueryValidator:
        arguments:
            $maxReturnedRows: '%shopsys_mcp.query.max_returned_rows%'

    Shopsys\McpBundle\Component\Database\Schema\ExposedSchemaProvider:
        arguments:
            $mcpConnection: '@doctrine.dbal.mcp_connection'
            $schemaFilePath: '%shopsys_mcp.schema.file_path%'

    Shopsys\McpBundle\Component\Database\Schema\McpSchemaFileGenerator:
        arguments:
            $schemaFilePath: '%shopsys_mcp.schema.file_path%'

    Shopsys\McpBundle\Component\Database\Schema\SchemaNameNormalizer:
        arguments:
            $mcpConnection: '@doctrine.dbal.mcp_connection'

    Shopsys\McpBundle\Component\Logger\McpRequestLogProcessor:
        tags:
            - { name: monolog.processor, channel: mcp }

    Shopsys\McpBundle\Component\Logger\McpToolCallLogger:
        arguments:
            $logger: '@monolog.logger.mcp'

    Shopsys\McpBundle\Controller\:
        resource: '../../Controller/'
        tags: ['controller.service_arguments']

    Shopsys\McpBundle\Form\:
        resource: '../../Form/'

    Shopsys\McpBundle\Model\Administrator\McpToken\AdministratorMcpTokenFacade:
        arguments:
            $accessTokenTtlSeconds: '%shopsys_mcp.authorization.access_token_ttl_seconds%'

    Shopsys\McpBundle\Model\OAuth\McpOAuthAuthorizationCodeFacade:
        arguments:
            $cacheItemPool: '@mcp_oauth_cache'

    Shopsys\McpBundle\Model\OAuth\McpOAuthClientRegistrationStorage:
        arguments:
            $cacheItemPool: '@mcp_oauth_cache'
