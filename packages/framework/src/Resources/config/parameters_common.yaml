parameters:
    # Default Redis keys prefix
    build-version: '0000000000000000'
    env(ELASTIC_SEARCH_INDEX_PREFIX): ''

    env(IGNORE_DEFAULT_ADMIN_PASSWORD_CHECK): '0'
    env(MAILER_FORCE_WHITELIST): 0
    env(REDIS_PREFIX): ''
    # Set to 0 to stop sending Sentry cron check-ins (e.g. in review environments where many instances share one Sentry environment)
    env(SENTRY_CRON_MONITORING_ENABLED): '1'

    # Seed for demo data generation
    faker.seed: 1234

    # Time zone that the admin use for entering and viewing dates and times in the datetime pickers
    shopsys.admin_display_timezone: ~

    # Locales to select from in the administration. The first locale is the default one.
    shopsys.allowed_admin_locales: ['en', 'cs', 'sk']

    # Hours defined in cron.yaml correspond to this timezone (default is PHP timezone)
    shopsys.cron_timezone: ~

    shopsys.display_cron_overview_for_superadmin_only: false

    # Default extended classes mapping
    shopsys.entity_extension.map: {}

    shopsys.mail_template.display_price: 'selling_price'
