fragment SimpleProductFragment on Product {
    __typename
    id
    uuid
    catalogNumber
    fullName
    slug
    ...ProductPriceFragment
    ...ProductImagesListFragment
    unit {
        name
    }
    brand {
        ...SimpleBrandFragment
    }
    categories {
        name
    }
    flags {
        ...SimpleFlagFragment
    }
    availability {
        ...AvailabilityFragment
    }
}
