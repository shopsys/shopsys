fragment SliderProductFragment on Product {
    __typename
    id
    uuid
    slug
    fullName
    name
    stockQuantity
    isSellingDenied
    flags {
        ...SimpleFlagFragment
    }
    ...ProductImagesListFragment
    ...ProductPriceFragment
    availability {
        ...AvailabilityFragment
    }
    availableStoresCount
    exposedStoresCount
    catalogNumber
    brand {
        ...SimpleBrandFragment
    }
    categories {
        name
    }
}
