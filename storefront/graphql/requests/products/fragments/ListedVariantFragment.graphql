fragment ListedVariantFragment on Variant {
    uuid
    slug
    name
    stockQuantity
    flags {
        ...SimpleFlagFragment
    }
    ...ProductDetailImagesFragment
    ...ProductPriceFragment
    availability {
        ...AvailabilityFragment
    }
    availableStoresCount
    exposedStoresCount
    catalogNumber
    storeAvailabilities {
        ...StoreAvailabilityFragment
    }
}
