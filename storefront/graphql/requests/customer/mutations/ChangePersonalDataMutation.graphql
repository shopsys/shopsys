mutation ChangePersonalDataMutation(
    $firstName: String!
    $lastName: String!
    $telephone: String!
    $street: String!
    $city: String!
    $postcode: String!
    $country: String!
    $newsletterSubscription: Boolean!
) {
    ChangePersonalData(input:{
        firstName: $firstName
        lastName: $lastName
        telephone: $telephone
        street: $street
        city: $city
        postcode: $postcode
        country: $country
        newsletterSubscription: $newsletterSubscription
    }){
        email
    }
}
