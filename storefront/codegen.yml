overwrite: true
schema: schema.graphql
documents: './graphql/requests/**/*.graphql'
generates:
    graphql/generated/index.tsx:
        plugins:
            - 'typescript'
            - 'typescript-operations'
            - 'fragment-matcher'
            - 'typescript-urql'
        config:
            typesSuffix: Api
            withHooks: true
            withHOC: false
            withComponent: false
            scalars:
                Money: string
