version: "3.4"
services:
    webserver:
        restart: always
        image: nginx:1.13-alpine
        depends_on:
            - php-fpm
        volumes:
            - web-volume:/var/www/html/web
            - nginx-conf:/etc/nginx/conf.d/
        labels:
            - traefik.backend=${COMPOSE_PROJECT_NAME}
            - traefik.frontend.rule=Host:${HOSTS}
            - traefik.docker.network=ci_traefik-network
            - traefik.port=8080
        networks:
            - default
            - traefik-network

    storefront:
        restart: always
        image: ${STOREFRONT_TAG}
        environment:
            INTERNAL_GRAPHQL_ENDPOINT: http://${COMPOSE_PROJECT_NAME}_webserver_1:8080/graphql/
            DOMAIN_HOST_1: sf.${HOST}
            DOMAIN_HOST_2: en.sf.${HOST}
            DOMAIN_BACKEND_HOST_1: ${HOST}
            DOMAIN_BACKEND_HOST_2: en.${HOST}
            PUBLIC_GRAPHQL_ENDPOINT_1: https://${HOST}/graphql/
            PUBLIC_GRAPHQL_ENDPOINT_2: https://en.${HOST}/graphql/
        labels:
            - traefik.backend=${COMPOSE_PROJECT_NAME}_storefront
            - traefik.frontend.rule=Host:${STOREFRONT_HOSTS}
            - traefik.docker.network=ci_traefik-network
            - traefik.port=3000
        networks:
            - default
            - traefik-network

    php-fpm:
        restart: always
        image: ${TAG}
        volumes:
            - web-volume:/var/www/html/web
            - nginx-conf:/var/www/html/docker/nginx
        environment:
            ELASTIC_SEARCH_INDEX_PREFIX: ${COMPOSE_PROJECT_NAME}
            IGNORE_DEFAULT_ADMIN_PASSWORD_CHECK: 1
            REDIS_PREFIX: ${COMPOSE_PROJECT_NAME}
        labels:
            - traefik.enable=false
        networks:
            - default
            - services-network

volumes:
    web-volume:
    nginx-conf:

networks:
    traefik-network:
        external:
            name: ci_traefik-network
    services-network:
        external:
            name: ci_default
