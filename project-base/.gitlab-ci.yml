stages:
    - build
    - test
    - regenerate
    - review
    - ai-review
    - deploy
    - service

.only-default: &only-default
    rules:
        -   if: '$MIRROR_ONLY == "true"'
            when: never
        -   if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
        -   if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
            when: never
        -   if: '$CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"'

variables:
    TAG: ${CI_REGISTRY_IMAGE}/${CI_COMMIT_REF_SLUG}:${CI_COMMIT_SHA}-${CI_PIPELINE_ID}
    STOREFRONT_TAG: ${CI_REGISTRY_IMAGE}/${CI_COMMIT_REF_SLUG}:${CI_COMMIT_SHA}-${CI_PIPELINE_ID}-storefront
    HOST: ${CI_COMMIT_REF_SLUG}.${CI_PROJECT_NAME}.${REVIEW_URL}
    HOSTS: ${HOST}, cs.${HOST}, ${HOST}/sk
    COMPOSE_PROJECT_NAME: ${CI_PROJECT_NAME}__${CI_COMMIT_REF_SLUG}

before_script:
    - echo ${CI_REGISTRY_PASSWORD} | docker login -u ${CI_REGISTRY_USER} ${CI_REGISTRY} --password-stdin

# Can be removed if mirroring is not needed
include: gitlab/mirror-repository/gitlab-stage.yml

build:
    stage: build
    <<: *only-default
    tags:
        - build
    script:
        - cp -R ./docker/nginx/ ./app/docker/nginx/
        - cd ./app/
        - docker build -f ./docker/php-fpm/Dockerfile --target production --compress -t ${TAG} .
        - docker push ${TAG}
    interruptible: true

build-storefront:
    stage: build
    <<: *only-default
    tags:
        - build
    script:
        - cp ./app/schema.graphql ./storefront/schema.graphql
        - docker build -f ./storefront/docker/Dockerfile
            --target production
            --compress
            --build-arg CYPRESS_KEEP_TID=1
            --build-arg SENTRY_RELEASE=${CI_COMMIT_SHORT_SHA}
            --build-arg SENTRY_URL=${SENTRY_URL}
            --build-arg SENTRY_ORG=shopsys
            --build-arg SENTRY_PROJECT=${SENTRY_PROJECT}
            --build-arg SENTRY_AUTH_TOKEN=${SENTRY_AUTH_TOKEN}
            -t ${STOREFRONT_TAG} ./storefront
        - docker push ${STOREFRONT_TAG}
    interruptible: true

test:standards-with-graphql-schema-check:
    stage: test
    <<: *only-default
    tags:
        - tests
    needs:
        - build
    script:
        - docker run -i ${TAG} /bin/bash -c "mv PRODUCTION DEVELOPMENT; npm install format-graphql && php phing composer-dev && ./check-schema.sh && php phing standards"
        - |
            docker run -i ${TAG} /bin/bash -c "php bin/console shopsys:environment:change dev && php phing composer-dev && php bin/console ux:icons:lock" | grep "Imported 0 icons" \
            || { 
                echo "Not all icons are committed. Run 'bin/console ux:icons:lock' and commit the changes.";
                exit 1;
            }
    interruptible: true

test:storefront-standards-with-codegen-with-tests-with-licenses-check:
    stage: test
    <<: *only-default
    image: node:24.14.0-alpine3.22
    tags:
        - tests
    needs:
        - build-storefront
    before_script:
        - corepack enable
        - corepack prepare --activate pnpm@10.30.3
        - pnpm config set store-dir .pnpm-store
        - apk add --no-cache grep git
        - cp ./app/schema.graphql ./storefront/schema.graphql
        - cd ./storefront
    script:
        - pnpm install --frozen-lockfile
        - ./check-next-public-variable.sh
        - ./check-code-gen.sh
        - pnpm run check
        - pnpm run knip
        - pnpm test--no-watch
        - sh scripts/check-licenses.sh
        - pnpm run translate
        - |
            if [ -n "$(git status --porcelain)" ]; then
                echo "Not all translations are dumped. Run 'pnpm run translate' and commit the changes."
                git status -s
                exit 1
            else
                echo "All translations are dumped"
            fi
        - pnpm compile-tailwind-for-admin
        - |
            if [ -n "$(git status --porcelain)" ]; then
                echo "Tailwind admin styles are outdated. Run 'docker compose exec storefront pnpm compile-tailwind-for-admin' locally and commit the changes."
                git status -s
                exit 1
            else
                echo "Tailwind admin styles are up to date"
            fi
    interruptible: true

tests:functional-and-acceptance-with-licenses-check:
    image: docker:latest
    stage: test
    <<: *only-default
    tags:
        - tests
    needs:
        - build
        - build-storefront
    script:
        - cp -f ./gitlab/docker-compose-ci.yml ./docker-compose.yml
        - docker compose up -d
        - docker compose exec -T php-fpm /bin/bash -c "mv PRODUCTION DEVELOPMENT; php phing composer-dev npm-install-dependencies test-db-create frontend-api-generate-new-keys tests tests-acceptance-build tests-acceptance"
        - docker compose exec -T php-fpm bash -c "scripts/check-licenses.sh"
        - docker compose exec -T php-fpm /bin/bash -c "php phing translations-dump"
        - docker compose cp php-fpm:/var/www/html/translations ./app/
        - |
            if [ -n "$(git status --porcelain)" ]; then
                echo "Not all translations are dumped. Run 'php phing translations-dump' and commit the changes."
                git status -s
                exit 1
            else
                echo "All translations are dumped"
            fi
    after_script:
        - mkdir -p codeception/
        - docker cp shopsys-framework-php-fpm:/var/www/html/var/log/codeception/ ./
    artifacts:
        paths:
            - codeception/
        when: on_failure
        expire_in: 1 day
    interruptible: true

test:storefront-acceptance:
    image: docker:latest
    stage: test
    <<: *only-default
    tags:
        - tests
    #    parallel:
    #        matrix:
    #            -   GROUP: "authentication"
    #            -   GROUP: "b2b"
    #            -   GROUP: "cart"
    #            -   GROUP: "comparison"
    #            -   GROUP: "complaints"
    #            -   GROUP: "customerUsers"
    #            -   GROUP: "filterAndSort"
    #            -   GROUP: "freeShipping"
    #            -   GROUP: "limitedUser"
    #            -   GROUP: "order"
    #            -   GROUP: "seoCategory"
    #            -   GROUP: "ssr"
    #            -   GROUP: "stores"
    #            -   GROUP: "transportAndPayment"
    #            -   GROUP: "visits"
    #            -   GROUP: "others"
    artifacts:
        paths:
            - ./storefront/cypress/videos/
            - ./storefront/cypress/screenshots/
            - ./storefront/cypress/snapshotDiffs/
            - php-fpm-log.txt
            - webserver-log.txt
            - storefront-log.txt
        when: on_failure
        expire_in: 1 day
    script:
        - cp -f ./gitlab/docker-compose-ci.yml ./docker-compose.yml
        - docker compose up -d
        - docker compose exec -T php-fpm php phing -D production.confirm.action=y composer-prod db-create frontend-api-generate-new-keys build-demo-dev-quick
        - cd storefront
        - GROUP=$GROUP TEST_LOCALE=en docker compose run cypress
    after_script:
        - docker compose logs php-fpm > php-fpm-log.txt
        - docker compose logs webserver > webserver-log.txt
        - docker compose logs storefront > storefront-log.txt
    interruptible: true

test:cypress-smoke:
    image: tmaier/docker-compose:latest
    stage: test
    <<: *only-default
    tags:
        - tests
    artifacts:
        paths:
            - ./storefront/cypress/videos/
            - ./storefront/cypress/screenshots/
            - php-fpm-log.txt
            - webserver-log.txt
            - storefront-log.txt
        when: on_failure
        expire_in: 1 day
        name: "cypress-smoke-$CI_JOB_ID"
    script:
        - cp -f ./gitlab/docker-compose-ci.yml ./docker-compose.yml
        - docker compose up -d
        - docker compose exec -T php-fpm php phing -D production.confirm.action=y composer-prod db-create frontend-api-generate-new-keys build-demo-dev-quick
        - cd storefront
        - docker compose run --rm -e TYPE=null -e COMMAND=smoke -e TEST_LOCALE=en cypress
    after_script:
        - docker compose logs php-fpm > php-fpm-log.txt
        - docker compose logs webserver > webserver-log.txt
        - docker compose logs storefront > storefront-log.txt
    interruptible: true

regenerate-storefront-screenshots:
    image: docker:latest
    stage: regenerate
    <<: *only-default
    tags:
        - tests
    needs:
        - build
        - build-storefront
    #    parallel:
    #        matrix:
    #            - GROUP: "authentication"
    #            - GROUP: "cart"
    #            - GROUP: "order"
    #            - GROUP: "transportAndPayment"
    #            - GROUP: "visits"
    #            - GROUP: "ssr"
    #            - GROUP: "others"
    artifacts:
        paths:
            - ./storefront/cypress/snapshots/
            - php-fpm-log.txt
            - webserver-log.txt
            - storefront-log.txt
        when: on_failure
        expire_in: 1 day
    script:
        - apk add --no-cache git
        - git config --global user.name "Shopsys Bot"
        - git config --global user.email "bot@shopsys.com"
        - git clean -fdx
        - |
            # Decision about target branch
            if [ -n "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" ]; then
            echo "Pipeline run on merge request. Using source branch: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
            TARGET_BRANCH="$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
            else
            echo "Pipeline run on branch: $CI_COMMIT_REF_NAME"
            TARGET_BRANCH="$CI_COMMIT_REF_NAME"
            fi
            echo "Working on branch: $TARGET_BRANCH"
        - git fetch origin "$TARGET_BRANCH"
        - git checkout "$TARGET_BRANCH"
        - cp -f ./gitlab/docker-compose-ci.yml ./docker-compose.yml
        - docker compose up -d
        - docker compose exec -T php-fpm php phing -D production.confirm.action=y composer-prod db-create frontend-api-generate-new-keys build-demo-dev-quick
        - GROUP=$GROUP TEST_LOCALE=en docker compose run cypress-regenerate-screenshots
        - git add ./storefront/cypress/snapshots/e2e
        - git status
        - |
            if ! git diff --staged --quiet; then
                if [ -z "$GROUP" ]; then
                    git commit -m "Regenerated Cypress screenshots"
                else
                    git commit -m "Regenerated Cypress screenshots for ${GROUP} group"
                fi
                git fetch origin "$TARGET_BRANCH"
                git pull --rebase origin "$TARGET_BRANCH"
                git push https://shopsys_bot:$API_TOKEN@gitlab.shopsys.cz/ss6-projects/${CI_PROJECT_NAME}.git "$TARGET_BRANCH" --force -v || (echo "Failed to push changes" && git log -n 5 && exit 1)
            else
                echo "No changes in snapshots, skipping commit."
            fi
    after_script:
        - docker compose logs php-fpm > php-fpm-log.txt
        - docker compose logs webserver > webserver-log.txt
        - docker compose logs storefront > storefront-log.txt
    interruptible: true
    when: manual

review:
    stage: review
    environment:
        name: "review/${CI_COMMIT_REF_SLUG}"
        url: https://${CI_COMMIT_REF_SLUG}.${CI_PROJECT_NAME}.${REVIEW_URL}
        on_stop: review:stop
        auto_stop_in: 1 week
    needs:
        - build
        - build-storefront
    <<: *only-default
    artifacts:
        paths:
            - schema.graphql
    script:
        - cp -f ./gitlab/docker-compose-ci-review.yml ./docker-compose.yml
        - chmod +x ./gitlab/scripts/set-urls-for-review.sh && source ./gitlab/scripts/set-urls-for-review.sh
        - convertToTraefikHosts "$HOSTS"
        - setDomainsToDockerCompose
        - docker compose down --rmi all -v --remove-orphans
        - chmod +x ./gitlab/scripts/rabbitmq-vhost.sh && ./gitlab/scripts/rabbitmq-vhost.sh create ${COMPOSE_PROJECT_NAME}
        - docker compose up -d
        - setUrlsToDomainsUrls
        - docker compose exec -T php-fpm php phing -D production.confirm.action=y clean db-create build-review-ci
        - docker compose exec -T php-consumer php phing -D production.confirm.action=y frontend-api-generate-new-keys
        - printDomains
    tags:
        - review
    interruptible: true

ai:acceptance-criteria:
    stage: ai-review
    # Digest-pinned like the MCP images, because this job holds the Jira and Claude credentials and a floating tag
    # would let a silently-updated upstream image run with them. This digest is docker:29.7.1-cli.
    image: docker@sha256:27a51d5ab1cd38d9eeaba7b415b8c07bc10c31e1cf1ec8d78f6413fcfab3f44f
    tags:
        - review
    needs:
        - review
    rules:
        -   if: '$MIRROR_ONLY == "true"'
            when: never
        -   if: '$CLAUDE_CODE_OAUTH_TOKEN == null || $CLAUDE_CODE_OAUTH_TOKEN == ""'
            when: never
        # All three Jira variables are required - skipping on a half-configured project is friendlier than failing.
        -   if: '$JIRA_TOKEN == null || $JIRA_TOKEN == ""'
            when: never
        -   if: '$JIRA_SITE_URL == null || $JIRA_SITE_URL == ""'
            when: never
        -   if: '$JIRA_ACCOUNT == null || $JIRA_ACCOUNT == ""'
            when: never
        # The wrapper script can neither fetch the diff nor post the report without it.
        -   if: '$API_TOKEN == null || $API_TOKEN == ""'
            when: never
        -   if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    variables:
        REVIEW_BASE_URL: https://${HOST}
        PLAYWRIGHT_OUTPUT_DIR: ${CI_PROJECT_DIR}/playwright-evidence
        MCP_CONFIG_FILE: ${CI_PROJECT_DIR}/mcp-config.json
        REPORT_FILE: ${CI_PROJECT_DIR}/acceptance-criteria-report.md
        # A daemon-managed named volume, not a bind mount: the docker CLI here talks to the runner's Docker daemon,
        # and "-v ${CI_PROJECT_DIR}/...:/out" would only resolve when the builds directory is a host-bind volume
        # present at the same path on that daemon's host. A named volume has no host path, so the screenshots are
        # extracted afterwards with "docker cp", which streams over the daemon API and works on any runner.
        EVIDENCE_VOLUME: playwright-evidence-${CI_JOB_ID}
        JIRA_IMAGE: ghcr.io/sooperset/mcp-atlassian@sha256:d2bb29af785bc44bbb16eee4e577eceabe208cdbe1bcac80c4be9915864de45d
        PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright/mcp@sha256:18c0a9c934004fe9580cc79f1e8e6e6cde7c667348b215335e8a23fd3e509804
    # Advisory only - a failed check never blocks the merge request.
    allow_failure: true
    interruptible: true
    # The GitHub side queues concurrent runs of this check per pull request with a "concurrency" group; this is
    # the GitLab counterpart - two pipelines of the same merge request never drive one review environment at once.
    resource_group: ai-acceptance-criteria-$CI_MERGE_REQUEST_IID
    # Caps wall-clock for parity with the GitHub job - "--max-turns" bounds the agent's steps, this bounds the time.
    timeout: 30m
    script:
        - apk add --no-cache bash curl git jq nodejs npm
        - npm install -g @anthropic-ai/claude-code@2.1.226
        - chmod +x ./gitlab/scripts/ai-acceptance-criteria.sh
        # The MCP configuration is written to a private file rather than passed on the command line, so the Jira
        # credentials are not visible in "ps" output - the "${...}" placeholders below are expanded by the agent
        # from its own environment, so no secret is written to disk either. The browser is confined to the review
        # origins so an instruction smuggled into a ticket cannot send it somewhere else. The Playwright container
        # writes into a named volume; the end of this script copies the evidence out of it and scans it before upload.
        - mkdir -p "${PLAYWRIGHT_OUTPUT_DIR}" && chmod 700 "${PLAYWRIGHT_OUTPUT_DIR}"
        - docker volume create "${EVIDENCE_VOLUME}" > /dev/null
        # Every origin the browser may reach is derived from the HOSTS list, so projects with a different domain
        # count or subdomain prefix stay confined to exactly their own review domains. The hosts are built from the
        # branch name - GitLab already sanitises its ref slug, but the JSON below would break out on a quote, so
        # each one is checked here rather than relying on that guarantee holding. A path-only domain (like /sk)
        # collapses into its host's origin.
        - |
            ALLOWED_ORIGINS=""
            for HOST_ENTRY in $(printf '%s' "${HOSTS}" | tr ',' ' '); do
                HOST_ONLY="${HOST_ENTRY%%/*}"

                if ! printf '%s' "${HOST_ONLY}" | grep -qE '^[a-z0-9][a-z0-9.-]*$'; then
                    echo "The review host [${HOST_ONLY}] contains unexpected characters, refusing to continue."
                    exit 1
                fi

                case ";${ALLOWED_ORIGINS};" in
                    *";https://${HOST_ONLY};"*) ;;
                    *) ALLOWED_ORIGINS="${ALLOWED_ORIGINS:+${ALLOWED_ORIGINS};}https://${HOST_ONLY}" ;;
                esac
            done
        - |
            install -m 600 /dev/null "${MCP_CONFIG_FILE}"
            cat > "${MCP_CONFIG_FILE}" <<JSON
            {
                "mcpServers": {
                    "jira": {
                        "type": "stdio",
                        "command": "docker",
                        "args": ["run", "--rm", "-i", "-e", "JIRA_URL", "-e", "JIRA_USERNAME", "-e", "JIRA_API_TOKEN", "${JIRA_IMAGE}"],
                        "env": {
                            "JIRA_URL": "\${JIRA_SITE_URL}",
                            "JIRA_USERNAME": "\${JIRA_ACCOUNT}",
                            "JIRA_API_TOKEN": "\${JIRA_TOKEN}"
                        }
                    },
                    "playwright": {
                        "type": "stdio",
                        "command": "docker",
                        "args": [
                            "run", "--rm", "-i", "--init", "--ipc=host",
                            "--user", "$(id -u):$(id -g)", "-e", "HOME=/out",
                            "-v", "${EVIDENCE_VOLUME}:/out", "${PLAYWRIGHT_IMAGE}",
                            "--output-dir", "/out", "--isolated",
                            "--viewport-size", "1280x720",
                            "--allowed-origins", "${ALLOWED_ORIGINS}"
                        ]
                    }
                }
            }
            JSON
        # The agent's exit code is captured instead of aborting the job right here, so the evidence is always
        # extracted and scanned below - in the script itself, because GitLab ignores after_script exit codes and a
        # scan hit there could never fail the job.
        - |
            CLAUDE_EXIT_CODE=0
            claude -p "/acceptance-criteria-check ${CI_MERGE_REQUEST_PROJECT_URL}/-/merge_requests/${CI_MERGE_REQUEST_IID} review-url=${REVIEW_BASE_URL} report-file=${REPORT_FILE}" \
                --model claude-opus-4-8 \
                --max-turns 120 \
                --permission-mode dontAsk \
                --strict-mcp-config \
                --mcp-config "${MCP_CONFIG_FILE}" \
                --allowedTools "Read(/${CI_PROJECT_DIR}/**),Edit(/${PLAYWRIGHT_OUTPUT_DIR}/**),Edit(/${REPORT_FILE}),TodoWrite,Bash(./gitlab/scripts/ai-acceptance-criteria.sh:*),Bash(ls:*),mcp__jira__jira_search,mcp__jira__jira_get_issue,mcp__playwright__browser_navigate,mcp__playwright__browser_navigate_back,mcp__playwright__browser_snapshot,mcp__playwright__browser_take_screenshot,mcp__playwright__browser_click,mcp__playwright__browser_type,mcp__playwright__browser_fill_form,mcp__playwright__browser_select_option,mcp__playwright__browser_press_key,mcp__playwright__browser_hover,mcp__playwright__browser_wait_for,mcp__playwright__browser_handle_dialog,mcp__playwright__browser_console_messages,mcp__playwright__browser_network_requests,mcp__playwright__browser_tabs,mcp__playwright__browser_resize" \
                || CLAUDE_EXIT_CODE=$?
        # Copy the screenshots out of the named volume with "docker cp" - it streams over the daemon API, so no
        # host path is assumed.
        - |
            HELPER_CONTAINER="$(docker create -v "${EVIDENCE_VOLUME}:/out" "${PLAYWRIGHT_IMAGE}" true)"
            docker cp "${HELPER_CONTAINER}:/out/." "${PLAYWRIGHT_OUTPUT_DIR}/" || echo "No evidence to copy out of the volume."
            docker rm "${HELPER_CONTAINER}" > /dev/null || true
            docker volume rm -f "${EVIDENCE_VOLUME}" > /dev/null 2>&1 || true
        # Matching the GitHub side's defence in depth: a smuggled instruction could copy a credential into any
        # evidence file, and the artifact is visible to everyone with access to the project, so on a verbatim hit
        # the evidence and report are deleted and the job fails before anything is uploaded. This catches a
        # verbatim copy, not an encoded one - one line of defence, not the only one. TEST_CANARY is a tripwire
        # for testing this refusal; unset, the length check skips it.
        - |
            for SECRET in "${JIRA_TOKEN:-}" "${JIRA_SITE_URL:-}" "${JIRA_ACCOUNT:-}" "${API_TOKEN:-}" "${CLAUDE_CODE_OAUTH_TOKEN:-}" "${TEST_CANARY:-}"; do
                if [ ${#SECRET} -gt 8 ] && grep -rqF -- "${SECRET}" "${PLAYWRIGHT_OUTPUT_DIR}" "${REPORT_FILE}" 2>/dev/null; then
                    rm -rf "${PLAYWRIGHT_OUTPUT_DIR}" "${REPORT_FILE}"
                    echo "The evidence repeats a secret value verbatim, refusing to upload it."
                    exit 1
                fi
            done
        - exit "${CLAUDE_EXIT_CODE}"
    # Safety net for a cancelled or timed-out job, where the script never reaches its own volume removal - a
    # leftover named volume would otherwise accumulate on the runner's Docker daemon. Only cleanup belongs here:
    # GitLab ignores after_script exit codes, so anything that must be able to fail the job lives in the script.
    after_script:
        - docker volume rm -f "${EVIDENCE_VOLUME}" > /dev/null 2>&1 || true
    artifacts:
        # Only the report and the screenshots - any other file the agent could be talked into leaving in the output
        # directory never ships.
        paths:
            - playwright-evidence/*.png
            - acceptance-criteria-report.md
        when: always
        expire_in: 1 week

review:stop:
    stage: review
    variables:
        GIT_STRATEGY: none
    needs:
        - build
    <<: *only-default
    tags:
        - review
    script:
        - cp -f ./gitlab/docker-compose-ci-review.yml ./docker-compose.yml
        - docker compose exec -T php-fpm php phing -D production.confirm.action=y elasticsearch-index-delete
        - docker compose down --rmi all -v --remove-orphans
        - chmod +x ./gitlab/scripts/rabbitmq-vhost.sh && ./gitlab/scripts/rabbitmq-vhost.sh remove ${COMPOSE_PROJECT_NAME}
        - /home/ci/clean.sh ${COMPOSE_PROJECT_NAME}
    rules:
        -   if: '$MIRROR_ONLY == "true"'
            when: never
        -   if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
            when: manual
            allow_failure: true
        -   if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
            when: never
        -   if: '$CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"'
            when: manual
            allow_failure: true
    environment:
        name: review/${CI_COMMIT_REF_SLUG}
        action: stop

repository:clean:
    stage: service
    image: dwdraju/alpine-curl-jq
    tags:
        - service
    rules:
        -   if: '$CI_PIPELINE_SOURCE == "schedule"'
    before_script:
        - chmod +x ./gitlab/scripts/repository-clean.sh
    script:
        - ./gitlab/scripts/repository-clean.sh

security:check:
    stage: service
    tags:
        - service
    needs:
        - build
        - build-storefront
    rules:
        -   if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE != "schedule"'
    script:
        - docker run -i ${TAG} composer security-check
        - docker run -i ${STOREFRONT_TAG} pnpm audit --audit-level=high --ignore-registry-errors

service:merge_request:
    stage: service
    image: dwdraju/alpine-curl-jq
    tags:
        - service
    needs: []
    rules:
        -   if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    before_script:
        - chmod +x ./gitlab/scripts/cancel-previous-pipelines.sh
        - chmod +x ./gitlab/scripts/set-review-url-to-jira.sh
    script:
        - ./gitlab/scripts/cancel-previous-pipelines.sh
        - ./gitlab/scripts/set-review-url-to-jira.sh

.deploy: &deploy
    image:
        name: shopsys/kubernetes-buildpack:2.0
    stage: deploy
    needs:
        - build
        - build-storefront
    tags:
        - deploy
    rules:
        -   if: '$MIRROR_ONLY == "true"'
            when: never
        -   if: '$CI_PIPELINE_SOURCE == "schedule"'
            when: never
    script:
        - cd ./app/
        - docker create -ti --name image ${TAG} bash
        - docker cp image:/var/www/html/var/ ./
        - echo "${KUBE_CONFIG}" > /root/.kube/config
        - chmod +x ./deploy/deploy-project.sh && ./deploy/deploy-project.sh deploy

sentry-release-commits:
    image:
        name: getsentry/sentry-cli:latest
        entrypoint: [""]
    stage: deploy
    needs: []
    tags:
        - deploy
    variables:
        GIT_DEPTH: 0
        SENTRY_ORG: shopsys
        SENTRY_RELEASE: ${CI_COMMIT_SHORT_SHA}
    before_script: []
    rules:
        -   if: '$MIRROR_ONLY == "true"'
            when: never
        -   if: '$CI_PIPELINE_SOURCE == "schedule"'
            when: never
        -   if: '$CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH =~ /^master-.*$/'
        -   if: '$CI_COMMIT_BRANCH == "devel" || $CI_COMMIT_BRANCH =~ /^devel-.*$/'
        -   if: '$CI_COMMIT_BRANCH == "alpha" || $CI_COMMIT_BRANCH =~ /^alpha-.*$/'
    script:
        - sentry-cli releases new "${SENTRY_RELEASE}" || sentry-cli releases info "${SENTRY_RELEASE}"
        - sentry-cli releases set-commits "${SENTRY_RELEASE}" --auto --ignore-missing
        - sentry-cli releases finalize "${SENTRY_RELEASE}"

deploy:production:
    <<: *deploy
    resource_group: deploy_production
    variables:
        KUBE_CONFIG: ${KUBE_PROD}
    rules:
        -   if: '$MIRROR_ONLY == "true"'
            when: never
        -   if: '$CI_PIPELINE_SOURCE == "schedule"'
            when: never
        -   if: '$CI_COMMIT_BRANCH == "master"'
            allow_failure: false
        -   if: '$CI_COMMIT_BRANCH =~ /^master-.*$/'
            when: manual
            allow_failure: false
    environment:
        name: production
        url: https://${DOMAIN_HOSTNAME_1}
        kubernetes:
            namespace: ${PROJECT_NAME}

deploy:devel:
    <<: *deploy
    resource_group: deploy_devel
    variables:
        KUBE_CONFIG: ${KUBE_DEV}
    rules:
        -   if: '$MIRROR_ONLY == "true"'
            when: never
        -   if: '$CI_PIPELINE_SOURCE == "schedule"'
            when: never
        -   if: '$CI_COMMIT_BRANCH == "devel" || $CI_COMMIT_BRANCH =~ /^devel-.*$/'
    environment:
        name: devel
        url: https://${DOMAIN_HOSTNAME_1}
        kubernetes:
            namespace: ${PROJECT_NAME}

deploy:alpha:
    <<: *deploy
    resource_group: deploy_alpha
    variables:
        KUBE_CONFIG: ${KUBE_DEV}
    rules:
        -   if: '$CI_PIPELINE_SOURCE == "schedule"'
            when: never
        -   if: '$CI_COMMIT_BRANCH == "alpha" || $CI_COMMIT_BRANCH =~ /^alpha-.*$/'
    environment:
        name: devel-alpha
        url: https://${DOMAIN_HOSTNAME_1}
        kubernetes:
            namespace: ${PROJECT_NAME}
    after_script:
        -   sleep 20
        -   RUNNING_WEBSERVER_PHP_FPM_POD=$(kubectl get pods --namespace=${PROJECT_NAME} --field-selector=status.phase=Running -l app=webserver-php-fpm -o=jsonpath='{.items[0].metadata.name}')
        -   kubectl exec ${RUNNING_WEBSERVER_PHP_FPM_POD} --namespace=${PROJECT_NAME} -- php ./bin/console dbal:run-sql "UPDATE setting_values SET value='Db4tLxuck2' WHERE name='feedHash'"

test:gatling:
    stage: test
    image:
        name: shopsys/kubernetes-buildpack:2.0
    tags:
        - tests
    variables:
        GATLING_BASE_URL: ${GATLING_BASE_URL}
        GATLING_PAGE_TEST_DURATION: '10'
        GATLING_API_TEST_DURATION: '10'
        GATLING_PAGE_USERS_COUNTS_LVL1: '2'
        GATLING_PAGE_USERS_COUNTS_LVL2: '10'
        GATLING_PAGE_USERS_COUNTS_LVL3: '15'
        GATLING_RESULTS: ''
        GATLING_STRESS_TEST_DURATION: '60'
        GATLING_STRESS_TEST_USERS_COUNTS: '100'
    needs: []
    rules:
        - if: '$CI_PIPELINE_SOURCE == "schedule"'
          when: never
        - if: '$CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "devel"'
          when: manual
    allow_failure: true
    before_script:
        - chmod +x ./gatling/run.sh
    script:
        - cd ./gatling
        - ./run.sh
    artifacts:
        paths:
            - gatling/results
        when: always
        expire_in: 1 day
