fragment BrandDetailFragment on Brand {
    __typename
    id
    uuid
    slug
    breadcrumb {
        ...BreadcrumbFragment
    }
    name
    seo {
        ...SeoAttributesFragment
    }
    hreflangLinks {
        ...HreflangLinksFragment
    }
    description
    mainImage {
        ...ImageFragment
    }
    products(orderingMode: $orderingMode, filter: $filter) {
        ...ListedProductConnectionPreviewFragment
    }
}
