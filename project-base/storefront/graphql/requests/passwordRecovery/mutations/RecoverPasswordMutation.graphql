mutation RecoverPasswordMutation(
    $email: String!
    $hash: String!
    $newPassword: Password!
    $cartUuid: Uuid
    $productListsUuids: [Uuid!]!
) {
    RecoverPassword(
        input: {
            email: $email
            hash: $hash
            newPassword: $newPassword
            cartUuid: $cartUuid
            productListsUuids: $productListsUuids
        }
    ) {
        tokens {
            ...TokenFragments
        }
        showCartMergeInfo
    }
}
