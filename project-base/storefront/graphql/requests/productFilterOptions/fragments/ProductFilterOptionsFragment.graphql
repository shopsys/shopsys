fragment ProductFilterOptionsFragment on ProductFilterOptions {
    __typename
    minimalPrice
    maximalPrice
    brands {
        __typename
        count
        isAbsolute
        brand {
            __typename
            uuid
            name
        }
    }
    inStock
    flags {
        __typename
        count
        isAbsolute
        flag {
            ...SimpleFlagFragment
        }
        isSelected
    }
    parameters {
        ... on ParameterCheckboxFilterOption {
            name
            uuid
            __typename
            values {
                __typename
                uuid
                text
                count
                isAbsolute
                isSelected
            }
            isCollapsed
        }
        ... on ParameterColorFilterOption {
            name
            uuid
            __typename
            values {
                __typename
                uuid
                text
                count
                isAbsolute
                rgbHex
                isSelected
                colorIcon {
                    url
                }
            }
            isCollapsed
        }
        ... on ParameterSliderFilterOption {
            name
            uuid
            __typename
            minimalValue
            maximalValue
            unit {
                __typename
                name
            }
            isCollapsed
            selectedValue
            isSelectable
        }
    }
}
