query SeoPageQuery($pageSlug: String!) @redisCache(ttl: 3600) {
    seoPage(pageSlug: $pageSlug) {
        __typename
        title
        metaDescription
        canonicalUrl
        ogTitle
        ogDescription
        ogImage {
            ...ImageFragment
        }
        hreflangLinks {
            ...HreflangLinksFragment
        }
    }
}
