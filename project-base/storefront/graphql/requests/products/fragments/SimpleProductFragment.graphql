fragment SimpleProductFragment on Product {
    __typename
    id
    uuid
    catalogNumber
    fullName
    slug
    productType
    price {
        ...ProductPriceFragment
    }
    mainImage {
        ...ImageFragment
    }
    unit {
        name
    }
    brand {
        ...SimpleBrandFragment
    }
    categories {
        name
    }
    flags {
        ...SimpleFlagFragment
    }
    expectedRestockingDate
    availability {
        ...AvailabilityFragment
    }
}
