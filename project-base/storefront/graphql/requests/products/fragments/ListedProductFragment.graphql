fragment ListedProductFragment on Product {
    __typename
    id
    uuid
    slug
    fullName
    stockQuantity
    isAllowedNegativeStock
    unit {
        __typename
        name
    }
    isSellingDenied
    isCurrentlyOutOfStock
    flags {
        ...SimpleFlagFragment
    }
    mainImage {
        __typename
        url
    }
    price {
        ...ListedProductPriceFragment
    }
    expectedRestockingDate
    availability {
        ...AvailabilityFragment
    }
    availableStoresCount
    catalogNumber
    brand {
        __typename
        name
    }
    categories {
        __typename
        name
    }
    isMainVariant
    isInquiryType
    reviewsSummary {
        __typename
        averageRating
        totalCount
    }

    ... on MainVariant {
        variantsCount
    }

    ... on Variant {
        mainVariant {
            __typename
            reviewsSummary {
                __typename
                averageRating
                totalCount
            }
        }
    }
}
