fragment ProductDetailInterfaceFragment on Product {
    __typename
    id
    uuid
    slug
    fullName
    mainCategory {
        name
    }
    name
    namePrefix
    nameSuffix
    breadcrumb {
        ...BreadcrumbFragment
    }
    catalogNumber
    ean
    description
    unit {
        name
    }
    images {
        ...ImageFragment
    }
    price {
        ...ProductPriceFragment
    }
    parameters {
        ...ParameterFragment
    }
    accessories {
        ...ListedProductFragment
    }
    brand {
        ...SimpleBrandFragment
    }
    zboziCategory
    categories {
        name
    }
    promotionBuyQuantity
    promotionFreeQuantity
    flags {
        ...SimpleFlagFragment
    }
    isSellingDenied
    isCurrentlyOutOfStock
    expectedRestockingDate
    availability {
        ...AvailabilityFragment
    }
    stockQuantity
    isAllowedNegativeStock
    seo {
        ...SeoAttributesFragment
    }
    hreflangLinks {
        ...HreflangLinksFragment
    }
    isMainVariant
    isInquiryType
    productType
    productVideos {
        ...VideoTokenFragment
    }
    relatedProducts {
        ...ListedProductFragment
    }
    files {
        ...FileFragment
    }
    gifts {
        ...ProductGiftFragment
    }
    reviewsSummary {
        ...ProductReviewsSummaryFragment
    }
    # Shared by the initial reviews section and ProductMetadata JSON-LD; keep both consumers in mind when changing pagination or ordering.
    reviews(first: 5, orderingMode: NEWEST) {
        ...ProductReviewConnectionFragment
    }
}
