query ProductReviewsQuery(
    $productUuid: Uuid!
    $first: Int
    $after: String
    $orderingMode: ProductReviewOrderingModeEnum
) {
    product(uuid: $productUuid) {
        reviews(first: $first, after: $after, orderingMode: $orderingMode) {
            ...ProductReviewConnectionFragment
        }
    }
}
