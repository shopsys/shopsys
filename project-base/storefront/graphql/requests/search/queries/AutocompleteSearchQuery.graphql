query AutocompleteSearchQuery(
    $search: String!
    $maxProductCount: Int
    $maxCategoryCount: Int
    $isAutocomplete: Boolean!
    $userIdentifier: Uuid!
) {
    articlesSearch(
        searchInput: {
            search: $search,
            isAutocomplete: $isAutocomplete
            userIdentifier: $userIdentifier
        }
    ) {
        ...SimpleArticleInterfaceFragment
    }
    brandSearch(
        searchInput: {
            search: $search,
            isAutocomplete: $isAutocomplete
            userIdentifier: $userIdentifier
        }
    ) {
        ...SimpleBrandFragment
    }
    categoriesSearch(
        searchInput: {
            search: $search
            isAutocomplete: $isAutocomplete
            userIdentifier: $userIdentifier
        }
        first: $maxCategoryCount
    ) {
        __typename
        totalCount
        edges {
            __typename
            node {
                ...SimpleCategoryFragment
            }
        }
    }
    productsSearch: productsSearch(
        searchInput: {
            search: $search
            isAutocomplete: $isAutocomplete
            userIdentifier: $userIdentifier
        }
        first: $maxProductCount
    ) {
        orderingMode
        defaultOrderingMode
        totalCount
        productFilterOptions {
            ...ProductFilterOptionsFragment
        }
        ...ListedProductConnectionFragment
    }
}
