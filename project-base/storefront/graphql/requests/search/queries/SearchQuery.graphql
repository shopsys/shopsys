query SearchQuery(
    $search: String!
    $isAutocomplete: Boolean!
    $userIdentifier: Uuid!
    $endCursor: String!
    $orderingMode: ProductOrderingModeEnum
    $filter: ProductFilter
    $pageSize: Int
    $parameters: [Uuid!] = []
) {
    articlesSearch(
        searchInput: {
            search: $search
            isAutocomplete: $isAutocomplete
            userIdentifier: $userIdentifier
            parameters: $parameters
        }
    ) {
        ...SimpleArticleInterfaceFragment
    }
    brandSearch(
        searchInput: {
            search: $search
            isAutocomplete: $isAutocomplete
            userIdentifier: $userIdentifier
            parameters: $parameters
        }
    ) {
        ...ListedBrandFragment
    }
    categoriesSearch(
        searchInput: {
            search: $search
            isAutocomplete: $isAutocomplete
            userIdentifier: $userIdentifier
            parameters: $parameters
        }
    ) {
        ...ListedCategoryConnectionFragment
    }
    # This has to exactly match the query definition inside SearchProductsQuery.graphql,
    # as then that query is loaded from cache and not re-fetched unnecessarily.
    productsSearch(
        after: $endCursor
        orderingMode: $orderingMode
        filter: $filter
        first: $pageSize
        searchInput: {
            search: $search
            isAutocomplete: $isAutocomplete
            userIdentifier: $userIdentifier
            parameters: $parameters
        }
    ) {
        orderingMode
        defaultOrderingMode
        totalCount
        productFilterOptions {
            ...ProductFilterOptionsFragment
        }
        ...ListedProductConnectionFragment
    }
}
