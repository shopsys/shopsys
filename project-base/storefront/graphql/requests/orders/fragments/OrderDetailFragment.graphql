fragment OrderDetailFragment on Order {
    __typename
    uuid
    number
    creationDate
    expectedDeliveryDate
    items {
        ...OrderDetailItemFragment
    }
    status
    statusType
    firstName
    lastName
    email
    telephone
    companyName
    companyNumber
    companyTaxNumber
    street
    city
    postcode
    country {
        __typename
        name
        code
    }
    isDeliveryAddressDifferentFromBilling
    deliveryFirstName
    deliveryLastName
    deliveryCompanyName
    deliveryTelephone
    deliveryStreet
    deliveryCity
    deliveryPostcode
    deliveryCountry {
        __typename
        name
        code
    }
    note
    urlHash
    promoCode
    trackingNumber
    trackingUrl
    totalPrice {
        ...PriceFragment
    }
    giftVouchers {
        ...AppliedGiftVoucherFragment
    }
    purchasedGiftVouchers {
        productCatnum
        pdfUrl
    }
    remainingAmountToPay
    isPaid
    hasExternalPayment
    hasPaymentInProcess
    isAwaitingPayment
    paymentTransactionsCount
    lastExternalPaymentUrl
    paymentStatus
    confirmationPageContent {
        content
        status
    }
    deliveredAt
    withdrawalRequest {
        __typename
        email
        firstName
        lastName
        telephone
        note
        requestedAt
        confirmed
    }
    canRequestWithdrawal
    isWithdrawalBlockedByPurchasedGiftVoucher
    withdrawalDeadline
    productReviewsAllowed
    reviewedProductUuids
    customerUser {
        uuid
    }
}
