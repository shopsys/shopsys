fragment ListedOrderFragment on Order {
    __typename
    uuid
    number
    creationDate
    productItems {
        ...OrderItemFragment
    }
    totalPrice {
        ...PriceFragment
    }
    isPaid
    hasExternalPayment
    hasPaymentInProcess
    isAwaitingPayment
    status
    note
    items {
        type
        payment {
            name
            mainImage {
                ...ImageFragment
            }
        }
        transport {
            name
            mainImage {
                ...ImageFragment
            }
        }
    }
}
