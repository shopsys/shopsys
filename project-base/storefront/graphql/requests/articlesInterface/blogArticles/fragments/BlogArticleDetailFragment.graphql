fragment BlogArticleDetailFragment on BlogArticle {
    __typename
    id
    uuid
    name
    slug
    link
    mainImage {
        ...ImageFragment
    }
    breadcrumb {
        ...BreadcrumbFragment
    }
    perex
    text
    modifiedAt
    publishDate
    status
    seo {
        ...SeoAttributesFragment
    }
    hreflangLinks {
        ...HreflangLinksFragment
    }
    mainBlogCategoryUuid
    blogCategories {
        ...SimpleBlogCategoryFragment
    }
    author {
        ...BlogArticleAuthorFragment
    }
}
