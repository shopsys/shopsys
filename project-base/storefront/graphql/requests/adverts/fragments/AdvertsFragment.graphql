fragment AdvertsFragment on Advert {
    __typename
    id
    uuid
    name
    positionName
    type
    categories {
        ...SimpleCategoryFragment
    }
    ... on AdvertCode {
        code
    }
    ... on AdvertImage {
        link
        mainImage(type: "web") {
            ...ImageFragment
        }
        mainImageMobile: mainImage(type: "mobile") {
            ...ImageFragment
        }
    }
}
