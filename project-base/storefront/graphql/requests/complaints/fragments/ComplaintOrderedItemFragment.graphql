fragment ComplaintOrderedItemFragment on OrderItem {
    uuid
    name
    quantity
    unit
    totalPrice {
        priceWithVat
    }
    relatedItems {
        ...OrderItemAdditionalServiceFragment
    }
    order {
        uuid
        number
        creationDate
    }
    product {
        fullName
        mainCategory {
            name
        }
        isVisible
        slug
        productType
        mainImage {
            ...ImageFragment
        }
    }
}
