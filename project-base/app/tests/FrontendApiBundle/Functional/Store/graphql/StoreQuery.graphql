query StoreQuery($uuid: Uuid, $slug: String) {
    store(uuid: $uuid, urlSlug: $slug) {
        name
        slug
        isDefault
        description
        seo {
            title
            metaDescription
            h1
            metaRobots
            canonicalUrl
        }
        street
        city
        postcode
        country {
            code
        }
        specialMessage
        phone
        email
        directions
        latitude
        longitude
        breadcrumb {
            name
            slug
        }
    }
}
