query GetComplaintsQuery (
    $first: Int,
    $last: Int,
    $filter: ComplaintFilterInput,
    $statuslessFilter: ComplaintFilterInput
) {
    complaints(
        first: $first,
        last: $last,
        filter: $filter
    ) {
        totalCount
        edges {
            cursor
            node {
                uuid
                number
                email
                createdAt
                deliveryFirstName
                deliveryLastName
                deliveryCompanyName
                deliveryTelephone
                deliveryStreet
                deliveryCity
                deliveryPostcode
                status
                items {
                    quantity
                    description
                    orderItem {
                        uuid
                    }
                }
                resolution {
                    name
                    value
                }
                bankAccountNumber
            }
        }
    }
    complaintStatusCounts(filter: $statuslessFilter) {
        status {
            code
            type
            name
        }
        count
    }
}
