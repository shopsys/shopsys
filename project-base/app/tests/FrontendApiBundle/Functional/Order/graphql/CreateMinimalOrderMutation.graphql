mutation CreateMinimalOrderMutation(
    $cartUuid: Uuid,
    $firstName: String!,
    $lastName: String!,
    $email: String!,
    $telephone: PhoneDataInput!,
    $street: String!,
    $city: String!,
    $postcode: String!,
    $country: String!,
    $onCompanyBehalf: Boolean!,
    $isDeliveryAddressDifferentFromBilling: Boolean!,
    $deliveryAddressUuid: Uuid,
    $deliveryFirstName: String
    $deliveryLastName: String
    $deliveryStreet: String
    $deliveryCity: String
    $deliveryCountry: String
    $deliveryPostcode: String
) {
    CreateOrder(
        input: {
            cartUuid: $cartUuid
            firstName: $firstName
            lastName: $lastName
            email: $email
            telephone: $telephone
            street: $street
            city: $city
            postcode: $postcode
            country: $country
            onCompanyBehalf: $onCompanyBehalf
            isDeliveryAddressDifferentFromBilling: $isDeliveryAddressDifferentFromBilling
            deliveryAddressUuid: $deliveryAddressUuid
            deliveryFirstName: $deliveryFirstName
            deliveryLastName: $deliveryLastName
            deliveryStreet: $deliveryStreet
            deliveryCity: $deliveryCity
            deliveryCountry: $deliveryCountry
            deliveryPostcode: $deliveryPostcode
        }
    ) {
        orderCreated
        order {
            status
            totalPrice {
                priceWithVat
                priceWithoutVat
                vatAmount
            }
            items {
                name
                unitPrice {
                    priceWithVat
                    priceWithoutVat
                    vatAmount
                }
                totalPrice {
                    priceWithVat
                    priceWithoutVat
                    vatAmount
                }
                quantity
                vatRate
                unit
                type
                product {
                    uuid
                }
            }
            firstName
            lastName
            email
            telephone
            companyName
            companyNumber
            companyTaxNumber
            street
            city
            postcode
            country {
                code
            }
            isDeliveryAddressDifferentFromBilling
            deliveryFirstName
            deliveryLastName
            deliveryCompanyName
            deliveryTelephone
            deliveryStreet
            deliveryCity
            deliveryPostcode
            deliveryCountry {
                code
            }
            note
        }
        cart {
            promoCodes {
                code
                type
            }
            modifications {
                promoCodeModifications {
                    noLongerApplicablePromoCode
                }
            }
        }
    }
}
