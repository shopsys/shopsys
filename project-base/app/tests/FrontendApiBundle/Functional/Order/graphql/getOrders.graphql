query getOrders ($first: Int, $last: Int, $filter: OrderFilterInput, $statuslessFilter: OrderFilterInput) {
    orders (first: $first, last: $last, filter: $filter) {
        edges {
            node {
                status
                totalPrice {
                    priceWithVat
                }
            }
        }
    }
    orderStatusCounts(filter: $statuslessFilter) {
        status {
            code
            type
            name
        }
        count
    }
}
