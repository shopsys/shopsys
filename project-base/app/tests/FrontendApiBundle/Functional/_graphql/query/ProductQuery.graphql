query Product($uuid: Uuid) {
    product(uuid: $uuid) {
        name
        slug
        shortDescription
        seo {
            title
            metaDescription
            h1
            metaRobots
            canonicalUrl
        }
        link
        unit {
            name
        }
        availability {
            name
            status
        }
        stockQuantity
        categories {
            name
        }
        flags {
            name
            rgbColor
        }
        price {
            priceWithVat
            priceWithoutVat
            vatAmount
        }
        brand {
            name
        }
        accessories {
            name
        }
        isSellingDenied
        isCurrentlyOutOfStock
        description
        orderingPriority
        parameters {
            name
            group
            unit {
                name
            }
            values {
                text
            }
        }
        namePrefix
        nameSuffix
        fullName
        catalogNumber
        partNumber
        ean
        usps
        availableStoresCount
        breadcrumb {
            name
            slug
        }
    }
}
