mutation ChangeTransportInCart(
    $cartUuid: Uuid
    $transportUuid: Uuid
    $pickupPlaceIdentifier: String
    $pickupPlaceClosedDates: [String!]! = []
) {
    ChangeTransportInCart(input: {
        cartUuid: $cartUuid
        transportUuid: $transportUuid
        pickupPlaceIdentifier: $pickupPlaceIdentifier
        pickupPlaceClosedDates: $pickupPlaceClosedDates
    }) {
        uuid
        transport {
            uuid
            name
            transportTypeCode
            payments {
                uuid
                name
                type
                price {
                    priceWithoutVat
                    priceWithVat
                    vatAmount
                }
            }
        }
        selectedPickupPlaceIdentifier
    }
}
