mutation OrderWithdrawalRequest(
    $orderUrlHash: String!
    $firstName: String!
    $lastName: String!
    $email: String!
    $telephone: PhoneDataInput
    $note: String
) {
    OrderWithdrawalRequest(
        input: {
            orderUrlHash: $orderUrlHash
            firstName: $firstName
            lastName: $lastName
            email: $email
            telephone: $telephone
            note: $note
        }
    )
}
