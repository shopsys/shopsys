query BrandsProductsFilterOptions {
    brands {
        uuid
        products {
            productFilterOptions {
                ...BrandProductFilterOptions
            }
        }
    }
}

fragment BrandProductFilterOptions on ProductFilterOptions {
    minimalPrice
    maximalPrice
    inStock
    flags {
        flag {
            name
        }
        count
        isAbsolute
    }
    brands {
        brand {
            name
        }
        count
        isAbsolute
    }
}
