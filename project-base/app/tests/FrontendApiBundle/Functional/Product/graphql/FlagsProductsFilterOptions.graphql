query FlagsProductsFilterOptions {
    flags {
        uuid
        products {
            productFilterOptions {
                ...FlagProductFilterOptions
            }
        }
    }
}

fragment FlagProductFilterOptions on ProductFilterOptions {
    minimalPrice
    maximalPrice
    inStock
    flags {
        flag {
            name
        }
        count
    }
    brands {
        brand {
            name
        }
        count
    }
}
