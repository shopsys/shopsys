query CategoryProductsFilterOptions($categoryUuid: Uuid!, $filter: ProductFilter) {
    category(uuid: $categoryUuid) {
        products(filter: $filter) {
            productFilterOptions {
                flags {
                    flag {
                        name
                    }
                    count
                }
                brands {
                    brand {
                        name
                    }
                    count
                }
                inStock
                minimalPrice
                maximalPrice
                parameters {
                    isCollapsed
                    name
                    __typename
                    unit {
                        name
                    }
                    ... on ParameterCheckboxFilterOption {
                        values {
                            text
                            count
                        }
                    }
                    ... on ParameterColorFilterOption {
                        values {
                            text
                            count
                            rgbHex
                            colorIcon {
                                anchorText
                                url
                                viewUrl
                                filesize
                                extension
                            }
                        }
                    }
                    ... on ParameterSliderFilterOption {
                        minimalValue
                        maximalValue
                    }
                }
            }
        }
    }
}
