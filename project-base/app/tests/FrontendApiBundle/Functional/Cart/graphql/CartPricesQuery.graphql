query CartPricesQuery(
    $cartUuid: Uuid,
) {
    cart(
        cartInput: {
            cartUuid: $cartUuid
        }) {
        uuid
        totalPrice {
            priceWithVat
        }
        totalItemsPrice {
            priceWithVat
        }
        totalDiscountPrice {
            priceWithVat
        }
        remainingAmountToPay
        remainingItemsAmountToPay
        giftVouchersExceedPayableAmount
    }
}
