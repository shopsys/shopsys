mutation ($cartUuid: Uuid, $cartItemUuid: Uuid!) {
    RemoveFromCart(input: {cartUuid: $cartUuid, cartItemUuid: $cartItemUuid}) {
        uuid
        items {
            uuid
            type
            quantity
            product { uuid }
        }
        removedGifts {
            quantity
            product { uuid }
        }
    }
}
