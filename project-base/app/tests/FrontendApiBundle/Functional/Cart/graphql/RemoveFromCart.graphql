mutation RemoveFromCart(
    $cartItemUuid: Uuid!,
    $cartUuid: Uuid,
) {
    RemoveFromCart(
        input: {
            cartItemUuid: $cartItemUuid
            cartUuid: $cartUuid
        }
    ) {
        uuid
        items {
            uuid
            type
            giftMainProductUuid
            quantity
            product {
                uuid
            }
        }
        removedGifts {
            mainProductUuid
            quantity
            product {
                uuid
            }
        }
        modifications {
            itemModifications {
                noLongerListableCartItems{
                    uuid
                }
            }
        }
    }
}
