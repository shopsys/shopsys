mutation RestoreCartGift($cartUuid: Uuid, $giftProductUuid: Uuid!, $mainProductUuid: Uuid!) {
    RestoreCartGift(input: {cartUuid: $cartUuid, giftProductUuid: $giftProductUuid, mainProductUuid: $mainProductUuid}) {
        uuid
        items {
            uuid
            type
            relatedItems { uuid }
            quantity
            product { uuid }
        }
        removedProductGifts {
            mainProduct { uuid }
            giftProduct { uuid }
        }
    }
}
