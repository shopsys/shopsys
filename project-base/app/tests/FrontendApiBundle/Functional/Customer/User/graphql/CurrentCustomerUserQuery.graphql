query CurrentCustomerUserQuery {
    currentCustomerUser {
        __typename
        firstName
        lastName
        email
        telephone
        telephoneData {
            countryCode
            prefix
            number
        }
        newsletterSubscription
        street
        city
        postcode
        country {
            code
        }
        pricingGroup
        defaultDeliveryAddress {
            uuid
            companyName
            street
            city
            postcode
            telephone
            telephoneData {
                countryCode
                prefix
                number
            }
            country {
                code
            }
            firstName
            lastName
        }
        deliveryAddresses {
            uuid
            companyName
            street
            city
            postcode
            telephone
            telephoneData {
                countryCode
                prefix
                number
            }
            country {
                code
            }
            firstName
            lastName
        }
        ... on CurrentCompanyCustomerUser {
            companyName
            companyNumber
            companyTaxNumber
        }
        loginInfo {
            externalId
            loginType
        }
        salesRepresentative {
            firstName
            lastName
            email
            telephone
            telephoneData {
                countryCode
                prefix
                number
            }
        }
    }
}
