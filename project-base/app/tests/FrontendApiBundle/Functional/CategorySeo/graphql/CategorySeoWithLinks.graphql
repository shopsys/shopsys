query CategorySeoWithLinks($urlSlug: String!) {
    category(urlSlug: $urlSlug){
        name
        slug
        seo {
            title
            metaDescription
            h1
            metaRobots
            canonicalUrl
        }
        bestsellers {
            name
        }
        breadcrumb {
            name
            slug
        }
        readyCategorySeoMixLinks {
            name
            slug
        }
    }
}
