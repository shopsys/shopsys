mutation AddNewCustomerUserMutation(
    $firstName: String! = "",
    $lastName: String! = "",
    $email: String! = "",
    $roleGroupUuid: Uuid! = "00000000-0000-0000-0000-000000000000",
    $telephone: PhoneDataInput! = {
        countryCode: "CZ",
        prefix: "+420",
        number: "123456789"
    }
) {
    AddNewCustomerUser(input: {
        firstName: $firstName,
        lastName: $lastName,
        email: $email,
        roleGroupUuid: $roleGroupUuid,
        telephone: $telephone
        newsletterSubscription: false
    }) {
        billingAddressUuid
        firstName
        lastName
        email
        roleGroup {
            uuid
        }
        telephone
        telephoneData {
            countryCode
            prefix
            number
        }
    }
}
