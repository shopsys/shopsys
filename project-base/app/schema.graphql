  ContactForm(input: ContactFormInput!): Boolean!

  "Send the inquiry for the product"
  CreateInquiry(input: CreateInquiryInput!): Boolean!

  "Send a product question to the customer and the shop operator"
  ProductQuestion(input: ProductQuestionInput!): Boolean!

  "Add new customer user to customer"
  AddNewCustomerUser(input: AddNewCustomerUserDataInput!): BaseCustomerUser!

  "edit customer user to customer"
  EditCustomerUserPersonalData(input: EditCustomerUserPersonalDataInput!): BaseCustomerUser!

  "delete customer user"
  RemoveCustomerUser(input: RemoveCustomerUserDataInput!): Boolean!

  "Create a new complaint"
  CreateComplaint(input: ComplaintInput!): Complaint!

  "Create a new product review that will be published after moderation"
  CreateProductReview(input: ProductReviewInput!): ProductReview!

  "Create a new watchdog or update validity of the current one"
  CreateWatchdog(input: CreateWatchdogInput!): Boolean!

  "Request withdrawal from contract for an order"
  OrderWithdrawalRequest(input: OrderWithdrawalRequestInput!): Boolean!

  "Request password recovery - email with hash will be sent"
  RequestPasswordRecovery(email: String!): String!

  "Recover password using hash required from RequestPasswordRecovery"
  RecoverPassword(input: RecoverPasswordInput!): LoginResult!

  "Request access to personal data"
  RequestPersonalDataAccess(input: PersonalDataAccessRequestInput!): PersonalDataPage!

