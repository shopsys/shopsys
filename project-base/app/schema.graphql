  "Url to download the file"
  url: String!

  "Url to view the file in browser (available for images and PDF files)"
  viewUrl: String

  "File size in bytes"
  filesize: Int

  "File extension"
  extension: String
}

"One of possible product types"
enum ProductTypeEnum {
