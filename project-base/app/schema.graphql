type Query {
  "Returns list of searched brands"
  brandSearch(searchInput: SearchInput!): [Brand!]!

  "Returns complete list of categories"
  categories: [Category!]!

  "Returns list of searched categories that can be paginated using `first`, `last`, `before` and `after` keywords"
  categoriesSearch(after: String, first: Int, before: String, last: Int, searchInput: SearchInput!): CategoryConnection!

  "Returns list of ordered products that can be paginated using `first`, `last`, `before` and `after` keywords"
  products(after: String, first: Int, before: String, last: Int, orderingMode: ProductOrderingModeEnum, filter: ProductFilter, categorySlug: String, brandSlug: String, flagSlug: String): ProductConnection!

  "Returns product filtered using UUID or URL slug"
  product(uuid: Uuid, urlSlug: String): Product

  "Returns approved reviews of the product and its visible variants that can be paginated using `first`, `last`, `before` and `after` keywords"
  productReviews(after: String, first: Int, before: String, last: Int, productUuid: Uuid!, orderingMode: ProductReviewOrderingModeEnum = null): ProductReviewConnection!

  "Returns reviews written by the current customer user, regardless of their moderation status, newest first. When a product UUID is provided, only the reviews of the product and its variants are returned. The list can be paginated using `first`, `last`, `before` and `after` keywords"
  currentCustomerUserProductReviews(after: String, first: Int, before: String, last: Int, productUuid: Uuid): CustomerUserProductReviewConnection!

  "Returns list of searched products that can be paginated using `first`, `last`, `before` and `after` keywords"
  productsSearch(after: String, first: Int, before: String, last: Int, orderingMode: ProductOrderingModeEnum, filter: ProductFilter, search: String, searchInput: SearchInput!): ProductConnection!

  RegularProduct: RegularProduct
  MainVariant: MainVariant
  Variant: Variant

  "Returns category filtered using UUID or URL slug"
  category(uuid: Uuid, urlSlug: String, orderingMode: ProductOrderingModeEnum, filter: ProductFilter): Category

  "Returns complete list of payment methods"
  payments: [Payment!]!

  "Returns payment filtered using UUID"
  payment(uuid: Uuid!): Payment

  "Returns available transport methods based on the current cart state"
  transports(cartUuid: Uuid): [Transport!]!

  "Returns the delivery options usable for a single piece of the given product, independently of any cart"
  productDeliveryOptions(productUuid: Uuid!): [ProductDeliveryOption!]!

  "Returns the stores where a single piece of the given product can be picked up using the given personal pickup transport, together with the expected pickup dates, independently of any cart"
  productDeliveryStores(
    after: String
    first: Int
    before: String
    last: Int
    productUuid: Uuid!
    transportUuid: Uuid!

    "Search for city or post code"
    searchText: String = null

    "Returns stores with distance from given coordinates"
    coordinates: Coordinates = null
  ): ProductDeliveryStoreConnection!

  "Returns complete list of transport methods"
  transport(uuid: Uuid!): Transport

  CompanyCustomerUser: CompanyCustomerUser
  RegularCustomerUser: RegularCustomerUser
  CurrentCompanyCustomerUser: CurrentCompanyCustomerUser
  CurrentRegularCustomerUser: CurrentRegularCustomerUser

  "Returns currently logged in customer user"
  currentCustomerUser: CurrentCustomerUser

  "Returns list of orders that can be paginated using `first`, `last`, `before` and `after` keywords"
  orders(after: String, first: Int, before: String, last: Int, filter: OrderFilterInput): OrderConnection

  "Returns list of order items that can be paginated using `first`, `last`, `before` and `after` keywords. Order items from orders that have a withdrawal request are always excluded"
  orderItems(after: String, first: Int, before: String, last: Int, filter: OrderItemsFilterInput): OrderItemConnection!

  "Returns list of searched order items that can be paginated using `first`, `last`, `before` and `after` keywords. Order items from orders that have a withdrawal request are always excluded"
  orderItemsSearch(after: String, first: Int, before: String, last: Int, searchInput: SearchInput!, filter: OrderItemsFilterInput): OrderItemConnection!

  "Returns order filtered using UUID, orderNumber, or urlHash"
  order(uuid: Uuid, urlHash: String, orderNumber: String): Order

  "Returns order URL hash resolved from a short-lived payment return hash"
  orderUrlHashByReturnHash(returnHash: String!): String

  "Returns list of articles that can be paginated using `first`, `last`, `before` and `after` keywords and filtered by `placement`"
  articles(
    after: String
    first: Int
    before: String
    last: Int

    "An array of the required articles placements"
    placement: [ArticlePlacementTypeEnum!] = []
  ): ArticleConnection!

  "Returns list of searched articles and blog articles"
  articlesSearch(searchInput: SearchInput!): [ArticleInterface!]!

  "Returns article filtered using UUID or URL slug"
  article(uuid: Uuid, urlSlug: String): NotBlogArticleInterface

  ArticleSite: ArticleSite
  ArticleLink: ArticleLink

  "Returns complete list of brands"
  brands: [Brand!]!

  "Returns brand filtered using UUID or URL slug"
  brand(uuid: Uuid, urlSlug: String): Brand

  "Returns promoted products"
  promotedProducts: [Product!]!

  "Returns list of adverts, optionally filtered by `positionNames`"
  adverts(positionNames: [String!], categoryUuid: Uuid): [Advert!]!

  AdvertCode: AdvertCode
  AdvertImage: AdvertImage

  "Returns list of advert positions."
  advertPositions: [AdvertPosition!]!

  "Returns current settings"
  settings: Settings

  "Find product list by UUID and type or if customer is logged, try find the the oldest list of the given type for the logged customer. The logged customer can also optionally pass the UUID of his product list."
  productList(input: ProductListInput!): ProductList

  productListsByType(productListType: ProductListTypeEnum!): [ProductList!]!

  "Returns blog article filtered using UUID or URL slug"
  blogArticle(uuid: Uuid, urlSlug: String): BlogArticle

  "Returns a list of the blog articles that can be paginated using `first`, `last`, `before` and `after` keywords"
  blogArticles(after: String, first: Int, before: String, last: Int, onlyHomepageArticles: Boolean = false): BlogArticleConnection!

  "Returns blog category filtered using UUID or URL slug"
  blogCategory(uuid: Uuid, urlSlug: String): BlogCategory

  "Returns a complete list of the blog categories"
  blogCategories: [BlogCategory!]!

  "Returns list of products by catalog numbers"
  productsByCatnums(
    "Array of product catalog numbers"
    catnums: [String!]!
  ): [Product!]!

  "Returns payments available for the given order"
  orderPayments(
    orderUuid: Uuid!

    "Order urlHash as a proof of access to the order for anonymous customers"
    orderUrlHash: String
  ): OrderPaymentsConfig!

  "List of available banks for GoPay bank transfer payment"
  GoPaySwifts(currencyCode: String!): [GoPayBankSwift!]!

  "Return cart of logged customer or cart by UUID for anonymous user"
  cart(cartInput: CartInput): Cart

  "Returns complete navigation menu"
  navigation: [NavigationItem!]!

  "Returns available countries"
  countries: [Country!]!

  "Returns all customer users assigned to the current customer"
  customerUsers: [BaseCustomerUser!]!

  "Returns all customer user role groups"
  customerUserRoleGroups: [CustomerUserRoleGroup!]!

  "Returns complaint filtered using UUID"
  complaint(
    "Complaint number"
    number: String!
  ): Complaint!

  "Returns list of complaints that can be paginated using `first`, `last`, `before` and `after` keywords"
  complaints(after: String, first: Int, before: String, last: Int, filter: ComplaintFilterInput): ComplaintConnection!

  "Returns complaint counts grouped by status"
  complaintStatusCounts(filter: ComplaintFilterInput): [ComplaintStatusCount!]!

  "Returns order counts grouped by status"
  orderStatusCounts(filter: OrderFilterInput): [OrderStatusCount!]!

  "Returns a complete list of the flags"
  flags: [Flag!]

  "Returns a flag by uuid or url slug"
  flag(uuid: Uuid, urlSlug: String): Flag

  "Check if email is registered"
  isCustomerUserRegistered(email: String!): Boolean!

  "Check if customer can be registered with provided data"
  couldBeCustomerRegisteredQuery(email: String!, companyNumber: String = null): Boolean!

  "Returns list of stores that can be paginated using `first`, `last`, `before` and `after` keywords"
  stores(
    after: String
    first: Int
    before: String
    last: Int

    "Search for city or post code"
    searchText: String = null

    "Returns stores with distance from given coordinates"
    coordinates: Coordinates = null
  ): StoreConnection!

  "Returns store filtered using UUID or URL slug"
  store(uuid: Uuid, urlSlug: String): Store

  "Returns a list of notifications supposed to be displayed on all pages"
  notificationBars: [NotificationBar!]

  "Returns complaint resolutions variants"
  complaintResolution: [ComplaintResolution!]!

  "Returns last order of the user or null if no order was placed yet"
  lastOrder: Order

  "Return personal data page content and URL"
  personalDataPage: PersonalDataPage

  "Access personal data using hash received in email from personal data access request"
  accessPersonalData(
    "Hash to securely recognize access"
    hash: String!
  ): PersonalData!

  "Returns autocomplete favorites (products, categories, brands) configured for current domain"
  autocompleteFavorites: AutocompleteFavorites!

  "Returns promoted categories"
  promotedCategories: [Category!]!

  "Returns a complete list of the slider items"
  sliderItems: [SliderItem!]!

  ParameterSliderFilterOption: ParameterSliderFilterOption
  ParameterCheckboxFilterOption: ParameterCheckboxFilterOption
  ParameterColorFilterOption: ParameterColorFilterOption

  "Returns SEO settings for a specific page based on the url slug of that page"
  seoPage(pageSlug: String!): SeoPage

  "Return recommended products from Luigi's Box by provided arguments"
  recommendedProducts(
    userIdentifier: Uuid!
    recommendationType: RecommendationType!
    limit: Int = 10

    "For type 'category' provide one category UUID, for other types provide product UUIDs"
    itemUuids: [Uuid!]

    "Arbitrary identifier for analytics purposes. See https://docs.luigisbox.com/recommendations/concepts.html#basic-concepts-placement-and-model-reuse"
    recommenderClientIdentifier: String
  ): [Product!]!
}

"Represents search input object"
input SearchInput {
  search: String!

  "Unique identifier of the user who initiated the search in format UUID version 4 (^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[1-8][0-9A-Fa-f]{3}-[ABab89][0-9A-Fa-f]{3}-[0-9A-Fa-f]{12}$/)"
  userIdentifier: Uuid!
  isAutocomplete: Boolean! = false

  "Ordered list of parameters used in Luigi's Box to ensure same order of parameters in search results"
  parameters: [Uuid!] = []
}

"Represents and encapsulates an ISO-8601 encoded UTC date-time value"
scalar Uuid

"Represents a brand"
type Brand implements Hreflang & Breadcrumb & Slug & ProductListable {
  "UUID"
  uuid: Uuid!

  "Brand name"
  name: String!

  "Brand description"
  description: String

  "Brand main URL"
  link: String!

  "Brand SEO title"
  seoTitle: String

  "Brand SEO meta description"
  seoMetaDescription: String

  "Brand SEO H1"
  seoH1: String

  "Brand images"
  images(type: String = null): [Image!]!

  "Paginated and ordered products of brand"
  products(after: String, first: Int, before: String, last: Int, orderingMode: ProductOrderingModeEnum, filter: ProductFilter, categorySlug: String, brandSlug: String, flagSlug: String): ProductConnection!

  "Alternate links for hreflang meta tags"
  hreflangLinks: [HreflangLink!]!

  "Hierarchy of the current element in relation to the structure"
  breadcrumb: [Link!]!

  "Brand URL slug"
  slug: String!

  "ID of category"
  id: Int!

  "Brand image by params"
  mainImage(type: String = null): Image
}

"Represents entity able to return alternate links for hreflang meta tags"
interface Hreflang {
  "Alternate links for hreflang meta tags"
  hreflangLinks: [HreflangLink!]!
}

type HreflangLink {
  "Language code for hreflang meta tag"
  hreflang: String!

  "URL for hreflang meta tag"
  href: String!
}

"Represents entity able to return breadcrumb"
interface Breadcrumb {
  "Hierarchy of the current element in relation to the structure"
  breadcrumb: [Link!]!
}

"Represents an internal link"
type Link {
  "Clickable text for a hyperlink"
  name: String!

  "Target URL slug"
  slug: String!
}

"Represents entity retrievable by slug"
interface Slug {
  "UUID"
  uuid: Uuid!

  name: String
  slug: String!
}

"Paginated and ordered products"
interface ProductListable {
  "Paginated and ordered products"
  products(after: String, first: Int, before: String, last: Int, orderingMode: ProductOrderingModeEnum, filter: ProductFilter, categorySlug: String, brandSlug: String, flagSlug: String): ProductConnection!
}

"One of possible ordering modes for product"
enum ProductOrderingModeEnum {
  "Order by priority"
  PRIORITY

  "Order by price ascending"
  PRICE_ASC

  "Order by price descending"
  PRICE_DESC

  "Order by name ascending"
  NAME_ASC

  "Order by name descending"
  NAME_DESC

  "Order by relevance"
  RELEVANCE
}

"Represents a product filter"
input ProductFilter {
  "Minimal price filter"
  minimalPrice: Money

  "Maximal price filter"
  maximalPrice: Money

  "Array of uuids of brands filter"
  brands: [Uuid!]

  "Array of uuids of flags filter"
  flags: [Uuid!]

  "Only in stock filter"
  onlyInStock: Boolean

  "Parameter filter"
  parameters: [ParameterFilter!]
}

scalar Money

"Represents a parameter filter"
input ParameterFilter {
  "Uuid of filtered parameter"
  parameter: Uuid!

  "Array of uuids representing parameter values to be filtered by"
  values: [Uuid!]! = []

  "The parameter minimal value (for parameters with \"slider\" type)"
  minimalValue: Float = null

  "The parameter maximal value (for parameters with \"slider\" type)"
  maximalValue: Float = null
}

"A connection to a list of items."
type ProductConnection {
  "Total number of products (-1 means that the total count is not available)"
  totalCount: Int!

  productFilterOptions: ProductFilterOptions!

  "The current ordering mode"
  orderingMode: ProductOrderingModeEnum!

  "The default ordering mode that is set for the given connection (e.g. in a category, search page, or ready category SEO mix)"
  defaultOrderingMode: ProductOrderingModeEnum

  "Information to aid in pagination."
  pageInfo: PageInfo!

  "Information to aid in pagination."
  edges: [ProductEdge]
}

"Represents a product filter options"
type ProductFilterOptions {
  "Minimal price of products for filtering"
  minimalPrice: Money!

  "Maximal price of products for filtering"
  maximalPrice: Money!

  "Brands filter options"
  brands: [BrandFilterOption!]

  "Flags filter options"
  flags: [FlagFilterOption!]

  "Number of products in stock that will be filtered"
  inStock: Int!

  "Parameter filter options"
  parameters: [ParameterFilterOptionInterface!]
}

"Brand filter option"
type BrandFilterOption {
  "Brand"
  brand: Brand!

  "Count of products that will be filtered if this filter option is applied."
  count: Int!

  "If true than count parameter is number of products that will be displayed if this filter option is applied, if false count parameter is number of products that will be added to current products result."
  isAbsolute: Boolean!
}

"Flag filter option"
type FlagFilterOption {
  "Flag"
  flag: Flag!

  "Count of products that will be filtered if this filter option is applied."
  count: Int!

  "If true than count parameter is number of products that will be displayed if this filter option is applied, if false count parameter is number of products that will be added to current products result."
  isAbsolute: Boolean!

  "Indicator whether the option is already selected (used for \"ready category seo mixes\")"
  isSelected: Boolean!
}

"Represents a flag"
type Flag implements Hreflang & Slug & Breadcrumb & ProductListable {
