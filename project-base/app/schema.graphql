"Represents an image"
type Image {
  "Name of the image usable as an alternative text"
  name: String

  "URL address of the image"
  url: String!
}

"Represents a product"
interface Product {
  "UUID"
  uuid: Uuid!

  "Localized product name (domain dependent)"
  name: String!

  "Name prefix"
  namePrefix: String

  "Name suffix"
  nameSuffix: String

  "The full name of the product, which consists of a prefix, name, and a suffix"
  fullName: String!

  "Localized product short description (domain dependent)"
  shortDescription: String

  "List of product's unique selling propositions"
  usps: [String!]!

  "Product link"
  link: String!

  unit: Unit!
  availability: Availability!

  "Count of quantity on stock"
  stockQuantity: Int

  "Whether the product allows purchasing more items than are currently in stock"
  isAllowedNegativeStock: Boolean!

  "Expected restocking date, filled whenever set and not passed yet"
  expectedRestockingDate: DateTime

  "List of categories"
  categories: [Category!]!

  "List of flags"
  flags: [Flag!]!

  "Aggregated rating of the approved reviews of the product and its visible variants. Null for a variant — the reviews of the whole family are aggregated on its main variant"
  reviewsSummary: ProductReviewsSummary

  "Product price"
  price: ProductPrice!

  "Gift price for the product when is as gift"
  giftPrice: ProductPrice!

  "Product images"
  images(type: String = null): [Image!]!

  "Number of product images"
  imagesCount(type: String = null): Int!

  "Brand of product"
  brand: Brand

  isSellingDenied: Boolean!

  "Whether a cart containing this product is limited to personal pickup transports"
  isPersonalPickupOnly: Boolean!

  "Whether the product is currently out of stock (but may be back in stock later), but selling is not permanently denied"
  isCurrentlyOutOfStock: Boolean!

  orderingPriority: Int!
  description: String
  accessories: [Product!]!

  "List of related products"
  relatedProducts: [Product!]!

  parameters: [Parameter!]!

  "Seo first level heading of product"
  seoH1: String

  "Seo title of product"
  seoTitle: String

  "Seo meta description of product"
  seoMetaDescription: String

  "Alternate links for hreflang meta tags"
  hreflangLinks: [HreflangLink!]!

  files: [File!]!
  isVisible: Boolean!
  isInquiryType: Boolean!
  productType: ProductTypeEnum!

  "Number of the stores where the product is available (null for main variants)"
  availableStoresCount: Int

  productVideos: [VideoToken!]!
  vatPercent: String!

  "List of gift products"
  gifts: [Product!]!

  "Quantity required to qualify for the buy X + Y free promotion (null when not set)"
  promotionBuyQuantity: Int

  "Quantity given for free in the buy X + Y free promotion (null when not set)"
  promotionFreeQuantity: Int

  "Zbozi.cz category text assigned to the product main category"
  zboziCategory: String

  "Product URL slug"
  slug: String!

  "Product id"
  id: Int!

  "Product catalog number"
  catalogNumber: String!

  "Product part number"
  partNumber: String

  "EAN"
  ean: String

  "Hierarchy of the current element in relation to the structure"
  breadcrumb: [Link!]!

  "Product image by params"
  mainImage(type: String = null): Image

  isMainVariant: Boolean!
}

"Represents a unit"
type Unit {
  "Localized unit name (domain dependent)"
  name: String!
}

"Represents an availability"
type Availability {
  "Localized availability name (domain dependent)"
  name: String!

  "Availability status in a format suitable for usage in the code"
  status: AvailabilityStatusEnum!
}

"Product Availability statuses"
enum AvailabilityStatusEnum {
  "Product availability status in stock"
  InStock

  "Product availability status out of stock"
  OutOfStock

  "Product is out of stock with a known expected restocking date"
  ExpectedRestock

  "Product availability status for electronically delivered products"
  Digital
}

"Represents and encapsulates an ISO-8601 encoded UTC date-time value"
scalar DateTime

"Aggregated rating of the approved reviews of a product and its visible variants"
type ProductReviewsSummary {
  "Average rating, null when there are no reviews"
  averageRating: Float

  "Total number of reviews"
  totalCount: Int!

  "Number of reviews per star rating, from 5 stars to 1"
  ratingCounts: [ProductReviewRatingCount!]!
}

type ProductReviewRatingCount {
  "Star rating"
  rating: Int!

  "Number of reviews with the rating"
  count: Int!
}

"Represents the price of the product"
type ProductPrice {
  "Price with VAT"
  priceWithVat: Money!

  "Price without VAT"
  priceWithoutVat: Money!

  "Total value of VAT"
  vatAmount: Money!

  "Determines whether it's a final price or starting price"
  isPriceFrom: Boolean!

  "Date of the next price change, null if no price change is planned"
  nextPriceChange: DateTime

  "Percentage discount on the selling price compared to the base price, null if no discount is applied"
  percentageDiscount: Float

  "Basic price of the product. If product has no discounts, it's the same as the selling price"
  basicPrice: Price!
}

"Represents the price"
type Price {
  "Price with VAT"
  priceWithVat: Money!

  "Price without VAT"
  priceWithoutVat: Money!

  "Total value of VAT"
  vatAmount: Money!
}

"Represents a parameter"
type Parameter {
  "UUID"
  uuid: Uuid!

  "Parameter name"
  name: String!

  "Parameter type"
  type: ParameterTypeEnum!

  values: [ParameterValue!]!

  "Unit of the parameter"
  unit: Unit

  "Parameter group to which the parameter is assigned"
  group: String
}

"Represents the type of the parameter"
enum ParameterTypeEnum {
