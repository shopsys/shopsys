framework:
    rate_limiter:
        apply_code_to_cart:
            policy: sliding_window
            limit: 5
            interval: '1 minute'
            cache_pool: apply_code_to_cart_rate_limiter_cache
        frontend_api_product_review_create:
            policy: fixed_window
            limit: 20
            interval: '1 hour'
        frontend_api_stores_search:
            policy: fixed_window
            limit: 10
            interval: '1 minute'
        mcp_oauth_register:
            policy: fixed_window
            limit: 20
            interval: '1 minute'
            cache_pool: mcp_rate_limiter_cache
        mcp_oauth_token:
            policy: fixed_window
            limit: 60
            interval: '1 minute'
            cache_pool: mcp_rate_limiter_cache
        mcp_runtime:
            policy: fixed_window
            limit: 300
            interval: '1 minute'
            cache_pool: mcp_rate_limiter_cache

when@test:
    framework:
        rate_limiter:
            apply_code_to_cart:
                policy: no_limit
