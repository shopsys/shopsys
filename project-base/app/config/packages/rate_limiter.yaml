framework:
    rate_limiter:
        # one limiter shared by every form protected by FormSpamProtectionFacade, each form counts on its own key
        frontend_api_form_spam_protection:
            policy: fixed_window
            limit: 3
            interval: '5 minutes'
            cache_pool: form_spam_protection_rate_limiter_cache
        frontend_api_stores_search:
            policy: fixed_window
            limit: 10
            interval: '1 minute'
        mcp_oauth_register:
            policy: fixed_window
            limit: 20
            interval: '1 minute'
            cache_pool: mcp_rate_limiter_cache
        mcp_oauth_token:
            policy: fixed_window
            limit: 60
            interval: '1 minute'
            cache_pool: mcp_rate_limiter_cache
        mcp_runtime:
            policy: fixed_window
            limit: 300
            interval: '1 minute'
            cache_pool: mcp_rate_limiter_cache
