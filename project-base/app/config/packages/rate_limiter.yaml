framework:
    rate_limiter:
        frontend_api_product_review_create:
            policy: fixed_window
            limit: 20
            interval: '1 hour'
        frontend_api_stores_search:
            policy: fixed_window
            limit: 10
            interval: '1 minute'
        mcp_oauth_register:
            policy: fixed_window
            limit: 20
            interval: '1 minute'
            cache_pool: mcp_rate_limiter_cache
        mcp_oauth_token:
            policy: fixed_window
            limit: 60
            interval: '1 minute'
            cache_pool: mcp_rate_limiter_cache
        mcp_runtime:
            policy: fixed_window
            limit: 300
            interval: '1 minute'
            cache_pool: mcp_rate_limiter_cache
