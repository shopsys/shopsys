framework:
    rate_limiter:
        frontend_api_password_recovery_email:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
            cache_pool: frontend_api_password_recovery_rate_limiter_cache
        frontend_api_password_recovery_ip:
            policy: sliding_window
            limit: 40
            interval: '1 hour'
            cache_pool: frontend_api_password_recovery_rate_limiter_cache
        frontend_api_stores_search:
            policy: fixed_window
            limit: 10
            interval: '1 minute'
        mcp_oauth_register:
            policy: fixed_window
            limit: 20
            interval: '1 minute'
            cache_pool: mcp_rate_limiter_cache
        mcp_oauth_token:
            policy: fixed_window
            limit: 60
            interval: '1 minute'
            cache_pool: mcp_rate_limiter_cache
        mcp_runtime:
            policy: fixed_window
            limit: 300
            interval: '1 minute'
            cache_pool: mcp_rate_limiter_cache
