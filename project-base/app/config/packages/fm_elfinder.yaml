fm_elfinder:
    assets_path: false
    instances:
        default:
            editor: ckeditor
            relative_path: false
            connector:
                debug: true
                roots:
                    local:
                        driver: Flysystem
                        path: 'web/%shopsys.filemanager_upload_web_dir%'
                        flysystem:
                            enabled: true
                            filesystem: 'main_filesystem'
                        # intentionally below the 32M limits of upload_max_filesize (php-ini-overrides.ini) and client_max_body_size (nginx.conf, orchestration/kubernetes/configmap/nginx.yaml)
                        # so the whole multipart request fits within them and Elfinder rejects too large files with a clear message instead of a server error
                        upload_max_size: 30M
                        # disable chunked uploads entirely (chunks may land on different app replicas), multi-file uploads run serially
                        upload_max_conn: -1
                        upload_allow:
                            - 'image/png'
                            - 'image/jpg'
                            - 'image/jpeg'
                            - 'image/gif'
                            - 'image/webp'
                            - 'text/csv'
                            - 'text/plain'
                            - 'application/pdf'
                            - 'application/msword'
                            - 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
                            - 'application/vnd.ms-excel'
                            - 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
                            - 'application/vnd.ms-powerpoint'
                            - 'application/vnd.openxmlformats-officedocument.presentationml.presentation'
                            - 'application/zip'
                            - 'video/quicktime'
                        tmb_path: 'web/%shopsys.filemanager_upload_web_dir%/_thumbnails'
                        url: '%shopsys.filemanager_upload_web_dir%'
                        tmb_url: '%shopsys.filemanager_upload_web_dir%/_thumbnails'
                        attributes:
                            thumbnails:
                                pattern: '/^\/web\/content\/wysiwyg\/_thumbnails$/'
                                hidden: true
                        disabled_commands:
                            - 'archive'
                            - 'extract'
                            - 'edit'
                            - 'mkfile'
                            - 'netmount'
                            - 'zipdl'
        grapesJs:
            editor: custom
            editor_template: 'Admin/Inline/Elfinder/grapesjs-template.html.twig'
            relative_path: false
            connector:
                debug: true
                roots:
                    local:
                        driver: Flysystem
                        path: 'web/%shopsys.filemanager_upload_web_dir%'
                        flysystem:
                            enabled: true
                            filesystem: 'main_filesystem'
                        # intentionally below the 32M limits of upload_max_filesize (php-ini-overrides.ini) and client_max_body_size (nginx.conf, orchestration/kubernetes/configmap/nginx.yaml)
                        # so the whole multipart request fits within them and Elfinder rejects too large files with a clear message instead of a server error
                        upload_max_size: 30M
                        # disable chunked uploads entirely (chunks may land on different app replicas), multi-file uploads run serially
                        upload_max_conn: -1
                        upload_allow:
                            - 'image/png'
                            - 'image/jpg'
                            - 'image/jpeg'
                            - 'image/gif'
                            - 'image/webp'
                            - 'text/csv'
                            - 'text/plain'
                            - 'application/pdf'
                            - 'application/msword'
                            - 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
                            - 'application/vnd.ms-excel'
                            - 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
                            - 'application/vnd.ms-powerpoint'
                            - 'application/vnd.openxmlformats-officedocument.presentationml.presentation'
                            - 'application/zip'
                            - 'video/quicktime'
                        tmb_path: 'web/%shopsys.filemanager_upload_web_dir%/_thumbnails'
                        url: '%shopsys.filemanager_upload_web_dir%'
                        tmb_url: '/%shopsys.filemanager_upload_web_dir%/_thumbnails'
                        attributes:
                            thumbnails:
                                pattern: '/^\/web\/content\/wysiwyg\/_thumbnails$/'
                                hidden: true
                        disabled_commands:
                            - 'archive'
                            - 'extract'
                            - 'edit'
                            - 'mkfile'
                            - 'netmount'
                            - 'zipdl'
