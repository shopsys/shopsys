framework:
    cache:
        pools:
            main_friendly_url_slug_cache:
                adapter: cache.adapter.redis
                provider: snc_redis.main_friendly_url_slugs
            bestselling_product_cache:
                adapter: cache.adapter.redis
                provider: snc_redis.bestselling_products
                default_lifetime: 43200
            store_search_coordinates_cache:
                adapter: cache.adapter.redis
                provider: snc_redis.store_search_coordinates
                default_lifetime: 604800
            doctrine.metadata_cache_pool:
                adapter: cache.adapter.filesystem
            doctrine.query_cache_pool:
                adapter: cache.adapter.redis
                provider: snc_redis.doctrine_query
            image_cache:
                adapter: cache.adapter.redis
                provider: snc_redis.image
                default_lifetime: 43200
            mcp_oauth_cache:
                adapter: cache.adapter.redis
                provider: snc_redis.mcp_oauth
            mcp_http_session_cache:
                adapter: cache.adapter.redis
                provider: snc_redis.mcp_http_session
            mcp_rate_limiter_cache:
                adapter: cache.adapter.redis
                provider: snc_redis.mcp_rate_limiter
            frontend_api_password_recovery_rate_limiter_cache:
                adapter: cache.adapter.redis
                provider: snc_redis.frontend_api_password_recovery_rate_limiter
