framework:
    cache:
        pools:
            main_friendly_url_slug_cache:
                adapter: cache.adapter.redis
                provider: snc_redis.main_friendly_url_slugs
            bestselling_product_cache:
                adapter: cache.adapter.redis
                provider: snc_redis.bestselling_products
                default_lifetime: 43200
            store_search_coordinates_cache:
                adapter: cache.adapter.redis
                provider: snc_redis.store_search_coordinates
                default_lifetime: 604800
            # Doctrine metadata and parsed queries are static for a build, so they are kept in local PHP files
            # (served from OPcache memory) instead of being unserialized from disk or fetched from Redis on every request
            doctrine.metadata_cache_pool:
                adapter: cache.adapter.system
            doctrine.query_cache_pool:
                adapter: cache.adapter.system
            image_cache:
                adapter: cache.adapter.redis
                provider: snc_redis.image
                default_lifetime: 43200
            mcp_oauth_cache:
                adapter: cache.adapter.redis
                provider: snc_redis.mcp_oauth
            mcp_http_session_cache:
                adapter: cache.adapter.redis
                provider: snc_redis.mcp_http_session
            mcp_rate_limiter_cache:
                adapter: cache.adapter.redis
                provider: snc_redis.mcp_rate_limiter
            apply_code_to_cart_rate_limiter_cache:
                adapter: cache.adapter.redis
                provider: snc_redis.apply_code_to_cart_rate_limiter
            frontend_api_password_recovery_rate_limiter_cache:
                adapter: cache.adapter.redis
                provider: snc_redis.frontend_api_password_recovery_rate_limiter
            frontend_api_customer_registration_rate_limiter_cache:
                adapter: cache.adapter.redis
                provider: snc_redis.frontend_api_customer_registration_rate_limiter
            form_spam_protection_rate_limiter_cache:
                adapter: cache.adapter.redis
                provider: snc_redis.form_spam_protection_rate_limiter
            frontend_api_order_withdrawal_request_rate_limiter_cache:
                adapter: cache.adapter.redis
                provider: snc_redis.frontend_api_order_withdrawal_request_rate_limiter
