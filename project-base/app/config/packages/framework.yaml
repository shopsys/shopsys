framework:
    annotations: false
    assets:
        base_urls:
            - '%env(CDN_DOMAIN)%'
    csrf_protection: ~
    fragments: ~ # We rely on the default path configuration ("/_fragment"). If this is changed, it must be reflected in Shopsys\FrameworkBundle\Component\Router\FriendlyUrl\FriendlyUrlMatcher::IGNORED_INTERNAL_ROUTE constant.
    http_method_override: true
    ide: '%env(SYMFONY_IDE_URL_FORMAT)%&/var/www/html/>%env(LOCAL_PATH_TO_PROJECT_ROOT)%/'
    profiler:
        collect: false
        enabled: false
    property_info:
        with_constructor_extractor: true
    router:
        strict_requirements: true
        utf8: true
    secret: "%env(APP_SECRET)%"
    session:
        cookie_httponly: true
        cookie_lifetime: 31536000 # 365 days * 24 hours * 3600 seconds
        # Disable the default PHP session garbage collection.
        # Session garbage collection is responsibility of hosting.
        gc_probability: 0
        handler_id: Symfony\Component\HttpFoundation\Session\Storage\Handler\RedisSessionHandler
        storage_factory_id: session.storage.factory.native
    trusted_hosts: ~
    trusted_proxies: '%env(TRUSTED_PROXIES)%)'
    validation:
        enable_attributes: true
