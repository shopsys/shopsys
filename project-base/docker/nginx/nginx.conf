gzip on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_proxied any;
gzip_vary on;
gzip_types  text/plain
            text/css
            text/javascript
            application/javascript
            application/json
            application/xml
            application/rss+xml
            image/svg+xml;

upstream php-upstream {
    server php-fpm:9000;
}

upstream storefront-upstream {
    server storefront:3000;
}

server {
    listen 8081;

    location ~ ^/(content(-test)?|build|public|bundles)/ {
        proxy_set_header Host '127.0.0.1:8000';
        proxy_pass http://127.0.0.1:8080$request_uri;
    }
}

server {
    listen 8080;
    root ${WEBSERVER_ROOT};
    server_tokens off;
    client_max_body_size 32M;

    set $request_host $http_host;
    if ($http_originalhost) {
        set $request_host $http_originalhost;
    }

    server_name shopsys;

    fastcgi_read_timeout 300;
    proxy_read_timeout 300;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Credentials "false" always;
    add_header X-Powered-By "Shopsys Platform" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Permissions-Policy "camera=(), geolocation=(self), microphone=(), payment=(), usb=()" always;

    # define code to be used to redirect to the proper upstream
    error_page 470 = @app;
    error_page 469 = @storefront;
    error_page 468 = @imageResizer;

    location = /resolve-friendly-url {
        fastcgi_pass php-upstream;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/resolveFriendlyUrl.php;
    }

    # (?:/|$) in regexes is used to match /path, /path/, /path/subpath but not /pathology

    # location always using the app backend, no static files
    location ~ ^/(?:[^/]+/)?(graphql|_profiler|_wdt|_error)(?:/|$) {
        return 470; # send to @app
    }

    # location for administration interface, uses admin error pages
    location ~ ^/(?:[^/]+/)?(${ADMIN_URL}|ckeditor|elfinder(\.main\.js)?|efconnect|build|bundles)(?:/|$) {
        # hide dotfiles (send to @app)
        location ~ /\. {
            return 470; # send to @app
        }

        try_files $uri @app;
    }

    # location for images, strip image name and serve image by its ID (send to imageResizer if there are width/height args)
    location ~ ^/(?:[^/]+/)?(content(?:-test)?/images/.+)/(?<image_name>([\w\-]+_)?(?<image_id>\d+))\.(?<image_extension>jpe?g|png|gif) {
        expires 1y;

        if ($is_args != '') {
            return 468; # send to @imageResizer
        }

        # serve image by its ID, render storefront 404 page if image does not exist
        try_files /$1/$image_id.$image_extension @storefront;
    }

    # location for static files, try to serve the file directly, render storefront 404 page if file does not exist
    location ~ ^/(?:[^/]+/)?(public|content(-test)?)/ {
        location ~ /\. {
            # hide dotfiles (send to @storefront)
            return 469;
        }

        try_files $uri @storefront;
    }

    # location for backend routes used by customers
    # they have to force storefront 404 page if not found
    # throw NotFoundRedirectToStorefrontException to trigger this behavior
    location ~ ^/(?:[^/]+/)?(file|customer-file/(view|download)|order/payment-status-notify|personal-overview-export/xml|social-network/login)(?:/|$) {
        location ~ /\. {
            # hide dotfiles (send to @storefront)
            return 469;
        }

        try_files $uri @app;
    }

        location ^~ /_next/static/ {
            add_header Access-Control-Allow-Origin "*" always;
            add_header X-Powered-By "Shopsys Platform" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "0" always;
            add_header Permissions-Policy "camera=(), geolocation=(self), microphone=(), payment=(), usb=()" always;

            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_pass http://storefront-upstream;
        }

    location ~ / {
        return 469; # send to @storefront
    }

    location @storefront {
        internal;
        # CORS is intentionally not exposed on storefront HTML responses
        add_header X-Powered-By "Shopsys Platform" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Permissions-Policy "camera=(), geolocation=(self), microphone=(), payment=(), usb=()" always;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header X-Powered-By;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_pass http://storefront-upstream;
    }

    location @app {
        internal;
        # CORS is intentionally not exposed on PHP responses (admin, GraphQL)
        fastcgi_hide_header Access-Control-Allow-Origin;
        fastcgi_hide_header Access-Control-Allow-Credentials;
        add_header X-Powered-By "Shopsys Platform" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;

        fastcgi_pass php-upstream;
        include fastcgi_params;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param HTTPS $http_x_forwarded_proto;
        fastcgi_param HTTP_HOST $request_host;
    }

    location @imageResizer {
        internal;
        # CORS is intentionally not exposed on dynamic image responses
        add_header X-Powered-By "Shopsys Platform" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
        fastcgi_hide_header Access-Control-Allow-Origin;
        fastcgi_hide_header Access-Control-Allow-Credentials;
        fastcgi_pass php-upstream;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/imageResizer.php;
        fastcgi_param HTTPS $http_x_forwarded_proto;
        fastcgi_param HTTP_HOST $request_host;
        fastcgi_param REQUEST_SCHEME $http_x_forwarded_proto;
    }
}
