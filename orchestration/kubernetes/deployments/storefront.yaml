apiVersion: apps/v1
kind: Deployment
metadata:
    name: storefront
    labels:
        app: storefront
spec:
    progressDeadlineSeconds: 1500
    replicas: 1
    strategy:
        rollingUpdate:
            maxSurge: 1
            maxUnavailable: 0
        type: RollingUpdate
    selector:
        matchLabels:
            app: storefront
    template:
        metadata:
            labels:
                app: storefront
        spec:
            containers:
                -   image: "{{STOREFRONT_TAG}}"
                    name: storefront
                    imagePullPolicy: Always
                    workingDir: /app
                    resources:
                        limits:
                            cpu: "3"
                        requests:
                            cpu: "0.5"
            imagePullSecrets:
                -   name: dockerregistry
