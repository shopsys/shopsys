extra:
    current_version: 19.0

extra_css:
    - _theme/main.css

extra_javascript:
    - _theme/copy-code.js

hooks:
    - docs/_hooks/replace_links.py

markdown_extensions:
    -   toc:
            permalink: True
            toc_depth: 2-4
    - admonition
    - def_list

plugins:
    -   awesome-pages:
            filename: navigation.yml
    - search

site_name: Shopsys Platform Docs

theme:
    custom_dir: "docs/_theme"
    hljs_languages:
        - dockerfile
        - less
        - twig
        - yaml
    hljs_style: vs2015
    name: readthedocs
