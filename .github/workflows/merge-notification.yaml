name: Slack Auto-Merge Notifications
on:
    pull_request:
        types:
            - auto_merge_enabled
            - auto_merge_disabled
            - closed
    workflow_run:
        workflows: ["Docker build"]
        types:
            - completed
permissions:
    contents: read
    pull-requests: write
    actions: read
jobs:
    notify-merge-start-finish:
        name: Send notification to the Slack about merge start / finish
        runs-on: ubuntu-latest
        if: github.event_name == 'pull_request'
        steps:
            -   name: Checkout repository
                uses: actions/checkout@v4
            -   name: Resolve author Slack mention
                id: author-mention
                uses: ./.github/actions/resolve-slack-mention
                with:
                    github-username: ${{ github.event.pull_request.user.login }}
                    slack-github-map: ${{ secrets.SLACK_GITHUB_MAP }}
            -   name: Resolve sender Slack mention
                id: sender-mention
                uses: ./.github/actions/resolve-slack-mention
                with:
                    github-username: ${{ github.event.sender.login }}
                    slack-github-map: ${{ secrets.SLACK_GITHUB_MAP }}
            -   name: Prepare PR variables
                id: variables
                env:
                    PR_URL: ${{ github.event.pull_request.html_url }}
                    PR_TITLE: ${{ github.event.pull_request.title }}
                run: |
                    echo "PR_URL=$PR_URL" >> $GITHUB_OUTPUT
                    ESCAPED_TITLE=$(printf '%s' "$PR_TITLE" | jq -Rs '.' | sed 's/^"//;s/"$//')
                    echo "PR_TITLE<<EOF" >> $GITHUB_OUTPUT
                    echo "$ESCAPED_TITLE" >> $GITHUB_OUTPUT
                    echo "EOF" >> $GITHUB_OUTPUT
            -   name: Merge started
                id: merge-started
                if: github.event.action == 'auto_merge_enabled'
                uses: slackapi/slack-github-action@v2.1.1
                with:
                    errors: true
                    method: chat.postMessage
                    token: ${{ secrets.SLACK_BOT_TOKEN }}
                    payload: |
                        channel: ${{ secrets.SLACK_CHANNEL_ID }}
                        text: "🔁 *Merge started for PR* <${{ steps.variables.outputs.PR_URL }}|${{ steps.variables.outputs.PR_TITLE }}> by ${{ steps.author-mention.outputs.mention }}."
            -   name: Store message timestamp in PR description
                if: github.event.action == 'auto_merge_enabled'
                env:
                    GH_TOKEN: ${{ github.token }}
                    PR_NUMBER: ${{ github.event.pull_request.number }}
                    SLACK_RESPONSE: ${{ steps.merge-started.outputs.response }}
                run: |
                    TIMESTAMP=$(echo "$SLACK_RESPONSE" | jq -r '.ts')
                    CURRENT_BODY=$(gh pr view "$PR_NUMBER" --json body --jq '.body')
                    CLEANED_BODY=$(echo "$CURRENT_BODY" | sed '/<!-- Replace -->/d' | sed '/<!-- SLACK_TIMESTAMP:/d')
                    gh pr edit "$PR_NUMBER" --body "${CLEANED_BODY}
                    <!-- SLACK_TIMESTAMP: ${TIMESTAMP} -->"
            -   name: Extract message timestamp
                id: extract-timestamp
                if: github.event.action == 'closed' || github.event.action == 'auto_merge_disabled'
                uses: ./.github/actions/extract-slack-timestamp
                with:
                    pr-body: ${{ github.event.pull_request.body }}
            -   name: Merge complete / canceled
                if: |
                    steps.extract-timestamp.outputs.timestamp != '' &&
                    ((github.event.action == 'closed' && github.event.pull_request.merged == true) ||
                    github.event.action == 'auto_merge_disabled')
                uses: slackapi/slack-github-action@v2.1.1
                with:
                    errors: true
                    method: reactions.add
                    token: ${{ secrets.SLACK_BOT_TOKEN }}
                    payload: |
                        channel: ${{ secrets.SLACK_CHANNEL_ID }}
                        name: "checkered_flag"
                        timestamp: ${{ steps.extract-timestamp.outputs.timestamp }}
            -   name: Merge canceled
                if: |
                    github.event.action == 'auto_merge_disabled' &&
                    steps.extract-timestamp.outputs.timestamp != ''
                uses: slackapi/slack-github-action@v2.1.1
                with:
                    errors: true
                    method: chat.postMessage
                    token: ${{ secrets.SLACK_BOT_TOKEN }}
                    payload: |
                        channel: ${{ secrets.SLACK_CHANNEL_ID }}
                        thread_ts: ${{ steps.extract-timestamp.outputs.timestamp }}
                        text: "🚫 *Merge canceled by ${{ steps.sender-mention.outputs.mention }}* ${{ steps.author-mention.outputs.mention }}."

    notify-build-failed-or-cancelled:
        name: Send message to the Slack about failed or cancelled build for PR with auto-merge
        runs-on: ubuntu-latest
        if: |
            github.event_name == 'workflow_run' &&
            (github.event.workflow_run.conclusion == 'failure' ||
            github.event.workflow_run.conclusion == 'cancelled')
        steps:
            -   name: Checkout repository
                uses: actions/checkout@v4
            -   name: Get PR with auto-merge enabled
                id: get-pr
                env:
                    GH_TOKEN: ${{ github.token }}
                    REPOSITORY: ${{ github.repository }}
                    HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
                run: |
                    PR_DATA=$(gh pr list --repo "$REPOSITORY" --head "$HEAD_BRANCH" --json number,url,title,body,author,autoMergeRequest --jq '.[] | select(.autoMergeRequest != null)')

                    if [ -n "$PR_DATA" ]; then
                        echo "PR_NUMBER=$(echo "$PR_DATA" | jq -r '.number')" >> $GITHUB_OUTPUT
                        echo "PR_URL=$(echo "$PR_DATA" | jq -r '.url')" >> $GITHUB_OUTPUT

                        ESCAPED_TITLE=$(echo "$PR_DATA" | jq -r '.title' | tr -d '\n' | jq -Rs '.' | sed 's/^"//;s/"$//')
                        echo "PR_TITLE<<EOF" >> $GITHUB_OUTPUT
                        echo "$ESCAPED_TITLE" >> $GITHUB_OUTPUT
                        echo "EOF" >> $GITHUB_OUTPUT

                        echo "AUTHOR=$(echo "$PR_DATA" | jq -r '.author.login')" >> $GITHUB_OUTPUT

                        echo "PR_BODY<<EOF" >> $GITHUB_OUTPUT
                        echo "$PR_DATA" | jq -r '.body' >> $GITHUB_OUTPUT
                        echo "EOF" >> $GITHUB_OUTPUT
                    fi
            -   name: Extract message timestamp
                id: extract-timestamp
                if: steps.get-pr.outputs.PR_NUMBER != ''
                uses: ./.github/actions/extract-slack-timestamp
                with:
                    pr-body: ${{ steps.get-pr.outputs.PR_BODY }}
            -   name: Resolve author Slack mention
                id: author-mention
                if: steps.get-pr.outputs.AUTHOR != ''
                uses: ./.github/actions/resolve-slack-mention
                with:
                    github-username: ${{ steps.get-pr.outputs.AUTHOR }}
                    slack-github-map: ${{ secrets.SLACK_GITHUB_MAP }}
            -   name: Resolve sender Slack mention
                id: sender-mention
                if: github.event.workflow_run.conclusion == 'cancelled'
                uses: ./.github/actions/resolve-slack-mention
                with:
                    github-username: ${{ github.event.sender.login }}
                    slack-github-map: ${{ secrets.SLACK_GITHUB_MAP }}
            -   name: Build failed
                if: |
                    steps.get-pr.outputs.PR_NUMBER != '' &&
                    steps.extract-timestamp.outputs.timestamp != '' &&
                    github.event.workflow_run.conclusion == 'failure'
                uses: slackapi/slack-github-action@v2.1.1
                with:
                    errors: true
                    method: chat.postMessage
                    token: ${{ secrets.SLACK_BOT_TOKEN }}
                    payload: |
                        channel: ${{ secrets.SLACK_CHANNEL_ID }}
                        thread_ts: ${{ steps.extract-timestamp.outputs.timestamp }}
                        text: "❌ *Build failed!* ${{ steps.author-mention.outputs.mention }}"
            -   name: Check if cancelled by concurrency
                id: check-concurrency
                if: github.event.workflow_run.conclusion == 'cancelled'
                env:
                    GH_TOKEN: ${{ github.token }}
                    REPOSITORY: ${{ github.repository }}
                    WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
                    HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
                    RUN_ID: ${{ github.event.workflow_run.id }}
                run: |
                    # Check if there's a newer run for the same workflow and branch
                    NEWER_RUN=$(gh run list --repo "$REPOSITORY" --workflow "$WORKFLOW_NAME" --branch "$HEAD_BRANCH" --json databaseId,status --jq "[.[] | select(.databaseId > $RUN_ID)] | length")
                    if [ "$NEWER_RUN" -gt 0 ]; then
                        echo "CANCELLED_BY_CONCURRENCY=true" >> $GITHUB_OUTPUT
                    else
                        echo "CANCELLED_BY_CONCURRENCY=false" >> $GITHUB_OUTPUT
                    fi
            -   name: Build cancelled
                if: |
                    steps.get-pr.outputs.PR_NUMBER != '' &&
                    steps.extract-timestamp.outputs.timestamp != '' &&
                    github.event.workflow_run.conclusion == 'cancelled' &&
                    steps.check-concurrency.outputs.CANCELLED_BY_CONCURRENCY != 'true'
                uses: slackapi/slack-github-action@v2.1.1
                with:
                    errors: true
                    method: chat.postMessage
                    token: ${{ secrets.SLACK_BOT_TOKEN }}
                    payload: |
                        channel: ${{ secrets.SLACK_CHANNEL_ID }}
                        thread_ts: ${{ steps.extract-timestamp.outputs.timestamp }}
                        text: "⚠️ *Build cancelled by ${{ steps.sender-mention.outputs.mention }}!* ${{ steps.author-mention.outputs.mention }}"
