name: Nightly verification
on:
    workflow_dispatch:
        inputs:
            target-ref:
                description: 'Branch to verify (dispatched in shopsys/shopsys and all split repositories)'
                required: false
                default: '20.0'
# The nightly run is never cancelled by a newer one — it queues instead.
concurrency:
    group: nightly-verification-${{ github.ref }}
    cancel-in-progress: false
jobs:
    prepare:
        name: Derive dispatch targets from the package list
        runs-on: ubuntu-22.04
        outputs:
            packages: ${{ steps.targets.outputs.packages }}
            target-ref: ${{ steps.ref.outputs.target-ref }}
        steps:
            -   name: Checkout repository
                uses: actions/checkout@v7
            -   name: Check required secrets
                env:
                    ACTIONS_GIT_PUSH_TOKEN: ${{ secrets.ACTIONS_GIT_PUSH_TOKEN }}
                    SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
                    SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
                run: |
                    MISSING=""
                    for SECRET in ACTIONS_GIT_PUSH_TOKEN SLACK_BOT_TOKEN SLACK_CHANNEL_ID; do
                        [[ -z "${!SECRET}" ]] && MISSING="${MISSING} ${SECRET}"
                    done
                    if [[ -n "$MISSING" ]]; then
                        echo "::error::missing required secrets:${MISSING}"
                        exit 1
                    fi
            -   name: Resolve target ref
                id: ref
                env:
                    INPUT_TARGET_REF: ${{ github.event.inputs.target-ref || '20.0' }}
                run: echo "target-ref=$INPUT_TARGET_REF" >> "$GITHUB_OUTPUT"
            -   name: Collect packages with a dispatchable CI workflow
                id: targets
                run: |
                    . .github/monorepo/monorepo_functions.sh
                    TARGETS=()
                    for PACKAGE in $(get_all_packages); do
                        [[ "$PACKAGE" == "project-base" ]] && continue
                        WORKFLOW="$(get_package_subdirectory "$PACKAGE")/.github/workflows/run-checks-tests.yaml"
                        [[ -f "$WORKFLOW" ]] || { echo "::notice::skipping ${PACKAGE} (no CI workflow)"; continue; }
                        grep -qE '^[[:space:]]*workflow_dispatch:' "$WORKFLOW" \
                            || echo "::warning::${PACKAGE} has no workflow_dispatch trigger — the nightly verification cannot dispatch it"
                        TARGETS+=("$PACKAGE")
                    done
                    COUNT=${#TARGETS[@]}
                    # A green nightly verification with an empty matrix is the worst possible
                    # failure of a verification tool — fail hard on silent drift instead.
                    if (( COUNT < 20 )); then
                        echo "::error::only ${COUNT} dispatch targets found, expected at least 20 — did run-checks-tests.yaml get renamed?"
                        exit 1
                    fi
                    echo "Found ${COUNT} split package targets: ${TARGETS[*]}"
                    echo "packages=$(printf '%s\n' "${TARGETS[@]}" | jq -R . | jq -sc .)" >> $GITHUB_OUTPUT

    main-build:
        name: Main build (docker-build.yaml)
        needs: prepare
        runs-on: ubuntu-22.04
        timeout-minutes: 60
        env:
            GH_TOKEN: ${{ secrets.ACTIONS_GIT_PUSH_TOKEN }}
        steps:
            -   name: Checkout repository
                uses: actions/checkout@v7
            -   name: Dispatch and wait
                id: dispatch
                uses: ./.github/actions/dispatch-and-wait
                with:
                    target-repo: ${{ github.repository }}
                    target-workflow: docker-build.yaml
                    target-ref: ${{ needs.prepare.outputs.target-ref }}
                    wait-timeout-min: 55
            -   name: Write result file
                run: |
                    jq -n --arg target "main-build" \
                          --arg repo "${{ github.repository }}" \
                          --arg conclusion "${{ steps.dispatch.outputs.conclusion }}" \
                          --arg run_id "${{ steps.dispatch.outputs.run-id }}" \
                          --arg run_url "${{ steps.dispatch.outputs.run-url }}" \
                          '{target: $target, repo: $repo, conclusion: $conclusion, run_id: $run_id, run_url: $run_url}' \
                          > result-main-build.json
            -   name: Upload result
                uses: actions/upload-artifact@v7
                with:
                    name: nightly-result-main-build
                    path: result-main-build.json

    split-packages:
        name: ${{ matrix.package }}
        needs: prepare
        runs-on: ubuntu-22.04
        timeout-minutes: 20
        strategy:
            fail-fast: false
            max-parallel: 8
            matrix:
                package: ${{ fromJSON(needs.prepare.outputs.packages) }}
        env:
            GH_TOKEN: ${{ secrets.ACTIONS_GIT_PUSH_TOKEN }}
        steps:
            -   name: Checkout repository
                uses: actions/checkout@v7
            -   name: Dispatch and wait
                id: dispatch
                uses: ./.github/actions/dispatch-and-wait
                with:
                    target-repo: shopsys/${{ matrix.package }}
                    target-workflow: run-checks-tests.yaml
                    target-ref: ${{ needs.prepare.outputs.target-ref }}
                    wait-timeout-min: 15
            # GitHub cannot aggregate outputs across matrix legs (the last finished leg
            # silently overwrites the others) — each leg uploads its result as an artifact.
            -   name: Write result file
                run: |
                    jq -n --arg target "${{ matrix.package }}" \
                          --arg repo "shopsys/${{ matrix.package }}" \
                          --arg conclusion "${{ steps.dispatch.outputs.conclusion }}" \
                          --arg run_id "${{ steps.dispatch.outputs.run-id }}" \
                          --arg run_url "${{ steps.dispatch.outputs.run-url }}" \
                          '{target: $target, repo: $repo, conclusion: $conclusion, run_id: $run_id, run_url: $run_url}' \
                          > "result-${{ matrix.package }}.json"
            -   name: Upload result
                uses: actions/upload-artifact@v7
                with:
                    name: nightly-result-${{ matrix.package }}
                    path: result-${{ matrix.package }}.json

    project-base:
        name: project-base (full stack)
        needs: prepare
        runs-on: ubuntu-22.04
        timeout-minutes: 65
        env:
            GH_TOKEN: ${{ secrets.ACTIONS_GIT_PUSH_TOKEN }}
        steps:
            -   name: Checkout repository
                uses: actions/checkout@v7
            -   name: Dispatch and wait
                id: dispatch
                uses: ./.github/actions/dispatch-and-wait
                with:
                    target-repo: shopsys/project-base
                    target-workflow: run-checks-tests.yaml
                    target-ref: ${{ needs.prepare.outputs.target-ref }}
                    wait-timeout-min: 60
            -   name: Write result file
                run: |
                    jq -n --arg target "project-base" \
                          --arg repo "shopsys/project-base" \
                          --arg conclusion "${{ steps.dispatch.outputs.conclusion }}" \
                          --arg run_id "${{ steps.dispatch.outputs.run-id }}" \
                          --arg run_url "${{ steps.dispatch.outputs.run-url }}" \
                          '{target: $target, repo: $repo, conclusion: $conclusion, run_id: $run_id, run_url: $run_url}' \
                          > result-project-base.json
            -   name: Upload result
                uses: actions/upload-artifact@v7
                with:
                    name: nightly-result-project-base
                    path: result-project-base.json

    aggregate:
        name: Aggregate results
        if: always()
        needs: [prepare, main-build, split-packages, project-base]
        runs-on: ubuntu-22.04
        outputs:
            HAS_FAILURE: ${{ steps.report.outputs.HAS_FAILURE }}
        steps:
            -   name: Download result artifacts
                uses: actions/download-artifact@v8
                with:
                    pattern: nightly-result-*
                    merge-multiple: true
                    path: results
            -   name: Build report
                id: report
                env:
                    TARGET_REF: ${{ needs.prepare.outputs.target-ref }}
                run: |
                    jq -s 'sort_by(.target)' results/result-*.json > nightly-report.json

                    RESULT_COUNT=$(jq 'length' nightly-report.json)
                    EXPECTED_COUNT=$(( $(echo '${{ needs.prepare.outputs.packages }}' | jq 'length') + 2 ))
                    if (( RESULT_COUNT < EXPECTED_COUNT )); then
                        echo "::warning::only ${RESULT_COUNT}/${EXPECTED_COUNT} result files arrived — a dispatch job died before uploading"
                    fi

                    # success and superseded are OK; superseded means a real push delivered
                    # a fresher verification of the same branch during the night.
                    FAILED_TARGETS=$(jq -r '[.[] | select(.conclusion != "success" and .conclusion != "superseded") | .target] | sort | join(" ")' nightly-report.json)

                    {
                        echo "# Nightly verification of ${TARGET_REF}"
                        echo ""
                        echo "| Target | Conclusion | Run |"
                        echo "|---|---|---|"
                        jq -r '.[] | "| \(.target) | \(if .conclusion == "success" then "✅" elif .conclusion == "superseded" then "⏭️" else "❌" end) \(.conclusion) | \(if .run_url == "" then "—" else "[run](\(.run_url))" end) |"' nightly-report.json
                    } >> $GITHUB_STEP_SUMMARY

                    if [[ -n "$FAILED_TARGETS" ]]; then
                        echo "HAS_FAILURE=true" >> $GITHUB_OUTPUT
                        echo "FAILED_TARGETS=${FAILED_TARGETS}" >> $GITHUB_OUTPUT
                        echo "FAILED_COUNT=$(echo "$FAILED_TARGETS" | wc -w | tr -d ' ')" >> $GITHUB_OUTPUT
                        echo "SIGNATURE=$(echo "$FAILED_TARGETS" | sha1sum | cut -d' ' -f1)" >> $GITHUB_OUTPUT
                        echo "::error::failed targets: ${FAILED_TARGETS}"
                    else
                        echo "HAS_FAILURE=false" >> $GITHUB_OUTPUT
                        echo "FAILED_TARGETS=" >> $GITHUB_OUTPUT
                        echo "FAILED_COUNT=0" >> $GITHUB_OUTPUT
                        echo "SIGNATURE=" >> $GITHUB_OUTPUT
                    fi
            -   name: Upload report
                uses: actions/upload-artifact@v7
                with:
                    name: nightly-report
                    path: nightly-report.json
                    retention-days: 7
            # Noise suppression: the same failure signature two mornings in a row must not
            # produce the same loud message again, or people learn to filter the channel.
            # The state travels as an artifact of the previous completed run — no external storage.
            -   name: Load previous run state
                id: previous
                env:
                    GH_TOKEN: ${{ github.token }}
                    REF_NAME: ${{ github.ref_name }}
                    RUN_ID: ${{ github.run_id }}
                run: |
                    PREV_RUN=$(gh run list --repo "${{ github.repository }}" --workflow "Nightly verification" \
                        --branch "$REF_NAME" --status completed --limit 5 --json databaseId \
                        --jq "[.[] | select(.databaseId != ${RUN_ID})][0].databaseId // empty")
                    PREV_SIGNATURE=""
                    PREV_STREAK=0
                    if [[ -n "$PREV_RUN" ]]; then
                        gh run download "$PREV_RUN" --repo "${{ github.repository }}" -n nightly-slack-state -D prev-state 2>/dev/null || true
                        if [[ -f prev-state/nightly-slack-state.json ]]; then
                            PREV_SIGNATURE=$(jq -r '.signature // empty' prev-state/nightly-slack-state.json)
                            PREV_STREAK=$(jq -r '.streak // 0' prev-state/nightly-slack-state.json)
                        fi
                    fi
                    echo "PREV_SIGNATURE=${PREV_SIGNATURE}" >> $GITHUB_OUTPUT
                    echo "PREV_STREAK=${PREV_STREAK}" >> $GITHUB_OUTPUT
            -   name: Decide Slack message
                id: decision
                env:
                    SIGNATURE: ${{ steps.report.outputs.SIGNATURE }}
                    FAILED_TARGETS: ${{ steps.report.outputs.FAILED_TARGETS }}
                    FAILED_COUNT: ${{ steps.report.outputs.FAILED_COUNT }}
                    PREV_SIGNATURE: ${{ steps.previous.outputs.PREV_SIGNATURE }}
                    PREV_STREAK: ${{ steps.previous.outputs.PREV_STREAK }}
                    TARGET_REF: ${{ needs.prepare.outputs.target-ref }}
                    RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                run: |
                    # only failures are reported — a green night sends nothing
                    SEND="none"
                    STREAK=0
                    TEXT=""
                    if [[ -n "$SIGNATURE" && "$SIGNATURE" == "$PREV_SIGNATURE" ]]; then
                        SEND="repeat"
                        STREAK=$(( PREV_STREAK + 1 ))
                        TEXT="🔁 ${TARGET_REF} stále červená (${STREAK}. den) — stejné selhání: ${FAILED_TARGETS// /, } · <${RUN_URL}|detail běhu>"
                    elif [[ -n "$SIGNATURE" ]]; then
                        SEND="full"
                        STREAK=1
                        TEXT="🔴 *Noční verifikace ${TARGET_REF}: ${FAILED_COUNT} padlých cílů* — ${FAILED_TARGETS// /, } · <${RUN_URL}|detail běhu>"
                    fi
                    echo "SEND=${SEND}" >> $GITHUB_OUTPUT
                    echo "TEXT=${TEXT}" >> $GITHUB_OUTPUT
                    jq -n --arg signature "$SIGNATURE" --argjson streak "$STREAK" \
                        '{signature: $signature, streak: $streak}' > nightly-slack-state.json
            -   name: Upload Slack state
                uses: actions/upload-artifact@v7
                with:
                    name: nightly-slack-state
                    path: nightly-slack-state.json
                    retention-days: 7
            -   name: Send Slack notification
                if: steps.decision.outputs.SEND != 'none'
                uses: slackapi/slack-github-action@v4.0.0
                with:
                    errors: true
                    method: chat.postMessage
                    token: ${{ secrets.SLACK_BOT_TOKEN }}
                    payload: |
                        channel: ${{ secrets.SLACK_CHANNEL_ID }}
                        text: ${{ toJSON(steps.decision.outputs.TEXT) }}
            -   name: Fail on any failed target
                if: steps.report.outputs.HAS_FAILURE == 'true'
                run: exit 1

    triage:
        name: AI triage of failed targets
        needs: [prepare, aggregate]
        if: always() && needs.aggregate.outputs.HAS_FAILURE == 'true'
        runs-on: ubuntu-22.04
        # an AI fix pulls the CI image and re-runs the failing check inside it — needs headroom
        timeout-minutes: 60
        env:
            GH_TOKEN: ${{ secrets.ACTIONS_GIT_PUSH_TOKEN }}
        steps:
            # the PAT (not github.token) so that a pushed fix branch actually triggers its CI
            -   name: GIT checkout
                uses: actions/checkout@v7
                with:
                    token: ${{ secrets.ACTIONS_GIT_PUSH_TOKEN }}
                    fetch-depth: 0
            # prerequisites are enforced by code — fail here with a clear name, not inside the agent run
            -   name: Check triage prerequisites
                env:
                    JIRA_URL: ${{ secrets.JIRA_URL }}
                    JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
                    JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
                    CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
                run: |
                    MISSING=""
                    for SECRET in JIRA_URL JIRA_EMAIL JIRA_TOKEN CLAUDE_CODE_OAUTH_TOKEN; do
                        [[ -z "${!SECRET}" ]] && MISSING="${MISSING} ${SECRET}"
                    done
                    if [[ -n "$MISSING" ]]; then
                        echo "::error::missing required secrets:${MISSING}"
                        exit 1
                    fi
                    # the Jira MCP server and the patch generation both run as Docker containers
                    docker version > /dev/null || { echo "::error::docker is not available on this runner"; exit 1; }
                    docker pull -q ghcr.io/sooperset/mcp-atlassian@sha256:d2bb29af785bc44bbb16eee4e577eceabe208cdbe1bcac80c4be9915864de45d > /dev/null || { echo "::error::cannot pull the Jira MCP image"; exit 1; }
            -   name: Download nightly report
                uses: actions/download-artifact@v8
                with:
                    name: nightly-report
            -   name: Run Claude nightly triage
                uses: anthropics/claude-code-action@v1
                env:
                    GH_TOKEN: ${{ secrets.ACTIONS_GIT_PUSH_TOKEN }}
                with:
                    github_token: ${{ secrets.ACTIONS_GIT_PUSH_TOKEN }}
                    claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
                    # full transcript in the job log — permission denials are invisible without it
                    show_full_output: true
                    # the push allowlist rule needs a trailing glob to cover the date-suffixed branch, but a
                    # trailing glob also matches extra arguments (a second refspec could reach 20.0) — this
                    # PreToolUse hook enforces the exact allowed push form; the guard script lives under
                    # .github/, which the agent itself is forbidden to modify
                    settings: |
                        {
                          "hooks": {
                            "PreToolUse": [
                              {
                                "matcher": "Bash",
                                "hooks": [
                                  {"type": "command", "command": "python3 .github/scripts/nightly-triage-push-guard.py"}
                                ]
                              }
                            ]
                          }
                        }
                    prompt: "/nightly-triage ${{ github.repository }} ${{ github.run_id }}"
                    # wildcard mcp__jira__* silently does not work in allowedTools — the Jira tools must be listed explicitly.
                    # The allowlist is the security boundary (the skill's guardrails are intent, not enforcement),
                    # so it is deliberately narrow: gh api is GET-only, docker run is pinned to the CI images with
                    # fixed container names, and git push only reaches nightly-autofix/* branches — never 20.0.
                    claude_args: |
                        --model claude-opus-4-8
                        --max-turns 100
                        --mcp-config '{"mcpServers":{"jira":{"type":"stdio","command":"docker","args":["run","--rm","-i","-e","JIRA_URL","-e","JIRA_USERNAME","-e","JIRA_API_TOKEN","ghcr.io/sooperset/mcp-atlassian@sha256:d2bb29af785bc44bbb16eee4e577eceabe208cdbe1bcac80c4be9915864de45d"],"env":{"JIRA_URL":"${{ secrets.JIRA_URL }}","JIRA_USERNAME":"${{ secrets.JIRA_EMAIL }}","JIRA_API_TOKEN":"${{ secrets.JIRA_TOKEN }}"}}}}'
                        --allowedTools "Read,Grep,Glob,Write,Edit,Skill(adhoc-pr),Skill(commit),Skill(pr-description),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(git status:*),Bash(git fetch:*),Bash(git checkout:*),Bash(git branch:*),Bash(git apply:*),Bash(git add:*),Bash(git rm:*),Bash(git mv:*),Bash(git grep:*),Bash(git rev-parse:*),Bash(git config user.name),Bash(git commit:*),Bash(git push -u origin nightly-autofix/*),Bash(gh run view:*),Bash(gh run list:*),Bash(gh run download:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh pr create:*),Bash(gh pr edit:*),Bash(gh pr close:*),Bash(gh repo view:*),Bash(gh api --method GET:*),Bash(docker pull ghcr.io/shopsys/:*),Bash(docker run -d --name autofix-standards ghcr.io/shopsys/php-fpm:*),Bash(docker run -d --name autofix-translations ghcr.io/shopsys/php-fpm:*),Bash(docker run -d --name autofix-storefront ghcr.io/shopsys/storefront:*),Bash(docker run -d --name autofix-verify ghcr.io/shopsys/php-fpm:*),Bash(docker exec autofix-:*),Bash(docker cp:*),Bash(docker rm -f autofix-:*),Bash(sha1sum:*),Bash(date:*),Bash(cat:*),Bash(tail:*),mcp__jira__jira_search,mcp__jira__jira_get_issue,mcp__jira__jira_create_issue,mcp__jira__jira_update_issue,mcp__jira__jira_get_transitions,mcp__jira__jira_transition_issue"
            # the sandbox blocks Claude from writing to $GITHUB_STEP_SUMMARY directly —
            # the skill writes its report to a workspace file and this step publishes it
            -   name: Publish triage report to job summary
                if: always()
                run: |
                    [ -f nightly-triage-report.md ] && cat nightly-triage-report.md >> "$GITHUB_STEP_SUMMARY" || echo "No triage report was produced." >> "$GITHUB_STEP_SUMMARY"
            # job summaries are only readable in a browser session — the artifact makes the report reachable via gh
            -   name: Upload triage report
                if: always()
                uses: actions/upload-artifact@v7
                with:
                    name: nightly-triage-report
                    path: nightly-triage-report.md
                    if-no-files-found: ignore
                    retention-days: 7
