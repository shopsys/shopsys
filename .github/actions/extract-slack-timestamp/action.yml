name: 'Extract Slack Timestamp'
description: 'Extracts Slack message timestamp from PR description HTML comment'
inputs:
    pr-number:
        description: 'PR number to fetch the body from (avoids parameter injection by fetching fresh data)'
        required: true
outputs:
    timestamp:
        description: 'Extracted Slack timestamp (e.g., 1234567890.123456) or empty string if not found/invalid'
        value: ${{ steps.extract.outputs.timestamp }}
runs:
    using: 'composite'
    steps:
        -   name: Extract and validate timestamp
            id: extract
            shell: bash
            env:
                PR_NUMBER: ${{ inputs.pr-number }}
            run: |
                PR_BODY=$(gh pr view "$PR_NUMBER" --json body --jq '.body')
                SLACK_TIMESTAMP=$(echo "$PR_BODY" | sed -n 's/.*<!-- SLACK_TIMESTAMP: \([0-9.]*\) -->.*/\1/p' | tail -1)
                if [ -n "$SLACK_TIMESTAMP" ] && ! echo "$SLACK_TIMESTAMP" | grep -qE '^[0-9]+\.[0-9]+$'; then
                    echo "::warning::Invalid Slack timestamp format: $SLACK_TIMESTAMP"
                    SLACK_TIMESTAMP=""
                fi
                echo "timestamp=$SLACK_TIMESTAMP" >> $GITHUB_OUTPUT
