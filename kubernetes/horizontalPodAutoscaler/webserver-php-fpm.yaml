apiVersion: autoscaling/v2beta2
kind: HorizontalPodAutoscaler
metadata:
  name: webserver-php-fpm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: webserver-php-fpm
  minReplicas: {{K8S_HPA_REPLICAS_MIN}}
  maxReplicas: {{K8S_HPA_REPLICAS_MAX}}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
