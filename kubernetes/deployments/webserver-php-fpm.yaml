apiVersion: apps/v1
kind: Deployment
metadata:
    name: webserver-php-fpm
    labels:
        app: webserver-php-fpm
spec:
    progressDeadlineSeconds: 3000
    strategy:
        type: RollingUpdate
    selector:
        matchLabels:
            app: webserver-php-fpm
    template:
        metadata:
            labels:
                app: webserver-php-fpm
        spec:
            hostAliases:
                -   ip: "127.0.0.1"
                    hostnames:
                        - "webserver-php-fpm"
                        - "php-fpm"
                        - "webserver"
            volumes:
                -   name: source-codes
                    emptyDir: {}
                -   name: domains-urls
                    configMap:
                        name: domains-urls
                -   name: parameters
                    configMap:
                        name: parameters
                -   name: nginx-default-config
                    configMap:
                        name: nginx-default-config
                -   name: nginx-configuration
                    configMap:
                        name: nginx-configuration
                        items:
                            -   key: nginx.conf
                                path: default.conf
                -   name: production-php-opcache
                    configMap:
                        name: production-php-opcache

            initContainers:
                -   name: copy-source-codes-to-volume
                    image: "{{TAG}}"
                    securityContext:
                        runAsUser: 33
                    command: ["sh", "-c", "cp -r -n /var/www/html/. /tmp/source-codes"]
                    volumeMounts:
                        -   name: source-codes
                            mountPath: /tmp/source-codes
                        -   name: domains-urls
                            mountPath: /var/www/html/config/domains_urls.yaml
                            subPath: domains_urls.yaml
                        -   name: parameters
                            mountPath: /var/www/html/config/parameters.yaml
                            subPath: parameters.yaml
            containers:
                -   image: "{{TAG}}"
                    name: php-fpm
                    resources:
                        limits:
                            cpu: "{{K8S_DEPLOY_PHPFPM_CPU_LIMIT}}"
                        requests:
                            cpu: "{{K8S_DEPLOY_PHPFPM_CPU_REQUEST}}"
                    securityContext:
                        runAsUser: 33
                    imagePullPolicy: Always
                    workingDir: /var/www/html
                    lifecycle:
                        preStop:
                            exec:
                                command:
                                    - sleep
                                    - '5'
                    volumeMounts:
                        -   name: source-codes
                            mountPath: /var/www/html
                        -   name: domains-urls
                            mountPath: /var/www/html/config/domains_urls.yaml
                            subPath: domains_urls.yaml
                        -   name: parameters
                            mountPath: /var/www/html/config/parameters.yaml
                            subPath: parameters.yaml
                        -   name: production-php-opcache
                            mountPath: /usr/local/etc/php/conf.d/php-opcache.ini
                            subPath: php-opcache.ini
                    env:
                        -   name: S3_API_HOST
                            value: "{{S3_API_HOST}}"
                        -   name: S3_API_USERNAME
                            value: "{{S3_API_USERNAME}}"
                        -   name: S3_API_PASSWORD
                            value: "{{S3_API_PASSWORD}}"
                        -   name: S3_API_BUCKET_NAME
                            value: "{{S3_API_BUCKET_NAME}}"
                        -   name: CDN_DOMAIN
                            value: "{{CDN_DOMAIN}}"
                        -   name: REDIS_PREFIX
                            value: "{{REDIS_PREFIX}}"
                        -   name: ELASTIC_SEARCH_INDEX_PREFIX
                            value: "{{ELASTIC_SEARCH_INDEX_PREFIX}}"
                -   image: nginx:1.13.10-alpine
                    name: webserver
                    resources:
                        limits:
                            cpu: "{{K8S_DEPLOY_WEBSERVER_CPU_LIMIT}}"
                        requests:
                            cpu: "{{K8S_DEPLOY_WEBSERVER_CPU_REQUEST}}"
                    ports:
                        -   containerPort: 8080
                            name: http
                    livenessProbe:
                        initialDelaySeconds: 30
                        periodSeconds: 5
                        httpGet:
                            path: /health
                            port: 80
                    readinessProbe:
                        httpGet:
                            path: /health
                            port: 80
                        initialDelaySeconds: 5
                        periodSeconds: 5
                    volumeMounts:
                        -   name: nginx-default-config
                            mountPath: /etc/nginx/nginx.conf
                            subPath: nginx.conf
                        -   name: nginx-configuration
                            mountPath: /etc/nginx/conf.d
                        -   name: source-codes
                            mountPath: /var/www/html
                    lifecycle:
                        preStop:
                            exec:
                                command: [
                                    'sh', '-c',
                                    'sleep 5 && /usr/sbin/nginx -s quit'
                                ]
            imagePullSecrets:
                -   name: dockerregistry
