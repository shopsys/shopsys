-   op: add
    path: /spec/template/spec/initContainers/-
    value:
        name: init-application
        image: "{{TAG}}"
        command: ["sh", "-c", "cd /var/www/html && ./phing clean clean dirs-create db-import-basic-structure db-migrations domains-data-create product-search-create-structure product-search-export-products grunt assets error-pages-generate warmup"]
        securityContext:
            runAsUser: 33
        volumeMounts:
            -   name: source-codes
                mountPath: /var/www/html
            -   name: domains-urls
                mountPath: /var/www/html/config/domains_urls.yml
                subPath: domains_urls.yml
            -   name: parameters
                mountPath: /var/www/html/config/parameters.yml
                subPath: parameters.yml
        env:
            -   name: S3_API_HOST
                value: "{{S3_API_HOST}}"
            -   name: S3_API_USERNAME
                value: "{{S3_API_USERNAME}}"
            -   name: S3_API_PASSWORD
                value: "{{S3_API_PASSWORD}}"
            -   name: S3_API_BUCKET_NAME
                value: "{{S3_API_BUCKET_NAME}}"
            -   name: REDIS_PREFIX
                value: "{{REDIS_PREFIX}}"
            -   name: ELASTIC_SEARCH_INDEX_PREFIX
                value: "{{ELASTIC_SEARCH_INDEX_PREFIX}}"
